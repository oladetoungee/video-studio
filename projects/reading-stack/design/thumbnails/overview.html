<!doctype html><html><head><meta charset="utf-8"><link rel="stylesheet" href="lib/base.css">
<style>
html,body{width:2000px;height:auto;overflow:visible;background:var(--ink)}
.wrap{padding:56px 56px 40px}
.top{display:flex;justify-content:space-between;align-items:baseline;color:var(--white);margin-bottom:40px}
.top h1{font-family:'Bricolage';font-weight:800;font-size:64px;letter-spacing:-.03em;text-transform:uppercase}
.top .mono{color:rgba(255,255,255,.55)}
.g{display:grid;grid-template-columns:repeat(3,1fr);gap:44px 36px}
.c img{width:100%;display:block;border-radius:10px}
.c .n{font-family:'DM Mono';font-weight:500;font-size:15px;letter-spacing:.12em;text-transform:uppercase;color:var(--orange);margin:14px 0 6px}
.c .ti{font-family:'Archivo';font-weight:700;font-size:22px;line-height:1.25;color:var(--white)}
.c .d{font-family:'Archivo';font-weight:400;font-size:16px;color:rgba(255,255,255,.55);margin-top:4px}
</style></head><body><div class="wrap">
<div class="top"><h1>My current reading stack / thumbnails</h1><span class="mono">title shown under each option</span></div>
<div class="g" id="g"></div></div>
<script>
(async () => {
  const dirs = await (await fetch('directions/index.json')).json();
  const g = document.getElementById('g');
  for (const d of dirs) {
    const c = await (await fetch('directions/' + d + '/content.json')).json();
    const el = document.createElement('div'); el.className = 'c';
    el.innerHTML = '<img src="../../outputs/thumbnails/' + d + '.png"><div class="n">' + d + '</div><div class="ti">' + c.title + '</div><div class="d">' + c.direction + '</div>';
    g.appendChild(el);
  }
  await document.fonts.ready;
  await Promise.all([...document.images].map(i => i.complete ? 0 : new Promise(r => { i.onload = i.onerror = r; })));
  window.__ready = true;
})();
</script></body></html>
