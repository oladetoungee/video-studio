const PAUSE=.6,END_HOLD=4;

 SEGS=[];SEGOF=[];for(let i=0;i<N;i++){const key=BEATS[i][0];if(!SEGS.length||SEGS[SEGS.length-1].key!==key)SEGS.push({key,i0:i,i1:i});else SEGS[SEGS.length-1].i1=i;SEGOF[i]=SEGS.length-1;}buildCues();}
const beatEnd=i=>i<N-1?TIMES[i+1]:TOTAL;
function beatAt(T){if(T<TIMES[0])return 0;let lo=0,hi=N-1;while(lo<hi){const m=(lo+hi+1)>>1;if(TIMES[m]<=T)lo=m;else hi=m-1;}return lo;}
function segState(seg,T){const i0=seg.i0;let k=0;for(let i=i0;i<=seg.i1;i++)if(T>=TIMES[i])k=i-i0;const st=i0===0?0:TIMES[i0];return{t:T-st,T,k,dur:beatEnd(seg.i1)-st,a:i=>T-TIMES[i0+i],bd:i=>beatEnd(i0+i)-TIMES[i0+i],bf:i=>clamp01((T-TIMES[i0+i])/(beatEnd(i0+i)-TIMES[i0+i]))};}
function drawSeg(seg,T){SCENE=seg.key;IDC={};GA=1;try{S[seg.key](segState(seg,T));}catch(e){GA=1;T_err(seg.key,e);}GA=1;}
function T_err(k,e){ctx.save();ctx.fillStyle=RED;ctx.font='24px sans-serif';ctx.fillText('Scene error: '+k,40,60);ctx.restore();if(!T_err.l){console.error(k,e);T_err.l=1;}}
function chunks(text){const sent=text.match(/[^.?!]+[.?!]*\s*/g)||[text];const out=[];for(let s of sent){s=s.trim();if(!s)continue;const w=s.split(' ');if(w.length<=16){out.push(s);continue;}const parts=s.split(/(?<=,)\s+/);let cur='';for(const p of parts){const t=cur?cur+' '+p:p;if(t.split(' ').length>16&&cur){out.push(cur);cur=p;}else cur=t;}if(cur){const ww=cur.split(' ');if(ww.length>18){const h=Math.ceil(ww.length/2);out.push(ww.slice(0,h).join(' '));out.push(ww.slice(h).join(' '));}else out.push(cur);}}return out.length?out:[text];}
function captionAt(T){const i=beatAt(T);if(T<TIMES[i])return null;const speak=Math.max(.5,DURS[i]-PAUSE*.6),e=T-TIMES[i];if(e>speak+.3)return null;const cs=CHUNKS[i],tot=cs.reduce((m,c)=>m+c.split(' ').length,0);let acc=0;for(const c of cs){const d=c.split(' ').length/tot*speak;if(e<acc+d)return[i,c];acc+=d;}return[i,cs[cs.length-1]];}

  if(!sfxMaster){sfxMaster=actx.createGain();sfxMaster.gain.value=SFX_LEVEL;sfxMaster.connect(actx.destination);}if(RS)sfxMaster.connect(adest);actx.resume();adest.stream.getAudioTracks().forEach(t=>stream.addTrack(t));hasAudio=true;}catch(e){}}
 const types=hasAudio?['video/mp4;codecs=avc1.640033,mp4a.40.2','video/mp4;codecs=avc1,mp4a.40.2','video/mp4','video/webm;codecs=vp9,opus','video/webm']:['video/mp4;codecs=avc1.640033','video/mp4;codecs=avc1','video/mp4','video/webm;codecs=vp9','video/webm'];
 const mime=types.find(t=>MediaRecorder.isTypeSupported(t))||'';let parts=[];
 try{rec=new MediaRecorder(stream,mime?{mimeType:mime,videoBitsPerSecond:q>1?45e6:18e6}:{});}catch(e){CLIP=null;NOTURN=-1;if(q!==1)setLayout(ASPECT,1);CAPTIONS=REC_PREV_CAP;frame();status('Recording is not available in this view. Open the studio link in Chrome.');return;}
 const name=PROJECT+'_'+r.name+'_'+ASPECT.replace(':','x')+'_'+(q>1?'4k':'1080p')+(RC?'':'_nocaptions')+(RS?'':'_nosfx');
 rec.ondataavailable=e=>{if(e.data.size)parts.push(e.data);};rec.onstop=()=>{if(RS&&sfxMaster&&adest)try{sfxMaster.disconnect(adest);}catch(e){}if(QUAL!==1)setLayout(ASPECT,1);CAPTIONS=REC_PREV_CAP;$('capt').setAttribute('aria-pressed',String(CAPTIONS));frame();$('rec').classList.remove('on');$('rec').textContent='● Record clip';const b=new Blob(parts,{type:mime||'video/webm'});download(b,name+'.'+(mime.includes('mp4')?'mp4':'webm'));status('Recording finished: '+name+' ('+(b.size/1e6).toFixed(1)+' MB).');};
 rec.start(1000);$('rec').classList.add('on');$('rec').textContent='■ Stop recording';status('Recording '+r.label.toLowerCase()+' ('+(r.end-r.start).toFixed(1)+' s'+(RS?', with sound effects':', no sound effects')+'). Keep this tab visible.');play();};

/* contact sheet (#sheet) */
function sheet(){const cols=8,tw=240,th=135,rows=Math.ceil(N/cols);const out=mk(cols*tw,rows*th),ox=out.getContext('2d');CAPTIONS=false;for(let i=0;i<N;i++){render(TIMES[i]+DURS[i]*.78);ox.drawImage(cv,(i%cols)*tw,Math.floor(i/cols)*th,tw,th);ox.fillStyle='#b63a26';ox.font='12px monospace';ox.fillText(i+' '+BEATS[i][0],(i%cols)*tw+4,Math.floor(i/cols)*th+13);}cv.width=out.width;cv.height=out.height;cv.getContext('2d').drawImage(out,0,0);$('stage').style.aspectRatio=out.width+'/'+out.height;}

async function boot(){try{const pr=JSON.parse(localStorage.getItem('studio:prefs')||'{}');if(FRAMES[pr.aspect])$('aspect').value=pr.aspect;$('zoom').checked=!!pr.zoom;if(pr.sfx===false){SFX_ON=false;$('sfx').setAttribute('aria-pressed','false');}if(pr.level!=null){SFX_LEVEL=pr.level;$('sfxLevel').value=Math.round(pr.level*100);}if(pr.recSfx===false)$('recSfx').checked=false;if(pr.sketch===false){SKETCH_ON=false;$('sketchOn').checked=false;}}catch(e){}
 ASPECT=$('aspect').value;ZOOM=$('zoom').checked;$('vertOpts').hidden=ASPECT!=='9:16';setLayout(ASPECT,1);
 await connectStore();await loadLibrary();LOADED=JSON.parse(JSON.stringify(EDITS));saveState(SERVER?'Saving into '+PROJECT+'/edits.json. Every change saves by itself.':'');refreshVersions();

 try{await Promise.race([Promise.all(['600 32px Caveat','400 32px Newsreader','italic 500 32px Newsreader','600 32px Newsreader'].map(f=>document.fonts.load(f))),new Promise(r=>setTimeout(r,4000))]);}catch(e){}
 $('loading').hidden=true;if(location.hash==='#sheet'){setLayout('16:9');sheet();return;}
 new ResizeObserver(()=>{if(editing)drawHits();}).observe($('stage'));seek(2.4);requestAnimationFrame(tick);}
boot();
