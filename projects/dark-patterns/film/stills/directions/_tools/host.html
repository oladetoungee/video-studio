<!doctype html>
<html><head><meta charset="utf-8"><title>Direction render</title>
<link rel="stylesheet" href="/studio/runtime/fonts.css">
<style>
@font-face{font-family:"Young Serif";src:url(/dirs/_fonts/YoungSerif-Regular.ttf)}
@font-face{font-family:"Hanken Grotesk";font-weight:100 900;src:url(/dirs/_fonts/HankenGrotesk.ttf)}
@font-face{font-family:"Martian Mono";font-weight:100 800;src:url(/dirs/_fonts/MartianMono.ttf)}
@font-face{font-family:"Space Grotesk";font-weight:300 700;src:url(/dirs/_fonts/SpaceGrotesk.ttf)}
@font-face{font-family:"Space Mono";font-weight:400;src:url(/dirs/_fonts/SpaceMono-Regular.ttf)}
@font-face{font-family:"Space Mono";font-weight:700;src:url(/dirs/_fonts/SpaceMono-Bold.ttf)}
@font-face{font-family:Geist;font-weight:100 900;src:url(/dirs/_fonts/Geist.ttf)}
@font-face{font-family:"Geist Mono";font-weight:100 900;src:url(/dirs/_fonts/GeistMono.ttf)}
@font-face{font-family:"DM Serif Display";font-style:normal;src:url(/dirs/_fonts/DMSerifDisplay-Regular.ttf)}
@font-face{font-family:"DM Serif Display";font-style:italic;src:url(/dirs/_fonts/DMSerifDisplay-Italic.ttf)}
@font-face{font-family:Anton;src:url(/dirs/_fonts/Anton-Regular.ttf)}
html,body{margin:0;background:#000}canvas{display:block}</style></head>
<body><canvas id="c" width="1920" height="1080"></canvas>
<script src="/studio/runtime/core.js"></script>
<script src="/studio/runtime/motion.js"></script>
<script src="/studio/runtime/house.js"></script>
<script src="/studio/runtime/boot.js"></script>
<script>
// Same as studio/runtime/film.html, for a direction folder served as /p/dp-<X>/film/ (no edits, no captions).
window.BUILD_ERROR = null;
(async () => {
  try {
    const q = new URLSearchParams(location.search); const cv = document.getElementById('c');
    await bootFilm({ slug: q.get('slug'), canvas: cv, aspect: q.get('aspect') || '16x9', edits: false });
    window.grab = (t, qq) => { renderFrame(t); return cv.toDataURL('image/jpeg', qq || 0.92); };
    window.grabPNG = (t) => { renderFrame(t); return cv.toDataURL('image/png'); };
    window.meta = () => FILM.meta();
  } catch (e) { window.BUILD_ERROR = String(e && e.stack || e); console.error(e); }
  window.READY = true;
})();
</script></body></html>
