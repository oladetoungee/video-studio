<!doctype html><html><head><meta charset="utf-8"><link rel="stylesheet" href="../../lib/set.css"><style>
/* copies Thumbnails 81 (yt-28 "ZERO -> DATA SCIENTIST / 6 MONTHS!"): the creator centred, a boxed word top left and a boxed word top
   right joined by a curved arrow over her head, one tilted tag at the bottom. Font 66 (Oswald Bold, Thumbnails 87: #111111 on blue #2FA8E0). */
@font-face { font-family: 'Oswald'; src: url('../../fonts/Oswald-Variable.ttf') format('truetype'); font-weight: 200 700; }
.t{background:var(--ground,#2FA8E0)}
.cut{left:var(--cl,130px);width:var(--cw,800px);bottom:var(--cb,-30px);filter:drop-shadow(0 18px 30px rgba(0,0,0,.3))}
.box{position:absolute;top:44px;font-family:'Oswald';font-weight:700;text-align:center;padding:14px 30px 18px;line-height:1;box-shadow:0 14px 30px rgba(0,0,0,.3)}
.box .l{font-size:38px;letter-spacing:.02em}
.box .p{font-size:132px;letter-spacing:-.01em;margin-top:6px}
.b1{left:50px;background:#FFFFFF;color:#111111;transform:rotate(-3deg)}
.b2{right:50px;background:#111111;color:#FFFFFF;transform:rotate(3deg)}
.b2 .p{color:#FF4B3E}
.b2 .x{font-family:'Oswald';font-weight:700;font-size:62px;color:#FFFFFF;margin-top:4px}
.arr{position:absolute;inset:0;width:1280px;height:720px}
.tag{left:50%;bottom:44px;translate:-50% 0;rotate:-4deg;background:#111111;color:#FFFFFF;font-family:'Oswald';font-weight:700;font-size:64px;line-height:1;padding:10px 28px 14px;white-space:nowrap}
</style></head><body><div class="t">
<img class="cut z2" data-img="me" src="../../assets/shoot/1564-cut.png" alt="">
<svg class="arr z3" viewBox="0 0 1280 720" fill="none" stroke="#FFFFFF" stroke-width="10" stroke-linecap="round" stroke-linejoin="round">
 <path d="M330 100 C 460 26, 640 26, 742 86"/><path d="M704 76 L 744 88 L 724 124"/>
</svg>
<div class="box b1 z4" data-move="cart"><div class="l" data-k="l1"></div><div class="p" data-k="p1"></div></div>
<div class="box b2 z4" data-move="checkout"><div class="l" data-k="l2"></div><div class="p" data-k="p2"></div><div class="x" data-k="x2"></div></div>
<div class="a tag z5" data-k="hook"></div>
</div><script src="../../lib/bind.js"></script></body></html>
