<!doctype html><html><head><meta charset="utf-8"><title>A · One 24 hours</title>
<link rel="stylesheet" href="../_shared/fonts.css"></head><body>
<script src="../_shared/clips.js"></script>
<script src="../_shared/lib.js"></script>
<script>
/* A · ONE 24 HOURS. The whole film is one 24-hour dial: her line "you have the same one 24 hours".
 * Grounds: night #101418 (after 5 pm, the study half of her day) and screen white #F3F6F8 (cool, not paper). Accent cyan #29B6E8 = YOUR time (study blocks, and the word 'one'), nothing else.
 * Round 2 (critic): no warm paper, no serif accent (both read as her old deck look); accent words are cyan Familjen instead.
 * Work = solid ink/bone arc. Class = hatched arc. A clash = the overlap outlined + "CLASH" in mono.
 * Type: Familjen Grotesk 700 (headlines), JetBrains Mono 500 (hours, labels >= 32 px), Source Serif 4 italic (one word). */
const C = { night: '#101418', sand: '#F3F6F8', bone: '#EEF1F4', ink: '#141414', midN: '#AEB6C0', midS: '#5D6670', cyan: '#29B6E8', track: { n: '#222A32', s: '#DCE3E8' } };
const FD = (s, w = 700) => `${w} ${s}px "Familjen Grotesk"`, FM = (s, w = 500) => `${w} ${s}px "JetBrains Mono"`, FS = (s) => `italic 500 ${s}px "Source Serif 4"`;
let g = null; const G = { n: { bg: C.night, fg: C.bone, mid: C.midN, track: C.track.n }, s: { bg: C.sand, fg: C.ink, mid: C.midS, track: C.track.s } };
const ang = (h) => -Math.PI / 2 + (h / 24) * Math.PI * 2;
/** the dial. o: cx, cy, r, th (ring thickness), p (draw-in 0..1), arcs [{a, b, kind: work|class|study, p}], hand (hour), labels */
function dial(o) {
  const { cx, cy, r, th } = o; const p = o.p == null ? 1 : o.p;
  ctx.save(); ctx.lineCap = 'butt';
  ctx.strokeStyle = g.track; ctx.lineWidth = th; ctx.beginPath(); ctx.arc(cx, cy, r, ang(0), ang(0) + Math.PI * 2 * p); ctx.stroke();
  for (let h = 0; h < 24; h++) { const a = ang(h), big = h % 6 === 0; const p2 = clamp(p * 24 - h); if (p2 <= 0) continue;
    const r1 = r + th / 2 + 10, r2 = r1 + (big ? 26 : 12); withA(p2, () => line(cx + Math.cos(a) * r1, cy + Math.sin(a) * r1, cx + Math.cos(a) * r2, cy + Math.sin(a) * r2, g.mid, big ? 4 : 2));
    if (big && o.hours !== false) withA(p2, () => { const rr = r2 + 34; txt(String(h).padStart(2, '0'), cx + Math.cos(a) * rr, cy + Math.sin(a) * rr + 12, FM(o.hs || 34), g.mid, 'center'); }); }
  (o.arcs || []).forEach((A) => { const q = A.p == null ? 1 : A.p; if (q <= 0) return; const a0 = ang(A.a), a1 = ang(A.a + (A.b - A.a) * q);
    if (A.kind === 'class') { ctx.save(); ctx.beginPath(); ctx.arc(cx, cy, r + th / 2, a0, a1); ctx.arc(cx, cy, r - th / 2, a1, a0, true); ctx.closePath(); ctx.clip();
      ctx.strokeStyle = g.fg; ctx.lineWidth = 5; for (let k = -r - th; k < r + th; k += 16) { line(cx + k - 200, cy - r - th, cx + k + 200, cy + r + th, g.fg, 5); }
      ctx.restore(); ctx.strokeStyle = g.fg; ctx.lineWidth = 3; ctx.beginPath(); ctx.arc(cx, cy, r + th / 2 - 1.5, a0, a1); ctx.stroke(); ctx.beginPath(); ctx.arc(cx, cy, r - th / 2 + 1.5, a0, a1); ctx.stroke(); }
    else { ctx.strokeStyle = A.kind === 'study' ? C.cyan : g.fg; ctx.lineWidth = th; ctx.beginPath(); ctx.arc(cx, cy, r, a0, a1); ctx.stroke(); }
    if (A.label && q > 0.6) { const am = ang((A.a + A.b) / 2); const lr = A.lr || (r - th / 2 - 46); const lx = cx + Math.cos(am) * lr, ly = cy + Math.sin(am) * lr;
      withA((q - 0.6) / 0.4, () => txt(A.label, lx, ly + 11, FM(A.ls || 32), A.kind === 'study' ? C.cyan : g.fg, A.align || 'center')); } });
  if (o.clash) { const [ca, cb, q] = o.clash; if (q > 0) { const a0 = ang(ca), a1 = ang(ca + (cb - ca) * q), rc = r + th / 2 + 22;
      ctx.strokeStyle = g.fg; ctx.lineWidth = 12; ctx.beginPath(); ctx.arc(cx, cy, rc, a0, a1); ctx.stroke();
      const am = ang((ca + cb) / 2) - 0.32, lr = rc + 120; withA(q, () => { fillRR(cx + Math.cos(am) * lr - 80, cy + Math.sin(am) * lr - 32, 160, 58, 4, g.fg); txt('CLASH', cx + Math.cos(am) * lr, cy + Math.sin(am) * lr + 11, FM(32, 700), g.bg, 'center', 'alphabetic', 2); }); } }
  if (o.hand != null) { const a = ang(o.hand); line(cx, cy, cx + Math.cos(a) * (r - th / 2 - 20), cy + Math.sin(a) * (r - th / 2 - 20), g.fg, 4); circle(cx, cy, 9, g.fg); }
  if (o.center) withA(o.centerA == null ? 1 : o.centerA, () => { txt(o.center, cx, cy + (o.cs || 120) * 0.34, FD(o.cs || 120), g.fg, 'center'); if (o.sub) txt(o.sub, cx, cy + (o.cs || 120) * 0.34 + 56, FM(32), g.mid, 'center', 'alphabetic', 2); });
  ctx.restore();
}
function ground(k) { g = G[k]; rect(0, 0, W, H, g.bg); }

/* ---- scenes ---- */
function sOpen(t) { // 0:00 "I have a full-time job ... full-time master's degree"
  ground('s'); const k = { job: P('full-time job', 0.5), dev: P('developer', 3), est: P('Estonia', 4), ms: P('Full-time master\'s degree', 7.4), since: P('since October 2025', 10) };
  const x = V(110, 80), y0 = V(330, 420), fs = V(104, 100);
  wordsOn(t, ['a', 'full-time', 'job'], [k.job.t - 0.3, k.job.w[0], k.job.w[1]], x, y0, FD(fs), g.fg);
  wordsOn(t, ['+', 'a', 'full-time'], [k.ms.t - 0.3, k.ms.t - 0.15, k.ms.w[0]], x, y0 + fs * 1.08, FD(fs), g.fg);
  wordsOn(t, ['master\'s'], [k.ms.w[1]], x, y0 + fs * 2.16, FD(fs), C.cyan);
  withA(ez(t, k.dev.t, 0.4), () => txt('developer · Tallinn, Estonia', x, y0 + fs * 2.16 + V(96, 90), FM(32), g.mid, 'left', 'alphabetic', 1));
  withA(ez(t, k.since.w[1], 0.4), () => txt('both since October 2025', x, y0 + fs * 2.16 + V(146, 140), FM(32), g.mid, 'left', 'alphabetic', 1));
  dial({ cx: V(1400, 540), cy: V(560, 1240), r: V(300, 300), th: 64, p: ez(t, 0.1, 1.2, 'outExpo'), hand: 8 + 13 * ez(t, k.job.w[0], 9, 'inOutQuart'),
    arcs: [{ a: 9, b: 17, kind: 'work', p: io(t, k.job.w[1], 0.8), label: 'work', ls: 34 }, { a: 18, b: 20.5, kind: 'class', p: io(t, k.ms.w[1], 0.6), label: 'class', lr: V(300, 300) + 32 + 120, ls: 34 }] });
}
function sRules(t) { // 0:45 "there's no limit to the number of hours" + "around 30 credits ... every semester"
  ground('n'); const k = { lim: P('no limit to the number of hours', 47), keep: P('keeping up with your studies', 50), ects: P('around 30 credits', 59) };
  const x = V(110, 80), fs = V(104, 104);
  wordsOn(t, ['No', 'limit'], [k.lim.w[0], k.lim.w[1]], x, V(300, 470), FD(fs), g.fg);
  wordsOn(t, ['on', 'hours.'], [k.lim.w[4], k.lim.w[5]], x, V(300, 470) + fs * 1.04, FD(fs), g.fg);
  wordsOn(t, ['But', 'stay', 'a'], [k.keep.t, k.keep.w[1], k.keep.w[2]], x, V(560, 730), FD(V(64, 64)), g.mid);
  wordsOn(t, ['full-time', 'student.'], [k.keep.w[3], k.keep.w[4]], x, V(632, 802), FD(V(64, 64)), g.mid);
  const cw = V(1010, 920), cx = V(800, 80);
  const h1 = clipCard(t, 'sie-hours', cx, V(230, 900), V(720, 700), { at: k.lim.t - 0.3, hlAt: k.lim.w[1], cs: 30 });
  clipCard(t, 'sie-ects', cx, V(230, 900) + h1 + 120, cw, { at: k.ects.t - 0.4, hlAt: k.ects.w[1], cs: 30 });
  // the dial strip under the headline: the whole day is allowed; the cyan sliver is the condition
}
function sTuesday(t) { // 4:33 "Tuesday night 7 to 9 in the evening, read two papers for Thursday's class"
  ground('s'); const k = { tue: P('Tuesday night', 273), read: P('read two papers', 276), thu: P('for Thursday\'s class', 277) };
  const x = V(110, 80);
  withA(ez(t, k.tue.t - 0.4, 0.4), () => txt('TUESDAY', x, V(250, 430), FM(36, 600), g.mid, 'left', 'alphabetic', 4));
  wordsOn(t, ['7', 'to', '9', 'pm:'], [k.tue.w[1] + 0.3, k.tue.w[1] + 0.45, k.tue.w[1] + 0.6, k.tue.w[1] + 0.75], x, V(380, 560), FD(V(120, 116)), g.fg);
  wordsOn(t, ['read', 'two', 'papers'], k.read.w, x, V(510, 690), FD(V(120, 116)), C.ink, { cols: [g.fg, g.fg, g.fg] });
  withA(ez(t, k.thu.t, 0.4), () => txt('for Thursday’s class', x, V(600, 780), FD(V(60, 56), 400), g.mid));
  dial({ cx: V(1400, 540), cy: V(560, 1240), r: V(300, 300), th: 64, hand: 19 + 1.5 * ez(t, k.read.t, 3), arcs: [
    { a: 9, b: 17, kind: 'work', label: 'work' }, { a: 10, b: 11, kind: 'class', p: 0 },
    { a: 19, b: 21, kind: 'study', p: io(t, k.tue.w[1] + 0.3, 0.7), label: 'study', lr: V(300, 300) + 32 + 92, align: 'right' }] });
}
function sMerge(t) { // 5:35 "two different places ... two different 24 hours, but you have the same one 24 hours. So bring them together."
  ground('n'); const k = { mt: P('any meetings you have at work', 335), live: P('let them all live in the same calendar', 336.5), two: P('two different places', 339), hrs: P('two different 24 hours', 341), one: P('the same one 24 hours', 342.4), bring: P('bring them together', 343.8) };
  const merge = io(t, k.one.w[0] - 0.05, 0.7);
  const r = V(235, 200), th = 50; const cy = V(560, 1120);
  const xa = V(1040, 300), xb = V(1600, 780), xm = V(1320, 540);
  const ax = lerp(xa, xm, merge), bx = lerp(xb, xm, merge);
  const pA = ez(t, 334.9, 1.0, 'outExpo'), pB = ez(t, k.two.t - 0.1, 1.0, 'outExpo');
  const work = [{ a: 9, b: 17, kind: 'work', p: io(t, 335.0, 0.7) }, { a: 18, b: 19.25, kind: 'work', p: io(t, k.mt.w[1], 0.5) }];
  const school = [{ a: 17.75, b: 20.25, kind: 'class', p: io(t, k.two.w[1] + 0.1, 0.6) }];
  // labels over each dial (they fade as the two become one)
  withA((1 - merge) * pA, () => txt('WORK CALENDAR', ax, cy - r - 110, FM(34, 600), g.mid, 'center', 'alphabetic', 3));
  withA((1 - merge) * pB, () => txt('SCHOOL CALENDAR', bx, cy - r - 110, FM(34, 600), g.mid, 'center', 'alphabetic', 3));
  const both = merge >= 0.999;
  if (!both) {
    if (pB > 0) dial({ cx: bx, cy, r, th, p: pB, hours: false, arcs: school, center: '24 h', cs: 76, centerA: ez(t, k.hrs.w[2], 0.3) * (1 - merge) });
    withA(1, () => dial({ cx: ax, cy, r, th, p: pA, hours: false, arcs: work, center: '24 h', cs: 76, centerA: ez(t, k.hrs.w[2], 0.3) * (1 - merge) }));
  } else {
    const gr = lerp(1, 1.35, io(t, k.one.w[2], 0.6)); dial({ cx: xm, cy, r: r * gr, th: th * gr, hs: 32, arcs: work.concat(school), clash: [18, 19.25, ez(t, k.one.w[3], 0.45)], center: '24 h', cs: 92, centerA: ez(t, k.one.w[2], 0.3) });
  }
  // the headline: "two different 24 hours" -> "the same one 24 hours"
  const hy = V(520, 470), x = V(110, 80);
  const hf = FD(V(96, 72)), lh = V(104, 80);
  withA(1 - ez(t, k.live.w[3] - 0.1, 0.2), () => { wordsOn(t, ['school,'], [334.95], x, hy - lh, hf, g.fg); wordsOn(t, ['work,'], [335.3], x, hy, hf, g.fg); wordsOn(t, ['meetings'], [k.mt.w[1]], x, hy + lh, hf, g.fg); });
  withA(ez(t, k.live.w[3], 0.35) * (1 - ez(t, k.two.t - 0.1, 0.25)), () => { wordsOn(t, ['one', 'calendar'], [k.live.w[3], k.live.w[6]], x, hy, hf, g.fg); wordsOn(t, ['for', 'all', 'of', 'it'], [k.live.w[7] - 0.2, k.live.w[7] - 0.1, k.live.w[7], k.live.w[7] + 0.1], x, hy + lh, hf, g.fg); });
  withA(1 - ez(t, k.one.t - 0.1, 0.25), () => { wordsOn(t, ['two', 'different'], k.hrs.w.slice(0, 2), x, hy, hf, g.fg); wordsOn(t, ['24', 'hours?'], k.hrs.w.slice(2), x, hy + lh, hf, g.fg); });
  if (t >= k.one.t - 0.1) { wordsOn(t, ['the', 'same', 'one'], k.one.w.slice(0, 3), x, hy, hf, g.fg, { cols: [g.fg, g.fg, C.cyan] }); wordsOn(t, ['24', 'hours.'], k.one.w.slice(3), x, hy + lh, hf, g.fg); }
  withA(ez(t, k.bring.w[0], 0.4), () => txt('bring them together', V(110, 1000), V(700, 1560), FM(32, 600), g.mid, V('left', 'right'), 'alphabetic', 2));
}
const DIR = {
  fonts: ['700 40px "Familjen Grotesk"', '500 40px "JetBrains Mono"', '600 40px "JetBrains Mono"', 'italic 500 40px "Source Serif 4"'],
  draw(t) { if (t < 30) sOpen(t); else if (t < 120) sRules(t); else if (t < 300) sTuesday(t); else sMerge(t); },
  stills: { a1: { t: 11.6 }, a2: { t: 62.4 }, a3: { t: 278.4 }, a4: { t: 344.6 }, a5: { t: 341.9 }, p1: { t: 344.6 }, p2: { t: 278.4 } },
};
DIR.cues = [[335.0, 'tick'], [335.74, 'pop'], [337.68, 'tick2'], [339.6, 'place'], [341.9, 'tick'], [342.4, 'swipe'], [343.14, 'hit'], [344.16, 'pop2']];
boot(DIR);
</script></body></html>
