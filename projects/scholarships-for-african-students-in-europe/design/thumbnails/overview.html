<!doctype html><html><head><meta charset="utf-8"><style>@font-face{font-family:"Bricolage";src:url("fonts/BarlowCondensed-ExtraBold.ttf")}@font-face{font-family:"DM Mono";src:url("fonts/DMMono-Medium.ttf");font-weight:300 700}@font-face{font-family:"Archivo";src:url("fonts/Barlow-Medium.ttf");font-weight:200 800}:root{--ink:#111114;--white:#fff;--orange:#2FD27A}*{margin:0;padding:0;box-sizing:border-box}</style>
<style>
html,body{width:2000px;height:auto;overflow:visible;background:var(--ink)}
.wrap{padding:56px 56px 40px}
.top{display:flex;justify-content:space-between;align-items:baseline;color:var(--white);margin-bottom:40px}
.top h1{font-family:'Bricolage';font-weight:800;font-size:64px;letter-spacing:-.03em;text-transform:uppercase}
.top .mono{color:rgba(255,255,255,.55)}
.g{display:grid;grid-template-columns:repeat(3,1fr);gap:44px 36px}
.c img{width:100%;display:block;border-radius:10px}
.c .n{font-family:'DM Mono';font-weight:500;font-size:15px;letter-spacing:.12em;text-transform:uppercase;color:var(--orange);margin:14px 0 6px}
.c .ti{font-family:'Archivo';font-weight:700;font-size:21px;line-height:1.25;color:var(--white);margin-top:6px;display:flex;gap:10px}
.c .ti .k{font-family:'DM Mono';font-weight:500;font-size:15px;color:var(--orange);padding-top:3px}
.c .sc{font-family:'DM Mono';font-weight:500;font-size:15px;color:#FFD23F;margin-top:8px}
.c .d{font-family:'Archivo';font-weight:400;font-size:16px;color:rgba(255,255,255,.55);margin-top:4px}
.sec{font-family:'Bricolage';font-weight:800;font-size:40px;letter-spacing:-.02em;text-transform:uppercase;color:var(--white);margin:10px 0 26px}
.g2{display:grid;grid-template-columns:1fr 1fr;gap:48px 40px;margin-bottom:70px}
.pair{display:grid;grid-template-columns:1fr 1fr;gap:10px}
.pair .lb{font-family:'DM Mono';font-weight:500;font-size:13px;letter-spacing:.12em;text-transform:uppercase;color:rgba(255,255,255,.5);margin-top:6px}
</style></head><body><div class="wrap">
<div class="top"><h1>Scholarships in Europe 2027 / thumbnails</h1><span class="mono">set 2026-11-10 · her shoot photos (black top, pink headband) · a mix: photo, collage, flat, other · words on it, then titles (1 = main)</span></div>
<div class="sec">Recommended first, then every option</div><div class="g2" id="g2" style="display:none"></div><div class="g" id="g"></div></div>
<script>
(async () => {
  const dirs = await (await fetch('directions/index.json')).json();
  const g = document.getElementById('g');
  const meta = {}; for (const d of dirs) meta[d] = await (await fetch('directions/' + d + '/content.json')).json();
  const order = [...dirs.filter(d => meta[d].recommended), ...dirs.filter(d => !meta[d].recommended)];
  for (const d of order) {
    const c = await (await fetch('directions/' + d + '/content.json')).json();
    const el = document.createElement('div'); el.className = 'c';
    if (c.sample) {
      const ts2 = (c.titles || [c.title]).map((t, i) => '<div class="ti"><span class="k">' + (i + 1) + '</span>' + t + '</div>').join('');
      el.innerHTML = '<div class="pair"><div><img src="assets/samples/s' + c.sample + '.jpg"><div class="lb">your sample ' + c.sample + '</div></div><div><img src="../../outputs/thumbnails/' + d + '.png"><div class="lb">remake</div></div></div><div class="n">' + d + ' · words: ' + c.thumbnail_text + '</div>' + ts2 + (c.scores ? '<div class="sc">' + c.scores + '</div>' : '') + '<div class="d">' + c.direction + '</div>';
      document.getElementById('g2').appendChild(el); continue;
    }
    const ts = (c.titles && c.titles.length ? c.titles : [c.title]).map((t, i) => '<div class="ti"><span class="k">' + (i + 1) + '</span>' + t + '</div>').join('');
    el.innerHTML = '<img src="../../outputs/thumbnails/' + d + '.png"><div class="n">' + d + (c.kind ? ' · ' + c.kind : '') + (c.recommended ? ' · recommended' : '') + '</div><div class="ti" style="color:#FFD23F"><span class="k">ON IT</span>' + (c.thumbnail_text || '') + '</div>' + ts + (c.scores ? '<div class="sc">' + c.scores + '</div>' : '') + '<div class="d">' + c.direction + '</div>';
    g.appendChild(el);
  }
  await document.fonts.ready;
  await Promise.all([...document.images].map(i => i.complete ? 0 : new Promise(r => { i.onload = i.onerror = r; })));
  window.__ready = true;
})();
</script></body></html>
