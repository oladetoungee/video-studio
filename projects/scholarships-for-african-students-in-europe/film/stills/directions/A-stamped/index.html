<!doctype html>
<html><head><meta charset="utf-8"><title>A Stamped</title>
<link rel="stylesheet" href="../_shared/fonts.css">
<style>
:root{--cover:#5A1424;--page:#F2E8D5;--line:#E4D6BC;--ink:#1A1416;--ink2:#6E5B55;--gold:#C9A043;--stampink:#8E1B2E}
#stage{background:var(--cover);font-family:"Hanken Grotesk";color:var(--ink)}
.page{position:absolute;background:var(--page);overflow:hidden}
.guil{position:absolute;inset:0;opacity:1}
.serif{font-family:"DM Serif Display"}
.mono{font-family:"Azeret Mono";font-weight:500;letter-spacing:.06em;text-transform:uppercase}
.lab{font-family:"Azeret Mono";font-weight:600;font-size:30px;letter-spacing:.08em;color:var(--ink2)}
.val{font-size:44px;font-weight:600;line-height:1.15;letter-spacing:-.01em}
.stamp{position:absolute;border:6px solid var(--stampink);color:var(--stampink);padding:14px 26px 12px;font-family:"Azeret Mono";font-weight:800;letter-spacing:.06em;text-transform:uppercase;border-radius:6px;transform-origin:50% 50%;mix-blend-mode:multiply}
.stamp:after{content:"";position:absolute;inset:6px;border:2px solid currentColor;border-radius:3px}
.stamp.gold{color:#9C7420;border-color:#9C7420}
.round{border-radius:50%!important;display:flex;flex-direction:column;align-items:center;justify-content:center;text-align:center}
.round:after{border-radius:50%!important}
.mrz{position:absolute;font-family:"Azeret Mono";font-weight:500;color:#7C6A60;letter-spacing:.12em;white-space:pre;line-height:1.35}
.clip{position:absolute;background:#fff;box-shadow:0 18px 40px rgba(0,0,0,.28);overflow:hidden}
.clip img{position:absolute;left:0;top:0}
.hl{position:absolute;background:#F5D47A;mix-blend-mode:multiply;transform-origin:0 50%}
.src{position:absolute;font-family:"Azeret Mono";font-weight:500;font-size:26px;letter-spacing:.04em;color:#F2E8D5}
.cap{position:absolute;left:0;right:0;text-align:center}
.cap span{display:inline-block;background:var(--cover);color:#F7EFE0;font-family:"DM Serif Display";padding:6px 22px 10px;line-height:1.15}
</style></head>
<body><div id="stage"></div>
<script src="../_shared/lib.js"></script>
<script>
const W = +Q.get('w') || 1920, H = +Q.get('h') || 1080, PORT = H > W;
const S = $('#stage'); st(S, { width: W + 'px', height: H + 'px' });
// passport security pattern: flat thin wave lines (no gradient)
function guil(w, h) {
  let p = ''; for (let y = -40; y < h + 40; y += 26) { let d = `M0 ${y}`; for (let x = 0; x <= w; x += 40) d += ` Q${x + 20} ${y + (Math.floor(x / 40) % 2 ? 9 : -9)} ${x + 40} ${y}`; p += `<path d="${d}"/>`; }
  return `<svg class="guil" width="${w}" height="${h}" viewBox="0 0 ${w} ${h}"><g fill="none" stroke="#E6D9BF" stroke-width="1.6">${p}</g></svg>`;
}
function page(x, y, w, h, inner) { return `<div class="page" style="left:${x}px;top:${y}px;width:${w}px;height:${h}px">${guil(w, h)}${inner}</div>`; }
const CLIP = {
  em: { src: '../_src/cap/em-guide__1-400-euros-month.png', sx: 664, sy: 744, sw: 700, sh: 146, hl: [[1079 - 664, 780 - 744, 238, 36]], cred: 'Erasmus+ Programme Guide, European Commission' },
  hu: { src: '../_src/cap/hu__no-open-application.png', sx: 40, sy: 715, sw: 1840, sh: 110, hl: [[1479 - 40, 776 - 715, 306, 37]], cred: 'Embassy of Hungary in Abuja' },
  si: { src: '../_src/cap/si__15-january.png', sx: 300, sy: 760, sw: 1020, sh: 330, hl: [], cred: 'Swedish Institute, si.se' },
};
// a real page crop, scaled to width w (crop only, never altered)
function clip(id, x, y, w, extra = '') {
  const c = CLIP[id]; const k = w / c.sw; const h = Math.round(c.sh * k);
  const hls = c.hl.map((r, i) => `<div class="hl" data-hl="${id}${i}" style="left:${r[0] * k - 4}px;top:${r[1] * k - 2}px;width:${r[2] * k + 8}px;height:${r[3] * k + 4}px"></div>`).join('');
  return `<div class="clip" id="clip-${id}" style="left:${x}px;top:${y}px;width:${w}px;height:${h}px${extra}"><img src="${c.src}" style="width:${1920 * k}px;left:${-c.sx * k}px;top:${-c.sy * k}px">${hls}</div>`;
}
const SHOTS = {};
// a1: the order you apply in (three stamps)
SHOTS.a1 = () => {
  if (PORT) return SHOTS.p0();
  S.innerHTML = `<div class="abs serif" style="left:100px;top:150px;width:760px;font-size:90px;line-height:1.02;color:#F7EFE0">The biggest difference is the <i style="color:var(--gold)">order</i> you&nbsp;apply&nbsp;in.</div>
  <div class="abs mono" style="left:114px;top:900px;font-size:30px;color:#E7C9C0">How scholarships work</div>
  ${page(900, 90, 900, 900, `
   <div class="stamp" id="s1" style="left:70px;top:70px;width:560px"><div style="font-size:52px">Together</div><div style="font-size:26px;font-weight:600;margin-top:6px">scholarship + master's, one application</div></div>
   <div class="abs val" style="left:660px;top:118px;width:220px;font-size:34px">Erasmus Mundus</div>
   <div class="stamp" id="s2" style="left:110px;top:345px;width:560px"><div style="font-size:52px">University first</div><div style="font-size:26px;font-weight:600;margin-top:6px">get admitted, then apply for the money</div></div>
   <div class="abs val" style="left:700px;top:375px;width:190px;font-size:34px">NL Scholarship<br>Sweden</div>
   <div class="stamp" id="s3" style="left:60px;top:620px;width:560px"><div style="font-size:52px">Separately</div><div style="font-size:26px;font-weight:600;margin-top:6px">scholarship and university apart</div></div>
   <div class="abs val" style="left:650px;top:650px;width:230px;font-size:34px">Chevening (UK)</div>
   <div class="mrz" style="left:40px;top:830px;font-size:30px">P&lt;EUR&lt;&lt;SCHOLARSHIPS&lt;&lt;2027&lt;&lt;</div>`)}`;
  return t => { stamp('#s1', t, 0, -4); stamp('#s2', t, .3, 3); stamp('#s3', t, .6, -2); };
};
// a2: Erasmus Mundus page + the receipt
function emPage(x, y, w, h, big) {
  return page(x, y, w, h, `
   <div class="abs lab" style="left:64px;top:56px">EUROPEAN UNION · MASTER'S</div>
   <div class="abs serif" style="left:60px;top:96px;font-size:${big}px;line-height:1">Erasmus Mundus</div>
   <div class="abs lab" style="left:64px;top:${110 + big * 1.25}px">WHO</div><div class="abs val" id="f1" style="left:64px;top:${150 + big * 1.25}px;width:${w - 120}px">Anyone in the world. Nigeria included.</div>
   <div class="abs lab" style="left:64px;top:${290 + big * 1.25}px">COVERS</div>
   <div class="abs" style="left:64px;top:${335 + big * 1.25}px;width:${w - 120}px;height:120px" id="covers">
     <div class="stamp" id="c1" style="left:0;top:0;font-size:30px">Tuition</div>
     <div class="stamp" id="c2" style="left:215px;top:8px;font-size:30px">Travel</div>
     <div class="stamp" id="c3" style="left:415px;top:-2px;font-size:30px">Visa</div>
     <div class="stamp" id="c4" style="left:585px;top:6px;font-size:30px">Living allowance</div></div>
   <div class="abs lab" style="left:64px;top:${480 + big * 1.25}px">WHEN</div><div class="abs val" style="left:64px;top:${520 + big * 1.25}px">Most programmes:<br>October to January</div>
   <div class="stamp gold round" id="g1" style="right:60px;top:${470 + big * 1.25}px;width:250px;height:250px;font-size:30px;line-height:1.1"><div style="font-size:24px">Fully funded</div><div style="font-size:54px;font-family:'DM Serif Display';font-weight:400;letter-spacing:0;text-transform:none">€1,400</div><div style="font-size:24px">a month</div></div>
   <div class="mrz" style="left:40px;bottom:30px;font-size:30px">S&lt;EUR&lt;ERASMUS&lt;MUNDUS&lt;&lt;1400EUR&lt;&lt;</div>`);
}
SHOTS.a2 = () => {
  if (PORT) return SHOTS.p1();
  S.innerHTML = emPage(70, 80, 1080, 920, 116) + clip('em', 1190, 250, 690) + `<div class="src" id="cred" style="left:1190px;top:440px;width:690px">Erasmus+ Programme Guide, EU<br>checked 2 Nov 2026</div>
   <div class="cap" id="cap" style="top:640px;left:1190px;right:40px;text-align:left"><span style="font-size:44px">"1,400 euros a month for up to 24&nbsp;months"</span></div>`;
  return t => { ['#c1', '#c2', '#c3', '#c4'].forEach((s, i) => stamp(s, t, 0, [-4, 3, -2, 2][i])); stamp('#g1', t, 0, -8); sweep('[data-hl="em0"]', t, 0); };
};
// a3: black phrase card
SHOTS.a3 = () => {
  S.innerHTML = `<div class="abs" style="inset:0;background:#0A0A0A"></div><div class="abs serif" style="left:${PORT ? 40 : 260}px;top:${PORT ? 700 : 300}px;width:${PORT ? 1000 : 1400}px;font-size:${PORT ? 84 : 100}px;line-height:1.08;color:var(--gold);text-align:center">Not every programme<br>in the catalogue has<br>scholarships every year.</div>`;
  return t => { };
};
// a4: Hungary, not open yet + the embassy page
SHOTS.a4 = () => {
  S.innerHTML = page(80, 80, 1760, 920, `
   <div class="abs lab" style="left:64px;top:56px">HUNGARY · GOVERNMENT SCHOLARSHIP</div>
   <div class="abs serif" style="left:60px;top:96px;font-size:120px;line-height:1">Stipendium Hungaricum</div>
   <div class="abs lab" style="left:64px;top:290px">COVERS</div><div class="abs val" style="left:64px;top:330px;width:900px">Tuition, a monthly stipend, a dorm place or rent money, medical insurance</div>
   <div class="abs lab" style="left:64px;top:480px">NOT COVERED</div><div class="abs val" style="left:64px;top:520px;width:900px">Your full living cost</div>
   <div class="stamp" id="h1" style="left:1040px;top:300px;font-size:38px;white-space:nowrap">Nigeria ✓ on the list</div>
   <div class="stamp" id="h2" style="left:1120px;top:450px;font-size:38px;white-space:nowrap;color:#5B514C;border-color:#5B514C">Not open yet</div>`) +
   clip('hu', 144, 760, 1630) + `<div class="src" style="left:144px;top:890px;color:#6E5B55">Embassy of Hungary in Abuja · checked 2 Nov 2026</div>`;
  return t => { stamp('#h1', t, 0, -3); stamp('#h2', t, .2, 4); sweep('[data-hl="hu0"]', t, 0); };
};
// portrait versions
SHOTS.p1 = () => {
  S.innerHTML = emPagePort() + clip('em', 70, 1290, 940) + `<div class="src" style="left:70px;top:1560px">Erasmus+ Programme Guide · European Commission</div>`;
  return t => { ['#c1', '#c2', '#c3', '#c4'].forEach((s, i) => stamp(s, t, 0, [-4, 3, -2, 2][i])); stamp('#g1', t, 0, -8); sweep('[data-hl="em0"]', t, 0); };
};
function emPagePort() {
  return page(60, 160, 960, 1080, `
   <div class="abs lab" style="left:56px;top:50px">EUROPEAN UNION · MASTER'S</div>
   <div class="abs serif" style="left:52px;top:96px;font-size:118px;line-height:.98;width:560px">Erasmus Mundus</div>
   <div class="stamp gold round" id="g1" style="right:44px;top:70px;width:270px;height:270px"><div style="font-size:24px">Fully funded</div><div style="font-size:60px;font-family:'DM Serif Display';text-transform:none;letter-spacing:0">€1,400</div><div style="font-size:24px">a month</div></div>
   <div class="abs lab" style="left:56px;top:400px">WHO</div><div class="abs val" style="left:56px;top:440px;width:840px">Anyone in the world. Nigeria included.</div>
   <div class="abs lab" style="left:56px;top:590px">COVERS</div>
   <div class="abs" style="left:56px;top:640px;width:860px;height:240px">
     <div class="stamp" id="c1" style="left:0;top:0;font-size:34px">Tuition</div><div class="stamp" id="c2" style="left:260px;top:10px;font-size:34px">Travel</div>
     <div class="stamp" id="c3" style="left:500px;top:0;font-size:34px">Visa</div><div class="stamp" id="c4" style="left:20px;top:120px;font-size:34px">Living allowance</div></div>
   <div class="mrz" style="left:40px;bottom:30px;font-size:30px">S&lt;EUR&lt;ERASMUS&lt;MUNDUS&lt;&lt;1400EUR&lt;&lt;24&lt;&lt;</div>`);
}
SHOTS.p2 = () => {
  S.innerHTML = page(60, 160, 960, 1400, `
   <div class="abs lab" style="left:56px;top:50px">SWEDEN · GLOBAL PROFESSIONALS</div>
   <div class="abs serif" style="left:52px;top:96px;font-size:112px;line-height:.98;width:860px">Swedish Institute</div>
   <div class="abs lab" style="left:56px;top:360px">STEP 1 · UNIVERSITY ADMISSIONS</div>
   <div class="stamp" id="w1" style="left:56px;top:410px;font-size:64px">by 15 Jan 2027</div>
   <div class="abs lab" style="left:56px;top:640px">STEP 2 · THE SCHOLARSHIP</div>
   <div class="stamp" id="w2" style="left:80px;top:690px;font-size:64px">8 – 24 Feb 2027</div>
   <div class="abs val" style="left:56px;top:880px;width:840px">Full scholarship: tuition and a monthly living allowance.</div>
   <div class="stamp gold" id="w3" style="left:56px;top:1080px;font-size:44px">Nigeria ✓ eligible</div>
   <div class="mrz" style="left:40px;bottom:30px;font-size:30px">S&lt;SWE&lt;SI&lt;&lt;15JAN2027&lt;&lt;</div>`) + `<div class="src" style="left:60px;top:1600px;font-size:28px">si.se · checked 2 Nov 2026</div>`;
  return t => { stamp('#w1', t, 0, -3); stamp('#w2', t, .2, 2); stamp('#w3', t, .4, -4); };
};
SHOTS.p0 = SHOTS.p1;
// motion test: 109.05 -> 119.05 s of her recording (Erasmus Mundus: what it covers, the receipt, 1,400 a month)
let TEST = null;
function buildTest() {
  S.innerHTML = `<div id="cam" class="abs" style="inset:0;transform-origin:0% 50%">${emPage(70, 80, 1080, 920, 116)}${clip('em', 1190, 250, 690)}<div class="src" id="cred" style="left:1190px;top:440px;width:690px">Erasmus+ Programme Guide, EU<br>checked 2 Nov 2026</div></div>
   <div class="cap" id="cap" style="top:640px;left:1190px;right:40px;text-align:left"></div>`;
  const W0 = 108.6;
  return t => {
    st('#cam', { transform: `scale(${1 + 0.02 * clamp((t - W0) / 10)})` });
    stamp('#c1', t, 109.56, -4); stamp('#c2', t, 110.44, 3); stamp('#c3', t, 111.76, -2); stamp('#c4', t, 112.6, 2);
    const k = P(t, 114.25, .55, E.outQuint); const cl = $('#clip-em'); cl.style.transform = `translateX(${(1 - k) * 820}px) rotate(${(1 - k) * 4 + 1.5}deg)`; cl.style.filter = k < .95 ? `blur(${(1 - k) * 10}px)` : 'none';
    enter('#cred', P(t, 114.6, .4), 0, 20, 4);
    sweep('[data-hl="em0"]', t, 116.36, .5);
    stamp('#g1', t, 117.12, -8, .26);
    const cap = $('#cap'); cap.innerHTML = t > 116.2 ? `<span style="font-size:44px">"1,400 euros a month for up to 24&nbsp;months"</span>` : (t > 113.7 ? `<span style="font-size:44px">"According to the EU's Erasmus page"</span>` : (t > 108.6 ? `<span style="font-size:44px">"which includes your tuition, your travel, your visa, and a living allowance"</span>` : ''));
  };
}
let SEEK = null;
window.show = async (n) => { SEEK = SHOTS[n](); await imagesReady(); SEEK(99); };
window.seek = async (t) => { if (!TEST) { TEST = buildTest(); await imagesReady(); } TEST(t); };
window.READY = true;
</script></body></html>
