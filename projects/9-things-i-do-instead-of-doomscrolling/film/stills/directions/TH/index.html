<!doctype html>
<html><head><meta charset="utf-8"><title>Talking-head frames</title>
<link rel="stylesheet" href="../_shared/fonts.css">
<style>
#stage{background:#111}
.capC1{position:absolute;text-align:center;font-family:"Dela Gothic One";text-transform:uppercase;color:#fff;line-height:1.05;text-shadow:0 0 1px #000,0 4px 0 #000,0 -4px 0 #000,4px 0 0 #000,-4px 0 0 #000,3px 3px 0 #000,-3px -3px 0 #000,3px -3px 0 #000,-3px 3px 0 #000}
.capC1 b{color:#F7D44C;font-weight:400}
.capC4{position:absolute;text-align:center}
.capC4 span{display:inline-block;background:#0D0C0B;color:#EDE6D6;font-family:"Lora";padding:6px 22px 12px;line-height:1.2}
.capC4 i{font-family:"Bodoni Moda";color:#F2E2A0}
.mono{position:absolute;font-family:"Red Hat Mono";font-weight:600;letter-spacing:.06em;text-transform:uppercase}
.card{position:absolute;background:#FFFDF5;border:6px solid #161616;border-radius:20px;overflow:hidden}
.head{position:absolute;left:0;right:0;top:0;background:#161616;color:#FFFDF5;font-family:"Dela Gothic One";display:flex;align-items:center;justify-content:center}
.sq{position:absolute;border-right:4px solid #161616;border-bottom:4px solid #161616;overflow:hidden}
.sq .n{position:absolute;font-family:"Dela Gothic One";line-height:1;color:#161616}
.sq .l{position:absolute;font-family:"Figtree";font-weight:800;line-height:1.02;color:#161616}
.dab{position:absolute;mix-blend-mode:multiply;opacity:.92}
.bod{position:absolute;font-family:"Bodoni Moda";font-style:italic;font-weight:600;line-height:.95}
.lab{position:absolute;font-family:"Sofia XC";font-weight:700;text-transform:uppercase;letter-spacing:.06em}
.hand{position:absolute;font-family:"Reenie Beanie";line-height:.95;color:#2A2522;white-space:nowrap}
.print{position:absolute;background:#fff;padding:16px;box-shadow:0 8px 18px rgba(50,35,20,.28)}
.print img{display:block;width:100%;height:100%;object-fit:cover}
.tape{position:absolute;background:#8FD3BE;opacity:.88;height:46px}
.clip{position:absolute;background:#fff;overflow:hidden;border-radius:14px;box-shadow:0 18px 40px rgba(0,0,0,.4)}
.hl{position:absolute;background:#F2E2A0;mix-blend-mode:multiply}
.cr{position:absolute;font-family:"Sofia XC";font-weight:500;font-size:30px;letter-spacing:.06em;text-transform:uppercase}
</style></head>
<body><div id="stage"></div>
<script src="../_shared/lib.js"></script>
<script>
const W = +Q.get('w') || 1920, H = +Q.get('h') || 1080;
const S = $('#stage'); st(S, { width: W + 'px', height: H + 'px' });
function card(x, y, size, done, head = 'MY OFFLINE CARD', labels = true, now = -1) {
  const hh = Math.round(size * 0.15), cell = (size - 12) / 3; let h = `<div class="card" style="left:${x}px;top:${y}px;width:${size}px;height:${size + hh}px"><div class="head" style="height:${hh}px;font-size:${hh * 0.46}px">${head}</div>`;
  ITEMS.forEach(([n, l], i) => { const r = cell * 0.26; h += `<div class="sq" style="left:${(i % 3) * cell}px;top:${hh + Math.floor(i / 3) * cell}px;width:${cell + (i % 3 === 2 ? 4 : 0)}px;height:${cell + (i > 5 ? 4 : 0)}px">
    <div class="dab" style="left:${cell * 0.5 - r}px;top:${cell * 0.33 - r}px;width:${2 * r}px;height:${2 * r}px;opacity:${i < done ? .85 : 0}">${blot(r, i * 1.7 + 2, '#FF6A1A')}</div>${now === i ? `<div style="position:absolute;inset:5px;border:${Math.max(4, cell * 0.03)}px solid #161616;border-radius:5px"></div>` : ''}
    <div class="n" style="left:${cell * 0.1}px;top:${cell * 0.1}px;font-size:${cell * 0.26}px">${n}</div>${labels ? `<div class="l" style="left:${cell * 0.1}px;right:${cell * 0.06}px;bottom:${cell * 0.07}px;font-size:${cell * 0.15}px">${l}</div>` : ''}</div>`; });
  return h + '</div>';
}
const SHOTS = {};
// th1 · A Offline Bingo · half and half: her on the left (crop only), the card on the right. Raw 16:19.6 "something physical".
SHOTS.th1 = () => {
  S.innerHTML = frame('979.6', 0, 0, 960, 1080, 1, 480, 0) + `<div class="abs" style="left:960px;top:0;width:960px;height:1080px;background:#F7D44C"></div>` + card(1040, 90, 800, 7, 'MY OFFLINE CARD', true, 6) +
   `<div class="capC1" style="left:0;width:960px;top:640px;font-size:60px">doing something<br><b>physical</b></div>`;
};
// th2 · C The End · slide behind her: her cut-out in front of a big screen showing the idea. Raw 1:10.6 "The stopping cue".
SHOTS.th2 = () => {
  S.innerHTML = `<div class="abs" style="inset:0;background:#1A1816"></div>
   <div class="abs" style="left:90px;top:70px;width:1740px;height:760px;background:#0D0C0B;border:4px solid #2A2724;border-radius:10px"></div>
   <div class="lab" style="left:170px;top:150px;font-size:44px;color:#8A8170">The</div>
   <div class="bod" style="left:160px;top:200px;font-size:200px;color:#F2E2A0">stopping cue</div>
   <div class="abs" style="left:170px;top:470px;width:560px;height:8px;background:#2A2724"><div class="abs" style="left:0;top:0;bottom:0;width:62%;background:#F2E2A0"></div></div>
   <div class="abs" style="left:520px;top:500px;width:16px;height:60px;background:#F2E2A0"></div><div class="abs" style="left:548px;top:500px;width:16px;height:60px;background:#F2E2A0"></div>` +
   cutout('70.6', 420, 80, 1) +
   `<div class="capC4" style="left:0;right:0;top:930px"><span style="font-size:52px">a small moment that makes you <i>pause</i></span></div>`;
};
// th3 · B Junk Journal · background behind her (green-screen style): her cut-out on the journal page. Raw 18:32.4 "junk journaling".
SHOTS.th3 = () => {
  S.innerHTML = `<div class="abs" style="inset:0;background:#CDB38E"></div><div class="abs" style="left:50px;top:40px;width:1820px;height:1000px;background:#F4EEE1"></div>
   <div class="hand" style="left:100px;top:90px;font-size:190px">junk</div><div class="hand" style="left:100px;top:270px;font-size:190px">journaling</div>
   <div class="print" style="left:1330px;top:120px;width:480px;height:600px;transform:rotate(3deg)"><img src="${PX('journal')}" style="object-position:30% 50%"></div><div class="tape" style="left:1480px;top:96px;width:200px;transform:rotate(-4deg)"></div>` +
   cutout('1112.4', 0, 60, 1) +
   `<div class="abs" style="left:110px;top:840px;width:560px;font-family:'Gloock';font-size:60px;line-height:1.05;color:#2A2522">"a journal out of scraps"</div>
   <div class="abs" style="left:1350px;top:745px;font-family:'Red Hat Mono';font-size:24px;color:#5E5242;transform:rotate(3deg)">Photo: Pexels</div>`;
};
// th4 · C The End · the receipt over her full frame, highlighted on her words. Raw 0:48.6 "the infinite scroll feature".
SHOTS.th4 = () => {
  const k = 0.62, cw = 1780 * k, ch = 212 * k;
  S.innerHTML = frame('48.6', 0, 0, 1920, 1080, 1, 0, 0) + `<div class="clip" style="left:${(1920 - cw) / 2}px;top:50px;width:${cw}px;height:${ch + 34}px"><div class="hl" style="left:${176 * k}px;top:${17 + 18 * k}px;width:${480 * k}px;height:${82 * k}px"></div><img src="../_src/cap/npr-head.png" class="abs" style="left:0;top:17px;width:${cw}px;mix-blend-mode:multiply"></div>
   <div class="cr" style="left:${(1920 - cw) / 2}px;top:${50 + ch + 46}px;color:#fff;text-shadow:0 1px 6px rgba(0,0,0,.7)">NPR · The Indicator, 7 April 2026</div>
   <div class="capC4" style="left:0;right:0;top:930px"><span style="font-size:52px">is the <i>infinite scroll</i> feature</span></div>`;
};
// fix · A Offline Bingo · the in-edit correction: she says "number eight" for item 6. Raw 15:07.6.
SHOTS.fix = () => {
  S.innerHTML = frame('907.6', 0, 0, 1920, 1080, 1, 0, 0) + `<div class="abs" style="right:50px;top:50px;width:330px;height:380px">${card(0, 0, 330, 6, '06 / 09', false, 5)}</div>
   <div class="capC1" style="left:0;right:0;top:770px;font-size:64px"><span style="position:relative;color:#fff">number eight<span style="position:absolute;left:-10px;right:-10px;top:44%;height:7px;background:#FF6A1A;box-shadow:0 0 0 2px #000"></span></span></div>
   <div class="abs" style="left:0;right:0;top:870px;text-align:center"><span style="display:inline-block;background:#161616;color:#F7D44C;font-family:'Red Hat Mono';font-weight:700;font-size:40px;letter-spacing:.04em;padding:10px 24px">CORRECTION: THIS IS NUMBER 6, LONG-FORM</span></div>`;
};
window.show = async (n) => { SHOTS[n](); await imagesReady(); };
window.READY = true;
</script></body></html>
