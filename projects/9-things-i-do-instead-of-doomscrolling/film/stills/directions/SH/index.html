<!doctype html>
<html><head><meta charset="utf-8"><title>Shorts frames</title>
<link rel="stylesheet" href="../_shared/fonts.css">
<style>
#stage{background:#000}
.capC1{position:absolute;left:0;right:0;text-align:center;font-family:"Dela Gothic One";text-transform:uppercase;color:#fff;line-height:1.05;text-shadow:0 0 1px #000,0 4px 0 #000,0 -4px 0 #000,4px 0 0 #000,-4px 0 0 #000,3px 3px 0 #000,-3px -3px 0 #000,3px -3px 0 #000,-3px 3px 0 #000}
.capC1 b{color:#F7D44C;font-weight:400}
.t3{position:absolute;left:50%;transform:translateX(-50%);background:#fff;color:#161616;border-radius:24px;font-family:"Dela Gothic One";text-align:center;line-height:1.05;padding:26px 40px 30px}
.bod{position:absolute;font-family:"Bodoni Moda";font-style:italic;font-weight:600;line-height:1}
.kara{position:absolute;left:70px;right:70px;font-family:"Lora";font-weight:500;color:#A39B8E;line-height:1.3;text-align:center}
.kara b{color:#fff;font-weight:600}
.print{position:absolute;background:#fff;padding:14px;box-shadow:0 10px 22px rgba(0,0,0,.4)}
.print img{display:block;width:100%;height:100%;object-fit:cover}
.tape{position:absolute;background:#8FD3BE;opacity:.9;height:44px}
.cr{position:absolute;font-family:"Red Hat Mono";font-size:24px}
</style></head>
<body><div id="stage"></div>
<script src="../_shared/lib.js"></script>
<script>
const W = 1080, H = 1920; const S = $('#stage'); st(S, { width: W + 'px', height: H + 'px' });
const tall = (n, extra = '') => `<img src="../_src/raw4k_${n}.jpg" class="abs" style="left:0;top:0;width:1080px;height:1920px;object-fit:cover;${extra}">`;
const SHOTS = {};
// s1 · A look · SH1 "Why it's so hard to stop doomscrolling": T3 inverse box title + C1 caption. Raw 0:25.6.
SHOTS.s1 = () => {
  S.innerHTML = tall('25.6') + `<div class="t3" style="top:250px;width:900px;font-size:60px">9 things I do instead of doomscrolling</div>
   <div class="capC1" style="top:1300px;left:64px;right:64px;font-size:72px">why is it so hard<br>to <b>stop</b>?</div>`;
};
// s2 · C look · the same short as a letterbox (T8): her 16:9 frame on black, title above, karaoke captions below (C8). Raw 1:16.4.
SHOTS.s2 = () => {
  S.innerHTML = `<div class="bod" style="left:70px;right:70px;top:250px;font-size:96px;color:#F2E2A0;text-align:center">Why is it so hard to stop doomscrolling?</div>` +
   frame('76.4', 0, 600, 1080, 760, 0.7037, 187, 0) +
   `<div class="kara" style="top:1420px;font-size:60px">It's like the end of a chapter, <b>the end of an episode,</b> but your feed doesn't have that.</div>`;
};
// s3 · B look · SH11 prayer and journaling: T11 chunky serif + handwritten title, a taped journal print, small serif caption. Raw 18:36.5.
SHOTS.s3 = () => {
  S.innerHTML = tall('1116.5') + `<div class="abs" style="left:0;right:0;top:170px;text-align:center;font-family:'Gloock';font-size:118px;color:#fff;text-shadow:0 4px 18px rgba(0,0,0,.35)">PRAY, JOURNAL</div>
   <div class="abs" style="left:0;right:0;top:330px;text-align:center;font-family:'Reenie Beanie';font-size:130px;color:#F7E7A8;text-shadow:0 3px 12px rgba(0,0,0,.45)">instead of scrolling</div>
   <div class="print" style="left:60px;top:1500px;width:470px;height:330px;transform:rotate(-4deg)"><img src="${PX('journal')}"></div><div class="tape" style="left:180px;top:1480px;width:180px;transform:rotate(5deg)"></div>
   <div class="abs" style="left:0;right:0;top:1340px;text-align:center;font-family:'Lora';font-weight:700;font-size:62px;color:#fff;text-shadow:0 2px 10px rgba(0,0,0,.6)">a journal out of scraps</div>
   <div class="cr" style="left:70px;top:1850px;color:#fff">Photo: Pexels</div>`;
};
window.show = async (n) => { SHOTS[n](); await imagesReady(); };
window.READY = true;
</script></body></html>
