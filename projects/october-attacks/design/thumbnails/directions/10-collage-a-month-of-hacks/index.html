<!doctype html><html><head><meta charset="utf-8"><link rel="stylesheet" href="../../lib/oa.css"><style>
.hd{right:40px;top:36px;font-size:150px;text-align:right;color:#fff;line-height:.88}
.hd .serif{font-size:110px;display:block;text-transform:none;line-height:1}

</div><script src="../../lib/bind.js"></script></body></html>
<script>
const g=document.getElementById('g'); 'MTWTFSS'.split('').forEach(d=>{const b=document.createElement('b');b.textContent=d;g.appendChild(b)});
for(let i=0;i<3;i++) g.appendChild(document.createElement('span'));
const mark={14:'key',17:'padlock',19:'robot',21:'elephant'};
for(let d=1; d<=31; d++){const s=document.createElement('span'); s.textContent=d; if(mark[d]) {s.className='x'; const im=document.createElement('img'); im.src='../../assets/draw/'+mark[d]+'.svg'; im.style.cssText= mark[d]==='key'?'width:90px;left:4px;top:14px;rotate:-20deg':mark[d]==='elephant'?'width:86px;left:0px;top:8px':'width:52px;left:22px;top:2px'; s.appendChild(im);} g.appendChild(s);}
</script>
