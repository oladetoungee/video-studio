<!doctype html><html><head><meta charset="utf-8"><title>Talking-head + shorts style frames</title>
<style>
@font-face{font-family:Saira;font-weight:900;src:url(../_fonts/SairaCondensed-Black.ttf)}
@font-face{font-family:Saira;font-weight:600;src:url(../_fonts/SairaCondensed-SemiBold.ttf)}
@font-face{font-family:'Chivo Mono';font-weight:100 900;src:url(../_fonts/ChivoMono.ttf)}
@font-face{font-family:Onest;font-weight:100 900;src:url(../_fonts/Onest.ttf)}
@font-face{font-family:RHM;font-weight:300 700;src:url(../_fonts/RedHatMono-VF.ttf)}
@font-face{font-family:Gloock;src:url(../_fonts/Gloock-Regular.ttf)}
@font-face{font-family:Bowlby;src:url(../_fonts/BowlbyOne-Regular.ttf)}
@font-face{font-family:Work;font-weight:100 900;src:url(../_fonts/WorkSans.ttf)}
html,body{margin:0;background:#000}
#stage{position:relative;overflow:hidden;background:#000}
.saira{font-family:Saira;font-weight:900;text-transform:uppercase;line-height:.88}
.cmono{font-family:'Chivo Mono';font-weight:500;letter-spacing:.05em;text-transform:uppercase}
.onest{font-family:Onest;font-weight:850;letter-spacing:-.03em;line-height:.95}
.rhm{font-family:RHM;font-weight:600}
.gloock{font-family:Gloock;line-height:1.05}
.lab{font-family:Work;font-weight:600;letter-spacing:.14em;text-transform:uppercase}
.c1{font-family:Saira;font-weight:900;text-transform:uppercase;color:#fff;-webkit-text-stroke:7px #0E0E0E;paint-order:stroke fill;line-height:.95;text-align:center;letter-spacing:.02em}
.mark{border-radius:50%;background:conic-gradient(#FFD400 0 25%,#0E0E0E 0 50%,#FFD400 0 75%,#0E0E0E 0);border:5px solid #0E0E0E;box-sizing:border-box}
.field{border:4px solid #0E0E0E;background:#fff;box-sizing:border-box;font-family:'Chivo Mono';font-weight:500;display:flex;align-items:center;padding:0 22px}
</style></head><body><div id="stage"></div>
<script src="../_shared/lib.js"></script>
<script>
const F=(t)=>`../_src/footage/raw_${t}.jpg`, CUT=(t)=>`../_src/footage/cut_${t}.png`;
const img=(src,x,y,w,h,ox=0,oy=0,ow=1920,extra='')=>box({left:x,top:y,width:w,height:h,overflow:'hidden',...(extra||{})},`<img src="${src}" style="position:absolute;left:${-ox}px;top:${-oy}px;width:${ow}px">`);
const Y='#FFD400', INK='#0E0E0E', CON='#D9DCDA', G='#0B9A5B', R='#E5262A';
const CH='#2B1A12', CR='#F6EBD9', M='#7FE0B5';
const OX='#5B1720', CREAM='#F2E8D5', BR='#C99A3B', BRD='#8A6420';
const formA=(x,y,s,vals)=>box({left:x,top:y,width:560,transform:`scale(${s})`,transformOrigin:'0 0'},`<div class="cmono" style="font-size:32px;margin-bottom:14px;color:${INK}">Checkout form</div>`+vals.map((v,i)=>`<div class="field" style="height:74px;margin-top:${i?16:0}px;font-size:34px;color:${INK}">${v}</div>`).join(''));
const stampA=(t,c,x,y,sz,rot=-5)=>box({left:x,top:y,color:c,transform:`rotate(${rot}deg)`},`<div class="saira" style="font-size:${sz}px;border:8px solid currentColor;padding:8px 24px 0;line-height:1">${t}</div>`);
function tagC(x,y,d,num,rot=-6){ return box({left:x,top:y,width:d,height:d*1.18,transform:`rotate(${rot}deg)`},`<div style="position:absolute;left:${d/2-d*.05}px;top:0;width:${d*.1}px;height:${d*.22}px;border:${d*.025}px solid ${BRD};border-bottom:none;border-radius:${d}px ${d}px 0 0;box-sizing:border-box"></div><div style="position:absolute;left:0;top:${d*.18}px;width:${d}px;height:${d}px;border-radius:50%;background:${BR};border:${d*.045}px solid ${BRD};box-sizing:border-box;display:flex;flex-direction:column;align-items:center;justify-content:center;color:${OX}"><div class="lab" style="font-size:${Math.max(26,d*.07)}px;opacity:.75">No.</div><div style="font-family:Bowlby;font-size:${d*.36}px;line-height:1">${num}</div><div style="position:absolute;left:${d/2-d*.05}px;top:${d*.07}px;width:${d*.1}px;height:${d*.1}px;border-radius:50%;background:${CREAM}"></div></div>`); }
const SC = {
 // A · half and half: her left, the crash test right. Caption C1 (heavy caps, one yellow word)
 'th1-A-half': () => img(F('218.9'),0,0,960,1080,480,0) + box({left:960,top:0,width:960,height:1080,background:CON})
   + box({left:1010,top:60,display:'flex',alignItems:'center',gap:18},`<div class="mark" style="width:60px;height:60px"></div><div class="cmono" style="font-size:32px;color:${INK}">Test 01 · Refresh the page</div>`)
   + box({left:1010,top:140},`<div class="saira" style="font-size:200px;color:${INK}">Refresh</div>`)
   + formA(1060,430,1.2,['Ada Okafor','Tartu mnt 12','Tallinn']) + stampA('Still there',G,1080,860,110,-4)
   + box({left:0,top:760,width:960},`<div class="c1" style="font-size:96px">if you <span style="color:#35D07F">refresh</span><br>the page</div>`),
 // A · words behind her: GONE between her room and her
 'th4-A-behind': () => img(F('221.4'),0,0,1920,1080) + box({left:0,top:30,width:1920,textAlign:'center'},`<div class="saira" style="font-size:420px;color:${R};letter-spacing:.01em">Gone</div>`)
   + img(CUT('221.4'),0,0,1920,1080)
   + box({left:0,top:860,width:1920},`<div class="c1" style="font-size:92px">but if you <span style="color:#FF5A4F">close the tab</span></div>`),
 // B · the slide behind her (green-screen style): a giant browser window behind her cut-out; mixed-font caption
 'th2-B-behind': () => box({left:0,top:0,width:1920,height:1080,background:CH})
   + box({left:120,top:70,width:1680,height:96},`<div style="position:absolute;left:0;top:0;width:460px;height:96px;background:${CR};border-radius:26px 26px 0 0;display:flex;align-items:center;gap:18px;padding:0 28px;box-sizing:border-box" class="rhm"><div style="width:26px;height:26px;border-radius:50%;background:${CH}"></div><div style="font-size:34px;flex:1;color:${CH}">shop.example</div><div style="font-size:40px;color:${CH}">×</div></div>`)
   + box({left:120,top:166,width:1680,height:860,background:CR,borderRadius:'0 28px 28px 28px'},`<div style="position:absolute;left:30px;right:30px;top:24px;height:70px;border-radius:35px;background:rgba(43,26,18,.08);display:flex;align-items:center;padding:0 32px" class="rhm"><span style="font-size:32px;color:rgba(43,26,18,.45)">https://</span><span style="font-size:32px;color:${CH}">shop.example/cart</span></div>
      <div style="position:absolute;left:1240px;top:150px"><svg viewBox="0 0 48 48" width="300" height="300"><path d="M4 7h6l5 24h22l5-17H13" fill="none" stroke="${CH}" stroke-width="4" stroke-linejoin="round" stroke-linecap="round"/><circle cx="18" cy="39" r="3.4" fill="${CH}"/><circle cx="34" cy="39" r="3.4" fill="${CH}"/></svg><div style="position:absolute;right:-20px;top:-6px;width:110px;height:110px;border-radius:50%;background:${M};display:flex;align-items:center;justify-content:center;font-family:Onest;font-weight:800;font-size:64px;color:${CH}">2</div></div>`)
   + img(CUT('140.5'),-260,40,1920,1080,0,0,1920)
   + box({left:1140,top:640,width:700},`<div class="rhm" style="font-size:52px;color:${CH};background:${M};display:inline-block;padding:8px 18px;border-radius:10px">localStorage</div><div class="onest" style="font-size:84px;color:${CH};margin-top:14px">is the reason<br>your cart stays</div>`),
 // C · receipt card over her full frame + serif captions on oxblood boxes (C4)
 'th3-C-receipt': () => img(F('101.0'),0,0,1920,1080)
   + box({left:860,top:40,width:1000,padding:18,background:'#fff',borderRadius:18,boxShadow:'0 10px 30px rgba(0,0,0,.25)'},`<div style="position:relative"><img src="../_src/clips/mdn-setcookie-warn.png" style="width:100%;display:block"><div style="position:absolute;left:${1000*675/1060}px;top:${1000*80/1060}px;width:${1000*316/1060}px;height:${1000*30/1060}px;background:${BR};mix-blend-mode:multiply;opacity:.8"></div><div style="position:absolute;left:${1000*91/1060}px;top:${1000*122/1060}px;width:${1000*94/1060}px;height:${1000*30/1060}px;background:${BR};mix-blend-mode:multiply;opacity:.8"></div></div><div class="lab" style="font-size:26px;color:${OX};margin-top:12px">Source: MDN, Set-Cookie</div>`)
   + box({left:0,top:790,width:1920,textAlign:'center'},`<div style="display:inline-block;background:${OX};color:${CREAM};padding:10px 28px 14px;font-family:Gloock;font-size:64px">browsers can restore your tab</div><br><div style="display:inline-block;background:${OX};color:${CREAM};padding:6px 28px 14px;font-family:Gloock;font-size:64px;font-style:italic;margin-top:-2px">when you reopen them</div>`),
 // C · window tile: the real cloakroom photo, her in a rounded window beside it
 'th5-C-tile': () => box({left:0,top:0,width:1920,height:1080,background:'#4A1418'})
   + img('../_src/pexels/px-10880678.jpg',80,80,1000,920,300,40,1600,{borderRadius:'36px'})
   + img(F('47.5'),1120,80,720,720,600,120,1920,{borderRadius:'36px'})
   + tagC(1020,560,220,117,-10)
   + box({left:1120,top:840,width:720},`<div class="gloock" style="font-size:66px;color:${CREAM}">A <i style="color:${BR}">cookie</i> works like that ticket.</div>`),
 // in-edit correction (look A): she says "two exceptions" and names one; the card adds the second, sourced
 'fix-A-correction': () => img(F('188.8'),0,0,960,1080,480,0) + box({left:960,top:0,width:960,height:1080,background:CON})
   + box({left:1010,top:60},`<div class="cmono" style="font-size:32px;color:${INK}">localStorage · the two exceptions</div>`)
   + box({left:1010,top:140,width:880},`<div style="display:flex;gap:26px;align-items:flex-start"><div class="saira" style="font-size:120px;color:${INK};width:84px;text-align:center;flex:none">1</div><div class="saira" style="font-size:72px;color:${INK};padding-top:10px">Private window: gone when you close it</div></div>`)
   + box({left:1010,top:340,width:880},`<div style="display:flex;gap:26px;align-items:flex-start"><div class="saira" style="font-size:120px;color:#fff;background:${INK};width:84px;text-align:center;flex:none">2</div><div class="saira" style="font-size:66px;color:${INK};padding-top:10px">Safari: can delete it after<br>7 days of Safari use<br>without a visit</div></div>`)
   + box({left:1000,top:610,width:900,border:`4px solid ${INK}`,background:'#fff',padding:'18px 0',boxSizing:'border-box'},`<div style="position:relative;margin-left:-6px"><img src="../_src/clips/webkit-ls-l1.png" style="width:900px;display:block"><img src="../_src/clips/webkit-ls-l2.png" style="width:${900*478/948}px;display:block;margin-left:${900*30/948}px"><div style="position:absolute;left:0;top:0;width:900px;height:${900*44/948}px;background:#FFE680;mix-blend-mode:multiply"></div><div style="position:absolute;left:${900*30/948}px;top:${900*44/948}px;width:${900*478/948}px;height:${900*44/948}px;background:#FFE680;mix-blend-mode:multiply"></div></div>`)
   + box({left:1010,top:760},`<div class="cmono" style="font-size:32px;color:${INK};text-transform:none">Source: WebKit blog, March 2020</div>`)
   + box({left:0,top:860,width:960},`<div class="c1" style="font-size:88px">but there are <span style="color:#35D07F">two</span> exceptions</div>`),
 // shorts SH6 (9:16): her in a 3:4 window between flat bands; top title T4 (yellow box, types on); captions C12 pop-up keywords
 'sh6-A-hook': () => box({left:0,top:0,width:1080,height:1920,background:CON})
   + box({left:40,top:110,width:1000,background:Y,padding:'26px 30px 18px',boxSizing:'border-box',textAlign:'center'},`<div class="saira" style="font-size:88px;color:${INK}">Why your form vanished<br>when you closed the tab</div>`)
   + img(F('205.0'),90,420,900,1200,700,140,2592,{borderRadius:'28px'})
   + box({left:40,top:1650,width:1000},`<div class="c1" style="font-size:104px">a half-filled <span style="color:#FF5A4F">form</span></div>`),
 'sh6-A-mid': () => box({left:0,top:0,width:1080,height:1920,background:CON})
   + img(F('221.4'),90,110,900,1200,700,140,2592,{borderRadius:'28px'})
   + box({left:40,top:1360,width:1000},`<div class="c1" style="font-size:104px">but if you<br><span style="color:#FF5A4F">close the tab</span></div>`)
   + stampA('Gone',R,330,1620,170,-5)
,
 'sh6-B-hook': () => box({left:0,top:0,width:1080,height:1920,background:CH})
   + box({left:60,top:150,width:960},`<div class="onest" style="font-size:96px;color:${CR}">Why your form vanished when you <span style="color:${M}">closed the tab</span></div>`)
   + img(F('205.0'),112,500,855,1140,700,140,2592,{borderRadius:'28px'})
   + box({left:60,top:1680,width:960,textAlign:'center'},`<span class="onest" style="font-size:84px;color:${CR}">a half-filled </span><span class="rhm" style="font-size:76px;background:${M};color:${CH};padding:4px 14px;border-radius:6px">form</span>`),
 'sh6-C-hook': () => box({left:0,top:0,width:1080,height:1920,background:'#4A1418'})
   + box({left:60,top:150,width:960},`<div class="gloock" style="font-size:88px;color:${CREAM}">Why your form vanished when you <i style="color:${BR}">closed the tab</i></div>`)
   + img(F('205.0'),112,500,855,1140,700,140,2592,{borderRadius:'28px'})
   + box({left:48,top:1690,width:984,textAlign:'center'},`<div style="display:inline-block;background:${CREAM};color:#4A1418;padding:10px 28px 16px;font-family:Gloock;font-size:70px">a half-filled checkout form</div>`),
};
setup(SC, [[0,0,'th1-A-half']], []);
</script></body></html>
