<!doctype html><html><head><meta charset="utf-8"><title>C cloakroom</title>
<style>
@font-face{font-family:Gloock;src:url(../_fonts/Gloock-Regular.ttf)}
@font-face{font-family:Bowlby;src:url(../_fonts/BowlbyOne-Regular.ttf)}
@font-face{font-family:Work;font-weight:100 900;src:url(../_fonts/WorkSans.ttf)}
@font-face{font-family:RHM;font-weight:300 700;src:url(../_fonts/RedHatMono-VF.ttf)}
html,body{margin:0;background:#4A1418}
#stage{position:relative;overflow:hidden;background:#4A1418;color:#F2E8D5;font-family:Work}
.serif{font-family:Gloock;line-height:1.02;letter-spacing:-.01em}
.lab{font-family:Work;font-weight:600;letter-spacing:.14em;text-transform:uppercase}
.mono{font-family:RHM;font-weight:500}
</style></head><body><div id="stage"></div>
<script src="../_shared/lib.js"></script>
<script>
const OX='#F2E8D5', CREAM='#4A1418', BR='#C99A3B', BRD='#D9B25A';
// the round brass coat tag (= the cookie)
function tag(x,y,d,num,o={}){
  const flip=o.flip||0; const sx=Math.abs(Math.cos(Math.PI*flip)); const back=flip>.5;
  return box({left:x,top:y,width:d,height:d*1.18,transform:`rotate(${o.rot||0}deg) scaleX(${Math.max(.02,sx)})`,transformOrigin:'50% 50%',opacity:o.op??1},
   `<div style="position:absolute;left:${d/2-d*.05}px;top:0;width:${d*.1}px;height:${d*.22}px;border:${d*.025}px solid ${BRD};border-bottom:none;border-radius:${d}px ${d}px 0 0;box-sizing:border-box"></div>
    <div style="position:absolute;left:0;top:${d*.18}px;width:${d}px;height:${d}px;border-radius:50%;background:${back?OX:BR};border:${d*.045}px solid ${back?'#C99A3B':'#8A6420'};box-sizing:border-box;display:flex;flex-direction:column;align-items:center;justify-content:center;color:${back?BR:OX}">
     ${back?`<div class="mono" style="font-size:${d*.085}px;text-align:center;line-height:1.3">Cookie:<br><b style="font-size:${d*.1}px">session_id=${num}</b></div>`:`<div class="lab" style="font-size:${Math.max(32,d*.07)}px;opacity:.75">No.</div><div style="font-family:Bowlby;font-size:${d*.36}px;line-height:1">${num}</div>`}
     <div style="position:absolute;left:${d/2-d*.05}px;top:${d*.07}px;width:${d*.1}px;height:${d*.1}px;border-radius:50%;background:${CREAM}"></div></div>`);
}
const coat=(c=OX,w=220)=>`<svg viewBox="0 0 100 140" width="${w}" height="${w*1.4}"><path d="M50 6a7 7 0 1 1 7 7" fill="none" stroke="${BRD}" stroke-width="3"/><path d="M50 13 12 32h76z" fill="none" stroke="${BRD}" stroke-width="3" stroke-linejoin="round"/><path d="M28 30 50 26 72 30 86 50 80 130H20L14 50z" fill="${c}"/><path d="M50 30v100" stroke="${CREAM}" stroke-width="2" opacity=".5"/></svg>`;
function rack(x,y,w,offset,nums,hl,coats=1){ // hangers on a rail; offset scrolls
  let s=box({left:x,top:y,width:w,height:8,background:OX}); const xmax=x+w-120-200;
  nums.forEach((n,i)=>{ const hx=x+60+i*260-offset; if(hx<x-200||hx>xmax) return; const on=n===hl;
    s+=box({left:hx,top:y-14,width:200,textAlign:'center'},`${coats?coat(on?OX:'rgba(242,232,213,.22)',200):''}<div style="font-family:Bowlby;font-size:44px;margin-top:6px;color:${on?OX:'rgba(242,232,213,.45)'}">${n}</div>`); });
  return s;
}
const NUMS=[109,110,111,112,113,114,115,116,117,118,119,120,121];
const SC = {
 // opener: the real cloakroom, rounded cinematic frame + her line in serif
 photo: (p) => {
  const k=mv(p,0,.8), z=1.08-0.06*EO(clamp(p/5));
  const fw=PORT?960:1500, fh=PORT?1100:740;
  return box({left:(W-fw)/2,top:PORT?260:90,width:fw,height:fh,borderRadius:40,overflow:'hidden',opacity:k},`<img src="../_src/pexels/px-10880678.jpg" style="width:100%;height:100%;object-fit:cover;transform:scale(${z})">`)
   + box({left:PORT?60:210,top:PORT?1420:905,opacity:mv(p,.5,.6)},`<div class="serif" style="font-size:${PORT?110:96}px">Think about a <i style="color:${BRD}">cloakroom.</i></div>`)
   + box({left:PORT?60:(W-fw)/2+fw-900,top:PORT?1700:(90+fh+18),width:900,whiteSpace:'nowrap',textAlign:PORT?'left':'right'},`<div class="lab" style="font-size:32px;opacity:.6">Photo: Alari Tammsalu · Pexels</div>`);
 },
 // motion test 41.0: show the ticket -> they find the coat by its number -> a cookie works like that ticket
 ticket: (p) => {
  const T=(t)=>t-41.0;
  const tagIn=mv(p,T(41.2),.6), bump=Math.sin(Math.PI*clamp((p-T(42.35))/.35)), look=EIO(clamp((p-T(44.0))/1.4)), found=mv(p,T(45.3),.4,EBACK), flip=EIO(clamp((p-T(46.3))/.6)), cookieWord=mv(p,T(46.3),.5);
  const offset=lerp(0,8*260,look) - (PORT?0:0);
  const rackY=PORT?1280:620;
  let s='';
  // the counter line
  s+=box({left:0,top:PORT?1180:540,width:W,height:4,background:'rgba(242,232,213,.25)'});
  s+=box({left:PORT?60:120,top:PORT?140:90,opacity:clamp(p/.3)},`<div class="serif" style="font-size:${PORT?96:100}px">${p<T(42.35)?'When you come back…':p<T(46.3)?'Show the ticket.':`A <span style="color:${BRD}">cookie</span> works<br>like that ticket.`}</div>`);
  if(PORT) s+=rack(-80,rackY,W+160,offset-200,NUMS,p>T(45.3)?117:null,1);
  else s+=rack(600,rackY,1320,offset-140,NUMS,p>T(45.3)?117:null,1);
  const tx=PORT?lerp(-500,330,tagIn):lerp(-500,110,tagIn), ty=PORT?620:330;
  s+=box({left:0,top:0,width:W,height:H,transform:`scale(${1+0.035*EIO(clamp((p-T(46.6))/2.4))})`,transformOrigin:'30% 40%'},tag(tx+bump*30,ty-bump*16,PORT?420:380,117,{rot:lerp(-25,-6,tagIn)+bump*4,flip}));
  if(p>T(45.3)&&!PORT) s+=box({left:600+60+8*260-offset+140-10,top:rackY-40,width:220,height:390,border:`5px solid ${BRD}`,borderRadius:24,transform:`scale(${lerp(1.3,1,found)})`,opacity:found});
  if(p>T(45.3)&&PORT) s+=box({left:-80+60+8*260-(offset-200)-10,top:rackY-40,width:220,height:390,border:`5px solid ${BRD}`,borderRadius:24,transform:`scale(${lerp(1.3,1,found)})`,opacity:found});
  return s;
 },
 // every request carries the tag
 request: (p) => {
  const reqs=['GET /','GET /orders','POST /cart'];
  let s=box({left:PORT?60:120,top:PORT?140:80},`<div class="serif" style="font-size:${PORT?96:96}px">Shown on <i style="color:${BRD};margin-right:.22em">every</i>request.</div>`);
  reqs.forEach((r,i)=>{ const k=mv(p,.3+i*.35,.6); const y=(PORT?520:330)+i*(PORT?330:220);
    const x0=PORT?60:120, x1=PORT?560:1300;
    s+=box({left:x0,top:y,padding:'22px 30px',border:`4px solid ${OX}`,borderRadius:16},`<div class="mono" style="font-size:40px">${r}</div>`);
    s+=box({left:lerp(x0+30,x1-280,k),top:y-6,opacity:k>0?1:0},'') + tag(lerp(x0+380,x1-200,k),y-34,130,117,{rot:-8});
    s+=box({left:x0+(PORT?0:380),top:y+(PORT?120:52),width:((PORT?x1+40:1460)-x0-(PORT?0:380))*k,height:4,background:'rgba(242,232,213,.4)'});
  });
  s+=box({left:PORT?600:1460,top:PORT?1600:330,textAlign:'center'},`<div style="width:${PORT?380:340}px;height:${PORT?240:560}px;border-radius:24px;background:${OX};color:${CREAM};display:flex;align-items:center;justify-content:center"><div class="lab" style="font-size:36px">Server</div></div>`);
  s+=box({left:PORT?60:120,top:PORT?1750:960},`<div class="mono" style="font-size:32px;opacity:.75">Cookie: session_id=117</div>`);
  return s;
 },
 // the server keeps the real details; the tag only has the number
 server: (p) => {
  const k=mv(p,.2,.6), c=mv(p,.8,.6);
  return box({left:PORT?60:120,top:PORT?140:80},`<div class="serif" style="font-size:${PORT?92:96}px">The tag holds a number.<br><i style="color:${BRD}">The server keeps you.</i></div>`)
   + tag(PORT?80:140,PORT?720:420,PORT?380:400,117,{rot:-6,op:k})
   + box({left:PORT?520:640,top:PORT?760:470,width:PORT?0:220,height:5,background:OX,opacity:c})
   + box({left:PORT?60:900,top:PORT?1260:400,width:PORT?960:880,padding:'40px 48px',borderRadius:28,background:OX,color:CREAM,boxSizing:'border-box',opacity:c,transform:`translateY(${(1-c)*30}px)`},
     `<div class="lab" style="font-size:32px;color:${BR}">Session 117</div><div class="mono" style="font-size:40px;line-height:1.75;margin-top:18px">name: Ada Okafor<br>logged in: yes<br>orders: 3</div>`);
 },
 // receipt: the tag is small (RFC 6265)
 small: (p) => {
  const k=mv(p,0,.6), hl=mv(p,.7,.6), cw=PORT?1000:1240, ch=cw*400/1050;
  return box({left:PORT?40:120,top:PORT?140:80},`<div class="serif" style="font-size:${PORT?96:100}px">About <span style="font-family:Bowlby;font-size:.9em">4 KB</span> a tag.</div>`)
   + box({left:PORT?40:120,top:(PORT?560:300)+(1-k)*40,width:cw,height:ch,background:'#fff',borderRadius:20,overflow:'hidden',opacity:k},`<img src="../_src/clips/rfc-4096-crop.png" style="width:100%;display:block"><div style="position:absolute;left:${cw*96/1050}px;top:${cw*156/1050}px;width:${cw*438/1050*hl}px;height:${cw*36/1050}px;background:${BR};mix-blend-mode:multiply;opacity:.75"></div>`)
   + box({left:PORT?40:120,top:(PORT?560:300)+ch+30},`<div class="lab" style="font-size:32px;opacity:.6">Source: RFC 6265, section 6.1</div>`)
   + tag(PORT?640:1450,PORT?1320:420,PORT?340:340,117,{rot:10});
 },
};
setup(SC, [[41.0,0,'ticket']], [{t:41.45,name:'slide'},{t:43.0,name:'tag'},{t:44.2,name:'rack'},{t:45.45,name:'found'},{t:46.4,name:'flip'},{t:48.3,name:'tick'}]);
</script></body></html>
