/* B · YOU ARE THE REVIEWER. AI writes the code; she reads it. The whole video is a stack of review sheets:

 * Grid 16:9: headline row (x 110, baseline 190, Onest 800 96 px), sheet x 110-1260, side column x 1320-1810.
 * 9:16: headline 2 lines, sheet full width (x 70-1010), side items stacked under it.
 * Type: Onest 800/700/600, Martian Mono (code >= 46 px at 1920, >= 40 px at 1080; labels >= 32 px).
 * Motion: lines type on at 40 chars/s; a removed line is struck in 0.3 s outExpo; the note drops 26 px in 0.4 s outQuint;
 * sheets slide up 60 px in 0.45 s between beats; every hold gets a 2 % push. */
const C = { g: '#E9EBEE', ink: '#1B1F24', dim: '#69707A', wh: '#FFFFFF', add: '#DDF6E3', addI: '#1A7F37', del: '#FFE4E1', delI: '#CF222E', amb: '#F2A900' };

const SX = () => V(110, 70), SW = () => V(1150, 940), SIDE = () => V(1320, 70), SIDEW = () => V(490, 940);
/** headline: lines = [[ [word, time, colour?], ... ], ...] */
function head(t, lines, o = {}) { const fs = o.fs || V(96, 100), x = V(110, 70), y0 = o.y || V(190, 210);

/** a review sheet. o: x,y,w, file, tag, fs, lines [{s, k: ' '|'+'|'-', at, strikeAt, mark}], err {s[], at, goneAt} */

  const lh = fs * 1.7, x = o.x, y = o.y, w = o.w; const hd = Math.max(fs * 1.9, 76);

      txt(s, x + 24 + fs * 1.3, ly + lh * 0.68, FMM(fs, l.b ? 700 : 400), l.c || C.ink);

  if (o.err) { const ea = ez(t, o.err.at, 0.3) * (o.err.goneAt == null ? 1 : 1 - ez(t, o.err.goneAt, 0.35)); const ey = y + h + 16, eh = V(40, 36) * (1.35 * o.err.s.length + 0.7);
    withA(ea, () => { rect(x, ey, w, eh, C.delI); o.err.s.forEach((l, i) => txt(l, x + 26, ey + V(40, 36) * (1.35 + i * 1.35), FMM(V(40, 36), 600), C.wh)); }); }

}
/** her review note: amber block, "YOU, REVIEWING", her words */
function note(t, at, x, y, w, lines, fs, by = 'YOU, REVIEWING') {

  return h;
}
function push(t, t0, d = 6) { const s = 1 + 0.02 * io(t, t0, d); ctx.translate(W / 2, H / 2); ctx.scale(s, s); ctx.translate(-W / 2, -H / 2); }

/* 2:52 "one easy fix it might give is to wrap the saving [in a] try-catch. So the error is caught and the crash goes away.

    { s: '  try { await db.insert(user) }', k: '+', at: k.wrap.w[3] }, { s: '  catch (e) { }', k: '+', at: k.wrap.w[4] }, CODE0[2], CODE0[3]];

/* 1:44 the four skills as a diff of the syllabus. Removed lines are her words from 5:35 ("as opposed to ... learning
