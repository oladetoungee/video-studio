<!doctype html>
<html><head><meta charset="utf-8">
<title>C · Paperwork</title>
<style>
@font-face { font-family: 'Arch'; src: url('../_fonts/Archivo.ttf'); font-weight: 100 900; font-stretch: 62% 125%; }
@font-face { font-family: 'JBM'; src: url('../_fonts/JetBrainsMono.ttf'); font-weight: 100 900; }
html, body { margin: 0; background: #D7DADD; }
#stage { position: relative; overflow: hidden; background: #D7DADD; font-family: 'Arch'; color: #15171A; }
.h { font-weight: 800; font-stretch: 62%; text-transform: uppercase; letter-spacing: -0.005em; line-height: 0.9; white-space: nowrap; }
.mono { font-family: 'JBM'; font-weight: 500; letter-spacing: 0.06em; text-transform: uppercase; white-space: nowrap; }
.sheet { position: absolute; background: #FFFFFF; box-shadow: 0 1px 1px rgba(0,0,0,.06), 0 14px 30px rgba(20,24,30,.16); }
.w { display: inline-block; }
</style></head>
<body><div id="stage"></div>
<script src="../_tools/kit.js"></script>
<script>
const C = { ground: '#D7DADD', ink: '#15171A', red: '#E5402A', paper: '#FFFFFF', bar: '#E6E7E9', bar2: '#CDD0D4', grey: '#6E737A', folder: '#E9C98F' };
const SRC = '../../../assets/sources/';
const CUT = '../../../../design/thumbnails/assets/cut/';
function wrapWords(e) {
  for (const n of [...e.childNodes]) {
    if (n.nodeType === 3) { const f = document.createDocumentFragment(); n.textContent.split(/(\s+)/).forEach(tk => { if (!tk) return; if (/^\s+$/.test(tk)) f.appendChild(document.createTextNode(' ')); else { const sp = document.createElement('span'); sp.className = 'w'; sp.textContent = tk; f.appendChild(sp); } }); e.replaceChild(f, n); }
    else if (n.nodeType === 1 && n.tagName !== 'BR') wrapWords(n);
  }
}
function headline(parent, html, { x, y, size, align = 'left' }) {
  const e = el('div', { left: (align === 'center' ? x - 2000 : x) + 'px', top: y + 'px', width: (align === 'center' ? 4000 : 3000) + 'px', textAlign: align, fontSize: size + 'px' }, html, parent);
  e.className = 'h'; wrapWords(e); return { e, words: [...e.querySelectorAll('.w')] };
}
// condensed words drop in hard, one by one (no fade), with a 1-frame overshoot
function slam(words, lt, t0, stag = 0.08) { words.forEach((w, i) => { const a = lt - t0 - i * stag; const p = a < 0 ? 0 : clamp(spring(a, 3.2, 0.55), 0, 1.15); set(w, { opacity: a < 0 ? 0 : 1, transform: `translateY(${(1 - p) * -0.35}em) scale(${1 + (1 - p) * 0.25})` }); }); }
const acc = (s) => `<span style="color:${C.red}">${s}</span>`;
// ---------------------------------------------------------------- documents (generic, labelled as illustration; no real names or numbers)
const DOCS = [
  { label: 'Marriage certificate', seal: true }, { label: 'Court decree', seal: true }, { label: 'Gazette notice', cols: 2 },
  { label: 'Church register', grid: true }, { label: 'NIN slip', small: true }, { label: 'Licence', seal: true }, { label: 'Affidavit' },
];
function sheet(parent, d, w = 420) {
  const h = d.small ? w * 0.62 : w * 1.36;
  const e = el('div', { width: w + 'px', height: h + 'px', left: 0, top: 0, transformOrigin: '50% 50%' }, '', parent); e.className = 'sheet';
  const m = w * 0.09;
  el('div', { left: m + 'px', top: m + 'px', fontSize: (w * 0.038) + 'px', color: C.grey }, d.label, e).className = 'mono';
  el('div', { left: m + 'px', top: (m + w * 0.075) + 'px', width: (w * 0.55) + 'px', height: (w * 0.032) + 'px', background: C.bar2 }, '', e);
  const lines = d.small ? 3 : 11;
  for (let i = 0; i < lines; i++) {
    const y = m + w * 0.19 + i * w * 0.075; if (y > h - m * 1.6) break;
    const ww = (w - 2 * m) * (d.cols ? 0.46 : 1) * (0.55 + hash(i * 3 + w) * 0.45);
    el('div', { left: m + 'px', top: y + 'px', width: ww + 'px', height: (w * 0.018) + 'px', background: C.bar }, '', e);
    if (d.cols) el('div', { left: (m + (w - 2 * m) * 0.54) + 'px', top: y + 'px', width: ww * 0.9 + 'px', height: (w * 0.018) + 'px', background: C.bar }, '', e);
  }
  if (d.seal) el('div', { right: m + 'px', bottom: m + 'px', width: w * 0.2 + 'px', height: w * 0.2 + 'px', borderRadius: '50%', border: `${w * 0.008}px solid ${C.bar2}` }, '', e);
  if (d.grid) for (let i = 0; i < 4; i++) el('div', { left: m + 'px', top: (h * 0.55 + i * w * 0.08) + 'px', width: (w - 2 * m) + 'px', height: '1px', background: C.bar2 }, '', e);
  return { e, w, h };
}
function stamp(parent, text, size) {
  const e = el('div', { fontFamily: 'Arch', fontWeight: 800, fontStretch: '62%', fontSize: size + 'px', color: C.red, border: `${size * 0.09}px solid ${C.red}`, padding: `${size * 0.06}px ${size * 0.22}px ${size * 0.02}px`, letterSpacing: '0.01em', textTransform: 'uppercase', whiteSpace: 'nowrap', lineHeight: 1, transformOrigin: '50% 50%', mixBlendMode: 'multiply', borderRadius: size * 0.08 + 'px' }, text, parent);
  return e;
}
// ================================================================= 1. the desk: papers fly in and scatter, then gather into one record (0 - 5.0 s)
const SCATTER = [ // landscape targets (x, y, rot) in the desk plane; portrait handled below
  [520, 600, -14], [900, 520, 9], [1260, 560, -5], [1620, 500, 12], [700, 900, 7], [1120, 930, -11], [1520, 900, 4],
];
const SCATTERP = [[270, 900, -14], [790, 860, 9], [300, 1270, -5], [810, 1260, 12], [560, 1620, 7], [260, 1700, -11], [850, 1700, 4]];
scene('desk', 0, 5.75, (r, S) => {
  S.page = el('div', { left: 0, top: 0, width: W + 'px', height: H + 'px', background: C.ground, transformOrigin: '0% 50%', overflow: 'hidden' }, '', r);
  S.persp = el('div', { left: 0, top: 0, width: W + 'px', height: H + 'px', perspective: '2200px', perspectiveOrigin: '50% 30%' }, '', S.page);
  S.desk = el('div', { left: 0, top: 0, width: W + 'px', height: H + 'px', transformStyle: 'preserve-3d', transformOrigin: '50% 60%' }, '', S.persp);
  S.docs = DOCS.map((d, i) => sheet(S.desk, d, V(300, 330) * (d.small ? 0.9 : 1)));
  S.h1 = headline(S.page, `Pieces of paper,<br>${acc('everywhere.')}`, { x: V(110, 80), y: V(70, 230), size: V(150, 150) });
  S.h2 = headline(S.page, `One reliable<br>${acc('record.')}`, { x: V(110, 80), y: V(70, 230), size: V(150, 150) });
  S.st = stamp(S.page, 'One record', V(84, 84));
  S.ill = el('div', { left: V(116, 86) + 'px', top: V(350, 520) + 'px', fontSize: '18px', color: C.grey }, 'Illustration · generic documents, no real records', S.page); S.ill.className = 'mono';
  S.her = el('div', { left: V(40, -40) + 'px', bottom: '0px', width: V(640, 560) + 'px', height: V(600, 520) + 'px', display: 'none', transformOrigin: '50% 100%' }, '', S.page);
  el('img', { left: 0, bottom: 0, width: '100%' }, '', S.her).src = CUT + 'f_264.07.png';
}, (lt, S) => {
  const tilt = lerp(38, 18, eIO(prog(lt, 2.3, 3.9)));
  set(S.desk, { transform: `rotateX(${tilt}deg) translateY(${V(60, 40)}px)` });
  const gather = eIO(prog(lt, 2.5, 3.9));
  S.docs.forEach((d, i) => {
    const T = (PORTRAIT ? SCATTERP : SCATTER)[i];
    const t0 = 0.15 + [2, 0, 4, 1, 5, 3, 6][i] * 0.11;
    const p = lt < t0 ? 0 : spring(lt - t0, 1.6, 0.68);
    const a = (i / DOCS.length) * Math.PI * 2;
    const from = [CX + Math.cos(a) * V(1500, 1100), CY + Math.sin(a) * V(1000, 1500), 500];
    let x = lerp(from[0], T[0], p), y = lerp(from[1], T[1], p), z = lerp(from[2], 0, p) + Math.sin(clamp(p) * Math.PI) * 120, rz = lerp(T[2] * 4, T[2], p), rx = lerp(-40, 0, clamp(p)), ry = lerp(30, 0, clamp(p));
    // gather: slide into one neat stack, each lands a beat apart, squared up (tiny residual angles)
    const gp = eIO(prog(lt, 2.5 + i * 0.09, 3.3 + i * 0.09));
    const sx = V(1240, CX), sy = V(640, 1130);
    x = lerp(x, sx, gp); y = lerp(y, sy - i * 4, gp); z = lerp(z, i * 4, gp); rz = lerp(rz, (hash(i) - 0.5) * 3, gp);
    const sc = lerp(1, 1.55, gp);
    set(d.e, { transform: `translate3d(${x - d.w / 2}px, ${y - d.h / 2}px, ${z}px) rotateZ(${rz}deg) rotateX(${rx}deg) rotateY(${ry}deg) scale(${sc})`, zIndex: i });
  });
  slam(S.h1.words, lt, 0.35, 0.07); set(S.h1.e, { display: lt < 3.6 ? 'block' : 'none' });
  slam(S.h2.words, lt, 3.65, 0.07); set(S.h2.e, { display: lt >= 3.6 ? 'block' : 'none' });
  // the stamp slams on the stack (4.15 s): big -> 1, 2-frame shake of the whole page
  const sa = lt - 4.15, sp = sa < 0 ? 0 : clamp(spring(sa, 4, 0.6), 0, 1.1);
  set(S.st, { display: sa < 0 ? 'none' : 'block', left: V(1060, CX - 190) + 'px', top: V(560, 1080) + 'px', transform: `rotate(-8deg) scale(${lerp(2.2, 1, sp)})`, opacity: clamp(sa / 0.05) });
  const shake = sa > 0 && sa < 0.1 ? (sa < 0.033 ? 6 : sa < 0.066 ? -4 : 2) : 0;
  set(S.persp, { transform: `translate(${shake}px, ${shake * 0.6}px)` });
  set(S.ill, { opacity: 1 });
  const hp = lt < 3.75 ? 0 : spring(lt - 3.75, 1.8, 0.7);
  set(S.her, { display: hp > 0 ? 'block' : 'none', transform: `translateY(${(1 - hp) * 520}px)` });
  // page turn (4.85 - 5.75): this whole desk page turns over its left edge like a sheet, revealing the next one
  const pt = eIn(prog(lt, 4.85, 5.7));
  set(S.page, { transform: `perspective(2600px) rotateY(${-pt * 105}deg)`, boxShadow: pt > 0 ? `0 0 ${80 * pt}px rgba(0,0,0,${0.25 * pt})` : 'none' });
}, 2);
// ================================================================= 2. the minimal record: everything but the status is redacted (4.8 - 10 s)
const FIELDS = [['Name', 0.52], ['Spouse', 0.48], ['Date of marriage', 0.34], ['Court', 0.42], ['History', 0.6], ['Status', 0]];
scene('record', 4.8, 10.5, (r, S) => {
  S.persp = el('div', { left: 0, top: 0, width: W + 'px', height: H + 'px', perspective: '2400px' }, '', r);
  const sw = V(860, 900), sh = V(1000, 1120);
  S.sheet = el('div', { left: V(CX + 40, CX - sw / 2) + 'px', top: V(50, 640) + 'px', width: sw + 'px', height: sh + 'px', transformOrigin: '50% 0%' }, '', S.persp); S.sheet.className = 'sheet';
  el('div', { left: '70px', top: '64px', fontSize: '26px', color: C.grey }, 'Record · illustration', S.sheet).className = 'mono';
  S.rows = FIELDS.map(([f, wv], i) => {
    const y = 140 + i * V(122, 136);
    el('div', { left: '70px', top: y + 'px', fontSize: '24px', color: C.grey }, f, S.sheet).className = 'mono';
    if (f === 'Status') { const v = el('div', { left: '70px', top: (y + 40) + 'px', fontSize: '64px', fontWeight: 800, fontStretch: '62%', textTransform: 'uppercase' }, 'Active marriage', S.sheet); return { v, status: true }; }
    el('div', { left: '70px', top: (y + 50) + 'px', width: (sw - 140) * wv + 'px', height: '22px', background: C.bar }, '', S.sheet);
    const bar = el('div', { left: '62px', top: (y + 38) + 'px', width: (sw - 124) + 'px', height: '48px', background: C.ink, transformOrigin: '0% 50%' }, '', S.sheet);
    return { bar };
  });
  S.h = headline(r, `Nothing<br>${acc('else.')}`, { x: V(110, 80), y: V(150, 200), size: V(190, 170) });
  S.sub = el('div', { left: V(116, 86) + 'px', top: V(560, 430) + 'px', fontSize: V(38, 36) + 'px', fontWeight: 500, fontStretch: '100%', width: V(640, 900) + 'px', lineHeight: 1.25, color: C.ink }, 'No name of spouse, no dates, no history.', r);
}, (lt, S) => {
  // the sheet settles from a slight lean (it is the back of the turned page)
  const settle = spring(lt - 0.15, 1.2, 0.75);
  set(S.sheet, { transform: `rotateX(${lerp(10, 2.5, settle)}deg) rotateZ(${lerp(-3, -1.2, settle)}deg)` });
  S.rows.forEach((rw, i) => {
    if (rw.status) return;
    const t0 = 1.6 + [0, 1, 2, 3, 4][i] * 0.16, p = eOut(prog(lt, t0, t0 + 0.32));
    set(rw.bar, { transform: `scaleX(${p})` });
  });
  slam(S.h.words, lt, 2.75, 0.1);
  const sp = eOut(prog(lt, 3.25, 3.8)); set(S.sub, { opacity: sp, transform: `translateY(${(1 - sp) * 14}px)` });
}, 1);
// ================================================================= 3. consent: 2003 folder vs 3 seconds on a phone (still, 11 - 14)
scene('consent', 11, 14, (r, S) => {
  S.h = headline(r, `The ${acc('consent')} part.`, { x: V(110, 80), y: V(80, 230), size: V(120, 130) });
  // folder (2003)
  const fx = V(180, 140), fy = V(380, 640);
  S.f = el('div', { left: fx + 'px', top: fy + 'px', width: V(600, 560) + 'px', height: V(420, 380) + 'px', background: C.folder, borderRadius: '6px 28px 8px 8px', boxShadow: '0 16px 30px rgba(20,24,30,.16)', transform: 'rotate(-3deg)' }, '', r);
  el('div', { left: '0px', top: '-34px', width: '210px', height: '50px', background: C.folder, borderRadius: '10px 10px 0 0' }, '', S.f);
  el('div', { left: '40px', top: '40px', fontSize: '26px', color: '#7A5A21' }, 'Divorce · 2003', S.f).className = 'mono';
  el('div', { left: '40px', top: '80px', fontSize: '22px', color: '#9C7A3A' }, 'In a courthouse, somewhere', S.f).className = 'mono';
  S.n1 = el('div', { left: fx + 'px', top: (fy + V(450, 410)) + 'px', fontSize: V(170, 150) + 'px' }, '2003', r); S.n1.className = 'h';
  // phone (3 seconds)
  const px = V(1180, 600), py = V(300, 1110);
  S.p = el('div', { left: px + 'px', top: py + 'px', width: V(300, 300) + 'px', height: V(600, 600) + 'px', background: C.ink, borderRadius: '46px', transform: 'rotate(4deg)', boxShadow: '0 20px 40px rgba(20,24,30,.25)' }, '', r);
  const scr = el('div', { left: '14px', top: '14px', right: '14px', bottom: '14px', background: '#fff', borderRadius: '34px', overflow: 'hidden' }, '', S.p);
  const mini = sheet(scr, { label: 'Divorce record', seal: true }, 230); set(mini.e, { left: '22px', top: '60px', boxShadow: 'none' });
  S.n2 = el('div', { left: V(px + 340, 80) + 'px', top: V(py + 330, 1770) + 'px', fontSize: V(170, 150) + 'px' }, `<span style="color:${C.red}">3</span> sec`, r); S.n2.className = 'h';
  if (PORTRAIT) set(S.n2, { left: (px - 470) + 'px', top: (py + 380) + 'px' });
}, (lt, S) => { slam(S.h.words, lt, 0.05); });
// ================================================================= 4. TechCabal's drawback, as a real clipping (still, 14 - 17)
scene('clip', 14, 17, (r, S) => {
  S.h = headline(r, `"But there's<br>a ${acc('drawback.')}"`, { x: V(110, 80), y: V(110, 250), size: V(140, 140) });
  const cw = V(1000, 920), k = (cw - 60) / 1200, ch = 215 * k + 60;
  S.c = el('div', { left: V(820, 80) + 'px', top: V(330, 640) + 'px', width: cw + 'px', height: ch + 'px', transform: 'rotate(-2deg)', zIndex: 3 }, '', r); S.c.className = 'sheet';
  const win = el('div', { left: '30px', top: '30px', width: (cw - 60) + 'px', height: (215 * k) + 'px', overflow: 'hidden' }, '', S.c);
  el('img', { left: '0px', top: (-55 * k) + 'px', width: (cw - 60) + 'px' }, '', win).src = SRC + 'techcabal/tc_crop_drawback_paragraph.png';
  // red marker under "sensitive / personal information" (measured in the capture: line 1 x 900-1023, line 2 x 48-347)
  el('div', { left: (30 + 900 * k) + 'px', top: (30 + 47 * k + 6) + 'px', width: (125 * k) + 'px', height: '5px', background: C.red }, '', S.c);
  el('div', { left: (30 + 48 * k) + 'px', top: (30 + 97 * k + 6) + 'px', width: (300 * k) + 'px', height: '5px', background: C.red }, '', S.c);
  el('div', { left: V(820, 80) + 'px', top: V(330, 640) + (ch + 40) + 'px', fontSize: '18px', color: C.grey }, 'Screenshot · TechCabal Daily · 8 Sep 2026', r).className = 'mono';
  if (PORTRAIT) { const hb = el('div', { left: '120px', bottom: '0px', width: '840px', height: '760px' }, '', r); el('img', { left: 0, bottom: 0, width: '100%' }, '', hb).src = CUT + 'f_183.27.png'; }
  S.tape = el('div', { left: V(820 + cw / 2 - 90, 80 + cw / 2 - 90) + 'px', top: V(305, 615) + 'px', width: '180px', height: '46px', zIndex: 4, background: 'rgba(255,255,255,.55)', transform: 'rotate(3deg)', boxShadow: '0 1px 2px rgba(0,0,0,.08)' }, '', r);
}, (lt, S) => { slam(S.h.words, lt, 0.05); });
</script></body></html>
