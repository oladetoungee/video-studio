<!doctype html><html><head><meta charset="utf-8"><link rel="stylesheet" href="../../lib/base.css"><style>
.t{--ground:var(--blue);--fg:var(--white);--accent:var(--green)}
.h{left:52px;top:52px;font-size:84px}.h>div+div{margin-top:4px}
.ui.card{left:52px;top:262px;width:620px;height:400px;padding:22px 34px}
.ui .lbl{right:20px;top:16px;font-size:15px}
.hd{display:flex;align-items:center;gap:14px;font-family:'DM Mono';font-weight:500;font-size:24px;letter-spacing:.12em;text-transform:uppercase;color:rgba(17,17,20,.6);height:44px}
.hd .flag{position:relative;width:48px;height:32px;outline:2px solid var(--ink)}
.big{display:flex;align-items:center;justify-content:space-between;height:132px;border-top:3px solid var(--ink);margin-top:12px}
.big .q{font-family:'Bricolage';font-weight:800;font-size:64px;text-transform:uppercase;letter-spacing:-.03em}
.big .a{font-family:'Bricolage';font-weight:800;font-size:72px;line-height:1;background:var(--accent);color:var(--ink);padding:14px 26px 8px;border:4px solid var(--ink);border-radius:10px}
.row{height:58px;font-size:26px}
.row .k{width:170px;font-size:22px}
</style></head><body><div class="t">
<img class="cut" data-img="person" alt="">
<div class="h disp" data-move="headline"><div data-k="line1"></div><div data-k="line2"></div></div>
<div class="ui card" data-move="card">
  <div class="lbl" data-k="label"></div>
  <div class="hd"><div class="flag" data-flag="gh"></div><span data-k="head"></span></div>
  <div class="big"><span class="q" data-k="q"></span><span class="a" data-k="yes"></span></div>
  <div class="row"><span class="k" data-k="k1"></span><span class="redact" style="width:290px"></span></div>
  <div class="row"><span class="k" data-k="k2"></span><span class="redact" style="width:210px"></span></div>
  <div class="row"><span class="k" data-k="k3"></span><span class="redact" style="width:330px"></span></div>
</div>
</div><script src="../../lib/flags.js"></script><script src="../../lib/bind.js"></script></body></html>
