<!doctype html><html><head><meta charset="utf-8"><link rel="stylesheet" href="../../lib/rm.css"><style>
/* sample 4 measured: real room; whiteboard x 255-720 y 100-490 behind her hair; white printed chart x 120-578 y 160-638
   (serif small-caps title 2 lines, engraving-style black drawings, old italic hand labels, a speech bubble with bullets);
   person on the right, face box 252 px centred 841,371 (here 350 px: her frame must fill the left edge);
   headline lowercase white geometric sans ~105 px, x 165-1150, x-height y 50-100, soft dark shadow. */
.t{--ground:#2a2f2a;--fg:#FFFFFF;--accent:#111;--px:15px;--py:-53px;--pw:1520px;--dim:0}
.wb{position:absolute;left:255px;top:96px;width:470px;height:400px;background:#E6E7EA;border:8px solid #55565b;border-left-width:5px;z-index:1;box-shadow:0 10px 30px rgba(0,0,0,.35)}
.wb i{position:absolute;right:24px;top:14px;width:20px;height:20px;border-radius:50%;background:#cfd0d4}
.card{position:absolute;left:120px;top:160px;width:458px;height:478px;background:#fff;z-index:3;box-shadow:0 6px 18px rgba(0,0,0,.35);color:#111}
.card .tt{position:absolute;left:0;right:0;top:14px;text-align:center;font-family:'Fell SC';font-size:29px;line-height:1.12;letter-spacing:.02em}
.card .it{position:absolute;font-family:'Fell';font-style:italic;font-size:20px;line-height:1.05;color:#111;white-space:nowrap}
.card .bub{position:absolute;left:236px;top:88px;width:200px;height:96px;border:2px solid #111;border-radius:14px;padding:7px 10px;font-family:'Fell';font-style:italic;font-size:15.5px;line-height:1.18}
.card .ill{position:absolute;right:8px;bottom:6px;color:#9a9a9a;font-size:10px}
.card svg{position:absolute;left:0;top:0}
.bgfill{position:absolute;inset:0;overflow:hidden}.bgfill img{position:absolute;left:-700px;top:-260px;width:2600px;filter:blur(14px) brightness(.92)}
.photo{-webkit-mask-image:linear-gradient(90deg,transparent 15px,#000 75px);mask-image:linear-gradient(90deg,transparent 15px,#000 75px)}
.hd{position:absolute;left:0;right:0;top:4px;text-align:center;font-family:'Montserrat';font-weight:600;font-size:72px;color:var(--fg);letter-spacing:-.01em;white-space:nowrap;text-shadow:0 3px 18px rgba(0,0,0,.6),0 1px 4px rgba(0,0,0,.45);z-index:4}
</style></head><body><div class="t">
<div class="bgfill"><img data-img="scene" alt=""></div>
<div class="photo" data-move="photo"><img data-img="scene" alt=""><div class="dim"></div></div>
<div class="wb" data-move="whiteboard"><i></i></div>
<div class="front"><img data-img="front" alt=""></div>
<div class="card" data-move="chart">
  <div class="tt"><div data-k="d1"></div><div data-k="d2"></div></div>
  <svg width="458" height="478" viewBox="0 0 458 478">
    <!-- courthouse (engraving style) -->
    <g transform="translate(52 112)" stroke="#111" fill="none" stroke-width="2.2">
      <path d="M0 40 L70 8 L140 40 Z" fill="#fff"/><path d="M16 36 L70 13 L124 36" stroke-width="1.2"/>
      <rect x="4" y="40" width="132" height="8" fill="#111"/>
      <g fill="#fff"><rect x="14" y="50" width="12" height="54"/><rect x="40" y="50" width="12" height="54"/><rect x="88" y="50" width="12" height="54"/><rect x="114" y="50" width="12" height="54"/></g>
      <path d="M17 56 V100 M43 56 V100 M91 56 V100 M117 56 V100" stroke-width="1"/>
      <rect x="58" y="62" width="24" height="42" fill="#111"/>
      <rect x="0" y="104" width="140" height="7" fill="#111"/><rect x="-6" y="111" width="152" height="7"/>
    </g>
    <!-- ledger / register books -->
    <g transform="translate(60 318)" stroke="#111" stroke-width="2.2">
      <rect x="0" y="40" width="150" height="26" fill="#fff"/><path d="M8 47 H142 M8 53 H142 M8 59 H142" stroke-width="1"/>
      <rect x="10" y="16" width="134" height="24" fill="#111"/><path d="M22 28 H70" stroke="#fff" stroke-width="2"/>
      <path d="M18 16 L36 -6 L150 -6 L144 16 Z" fill="#fff"/><path d="M40 -1 H140 M36 4 H138 M32 9 H136" stroke-width="1"/>
      <rect x="0" y="66" width="150" height="8" fill="#111"/>
    </g>
    <!-- arrow from courthouse down to the books -->
    <path d="M128 258 V296" stroke="#111" stroke-width="3" fill="none"/><path d="M118 290 L128 306 L138 290 Z" fill="#111"/>
    <!-- phone silhouette with a search bar (like the sample's figure) -->
    <g transform="translate(286 196)">
      <rect x="0" y="0" width="98" height="196" rx="18" fill="#111"/><rect x="34" y="7" width="30" height="5" rx="2.5" fill="#444"/>
      <rect x="8" y="22" width="82" height="20" rx="6" fill="#fff"/><circle cx="20" cy="32" r="5" fill="none" stroke="#111" stroke-width="2"/><path d="M24 36 L28 40" stroke="#111" stroke-width="2"/>
      <path d="M32 32 H76" stroke="#111" stroke-width="2.5"/>
      <rect x="8" y="54" width="82" height="64" rx="6" fill="#fff"/>
      <circle cx="44" cy="80" r="9" fill="none" stroke="#111" stroke-width="2.5"/><circle cx="56" cy="80" r="9" fill="none" stroke="#111" stroke-width="2.5"/>
      <path d="M20 104 H78" stroke="#111" stroke-width="2"/>
      <rect x="8" y="128" width="82" height="22" rx="6" fill="#fff"/><path d="M18 139 H70" stroke="#111" stroke-width="2"/><rect x="8" y="158" width="82" height="22" rx="6" fill="#fff"/><path d="M18 169 H60" stroke="#111" stroke-width="2"/>
    </g>
    <!-- glow ring around the phone, like the sample's circle -->
    <circle cx="335" cy="292" r="80" fill="none" stroke="#111" stroke-width="1.6"/>
    <!-- grey arrow from the books into the phone -->
    <path d="M214 352 C 240 340, 262 320, 276 300" stroke="#555" stroke-width="12" fill="none" stroke-linecap="round"/><path d="M262 294 L288 286 L282 312 Z" fill="#555"/>
    <path d="M300 186 L296 198" stroke="#111" stroke-width="2"/>
  </svg>
  <div class="bub"><div data-k="b1"></div><div data-k="b2"></div><div data-k="b3"></div><div data-k="b4"></div></div>
  <div class="it" style="left:16px;top:236px" data-k="l1"></div>
  <div class="it" style="left:20px;top:394px" data-k="l2"></div>
  <div class="it" style="left:250px;top:240px;text-align:right;width:28px;white-space:normal;font-size:15px" data-k="l5"></div>
  <div class="it" style="left:20px;top:416px" data-k="l3"></div>
  <div class="it" style="left:20px;top:438px" data-k="l4"></div>
  <div class="it" style="left:276px;top:410px;text-align:center;width:120px;white-space:normal" data-k="l6"></div>
  <div class="ill">Illustration</div>
</div>
<div class="hd" data-k="head"></div>
</div><script src="../../lib/rm.js"></script><script src="../../lib/bind.js"></script></body></html>
