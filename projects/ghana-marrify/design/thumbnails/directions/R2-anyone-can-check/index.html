<!doctype html><html><head><meta charset="utf-8"><link rel="stylesheet" href="../../lib/rm.css"><style>
/* sample 2 measured (1280x720 crop): near-white ground #FDFDFD with a barely visible grid; clipboard board x 255-535,
   y 205-590, paper x 265-525 y 235-575, black clip x 335-480 y 162-240; four handwritten rows at y 320/383/445/507,
   box + word in marker caps ~40 px; yellow pencil (450,535)->(570,345); serif line x 595-1080, line 1 cap top 272,
   baselines 360 / 465, condensed old-style serif ~125 px, warm grey-brown #4A4038, tight tracking. */
.t{--ground:#FDFDFC;--fg:#4A4038;--accent:#2B2B2B}
.grid2{position:absolute;inset:0;background-image:linear-gradient(rgba(0,0,0,.02) 1px,transparent 1px),linear-gradient(90deg,rgba(0,0,0,.02) 1px,transparent 1px);background-size:64px 64px}
.cb{position:absolute;left:255px;top:162px;width:280px;height:430px}
.board{position:absolute;left:0;top:43px;width:280px;height:385px;border-radius:12px;background:#8B6845;
       box-shadow:inset 0 0 0 3px #6f5132,0 6px 14px rgba(0,0,0,.18)}
.paper{position:absolute;left:10px;top:73px;width:260px;height:340px;background:#FBFBF8;
       background-image:repeating-linear-gradient(#fbfbf8 0 20px,#dfe3ea 20px 21px);box-shadow:0 1px 2px rgba(0,0,0,.15)}
.clp{position:absolute;left:80px;top:0;width:145px;height:78px}
.rows{position:absolute;left:28px;top:132px}
.row2{position:relative;height:62px;display:flex;align-items:center;gap:12px;font-family:'Gochi';font-size:33px;color:#151515;letter-spacing:.05em;white-space:nowrap}
.row2 svg{flex:none;overflow:visible}
.serif2{position:absolute;left:600px;top:282px;font-family:'Instrument Serif';font-weight:400;color:var(--fg);font-size:130px;
        line-height:.84;letter-spacing:-.045em;white-space:nowrap}
.serif2 div:nth-child(2){font-size:103px}
</style></head><body><div class="t">

<div class="cb" data-move="clipboard">
  <div class="board"></div><div class="paper"></div>
  <svg class="clp" viewBox="0 0 145 78"><rect x="40" y="2" width="65" height="44" rx="14" fill="#1b1b1b"/><circle cx="72.5" cy="20" r="9" fill="#FDFDFC"/>
    <path d="M6 78 L18 40 H127 L139 78 Z" fill="#202020"/><rect x="18" y="40" width="109" height="8" fill="#3a3a3a"/>
    <rect x="0" y="66" width="18" height="12" fill="#aaa"/><rect x="127" y="66" width="18" height="12" fill="#aaa"/></svg>
  <div class="rows">
    <div class="row2"><svg width="30" height="30"><path d="M3 4 L27 3 L28 27 L4 28 Z" fill="none" stroke="#151515" stroke-width="3" stroke-linejoin="round"/></svg><span data-k="r1"></span></div>
    <div class="row2"><svg width="30" height="30"><path d="M3 4 L27 3 L28 27 L4 28 Z" fill="none" stroke="#151515" stroke-width="3" stroke-linejoin="round"/><path d="M-4 -6 L34 34 M30 -2 L-2 36" stroke="#151515" stroke-width="3.4" stroke-linecap="round"/></svg><span data-k="r2"></span></div>
    <div class="row2"><svg width="30" height="30"><path d="M3 4 L27 3 L28 27 L4 28 Z" fill="none" stroke="#151515" stroke-width="3" stroke-linejoin="round"/></svg><span data-k="r3"></span></div>
    <div class="row2"><svg width="30" height="30"><path d="M3 4 L27 3 L28 27 L4 28 Z" fill="none" stroke="#151515" stroke-width="3" stroke-linejoin="round"/></svg><span data-k="r4"></span></div>
  </div>
</div>
<svg style="position:absolute;left:0;top:0;overflow:visible" width="1" height="1" data-move="pencil">
  <g transform="translate(474 572) rotate(-57.7)"><rect x="18" y="-5" width="190" height="10" fill="#E9B92C"/><rect x="18" y="-5" width="190" height="3" fill="#F5D35A"/>
  <path d="M0 0 L18 -5 L18 5 Z" fill="#E8C9A0"/><path d="M0 0 L6 -1.7 L6 1.7 Z" fill="#333"/><rect x="208" y="-5" width="12" height="10" fill="#BDBDBD"/></g></svg>
<div class="serif2" data-move="headline"><div data-k="line1"></div><div data-k="line2"></div></div>
</div><script src="../../lib/rm.js"></script><script src="../../lib/bind.js"></script></body></html>
