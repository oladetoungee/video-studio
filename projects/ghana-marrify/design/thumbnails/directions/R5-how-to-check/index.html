<!doctype html><html><head><meta charset="utf-8"><link rel="stylesheet" href="../../lib/rm.css"><style>
/* sample 5 measured: bright blurred room (white/pale blue, window light); "how to be" Helvetica-like bold, dark grey #3D4448,
   x 180-535, ~75 px; "consistent" heavy red #E3141B lowercase, x 35-1250, x-height y 85-225, behind her head;
   face box 179 px centred 636,265; thin black wave (4 px) behind her from (70,410) peaking at y 240 / 262, to (1280,70);
   book stacks left x 0-270 y 405-720, right x 980-1280 y 410-720; open book on a dark wood desk x 360-890 y 585-690. */
.t{--ground:#EEF2F4;--fg:#3D4448;--accent:#E3141B;--cx:-64px;--cy:62px;--cw:1355px}
.bg{position:absolute;inset:-40px;overflow:hidden}.bg img{width:100%;height:100%;object-fit:cover;filter:blur(10px) brightness(1.15) saturate(.55)}
.wash{position:absolute;inset:0;background:rgba(236,244,250,.36)}
.sm{position:absolute;left:150px;top:2px;font-family:'Inter';font-weight:700;font-size:44px;letter-spacing:-.035em;color:var(--fg);white-space:nowrap}
.big{position:absolute;left:0;right:0;top:-6px;text-align:center;font-family:'Inter';font-weight:800;font-size:330px;letter-spacing:-.055em;color:var(--accent);line-height:1;white-space:nowrap;text-shadow:0 0 3px rgba(255,255,255,.9)}
.wave{position:absolute;left:0;top:0;overflow:visible}
.wave path{fill:none;stroke:#1d1d1d;stroke-width:4}
.cut2{z-index:2}.cut2 img{filter:drop-shadow(0 0 14px rgba(40,50,60,.22))}
.desk{position:absolute;left:0;right:0;top:648px;bottom:0;background:#5B3E2C;background-image:repeating-linear-gradient(178deg,rgba(0,0,0,.08) 0 3px,transparent 3px 11px),repeating-linear-gradient(181deg,rgba(255,255,255,.05) 0 2px,transparent 2px 17px);z-index:3;box-shadow:inset 0 3px 0 rgba(255,255,255,.12)}
.book{position:absolute;left:356px;top:606px;z-index:4}
.stl{position:absolute;left:-30px;top:388px;width:320px;z-index:5}.str{position:absolute;left:968px;top:372px;width:340px;z-index:5}
.stl img,.str img{width:100%;display:block;filter:brightness(1.05) drop-shadow(0 8px 10px rgba(0,0,0,.25))}.str img{filter:sepia(.45) brightness(1.45) saturate(.8) drop-shadow(0 8px 10px rgba(0,0,0,.25))}
</style></head><body><div class="t">
<div class="bg"><img data-img="bg" alt=""></div><div class="wash"></div>
<div class="sm" data-k="small"></div>
<div class="big" data-k="big"></div>
<svg class="wave" width="1" height="1" data-move="wave"><path d="M70 412 C 100 300, 140 238, 196 240 C 280 244, 340 440, 430 446 C 560 452, 680 262, 790 262 C 900 262, 950 446, 1040 446 C 1110 446, 1140 300, 1170 230 C 1200 160, 1240 90, 1290 66"/></svg>
<div class="cut2" data-move="her"><img data-img="front" alt=""></div>
<div class="desk"></div>
<svg class="book" width="540" height="130" viewBox="0 0 540 130" data-move="register">
  <path d="M8 118 L20 20 Q140 4 270 22 Q400 4 520 20 L532 118 Q400 104 270 124 Q140 104 8 118 Z" fill="#26364a"/>
  <path d="M22 108 L32 18 Q150 2 268 18 L268 116 Q150 98 22 108 Z" fill="#F6F0E2"/>
  <path d="M518 108 L508 18 Q390 2 272 18 L272 116 Q390 98 518 108 Z" fill="#F3ECDD"/>
  <g stroke="#b9ad95" stroke-width="1.2"><path d="M44 40 H252 M42 52 H252 M40 64 H254 M38 76 H254 M36 88 H254"/><path d="M290 40 H496 M290 52 H498 M290 64 H500 M290 76 H502 M290 88 H504"/></g>
  <g stroke="#3b3b5a" stroke-width="1.6" fill="none"><path d="M60 50 c8-5 14 4 22-1 s14-4 20 1 M120 50 c10-4 18 3 30 0"/><path d="M58 74 c10-5 20 4 30-1 s18 3 26 0"/><path d="M310 50 c8-5 16 3 26-1 s12 4 22 0"/><path d="M312 74 c10-4 18 4 28 0 c8-3 14 3 22 0"/></g>
  <text x="145" y="32" text-anchor="middle" font-family="Fell SC" font-size="14" fill="#5a4a2a" data-k="reg"></text>
  <path d="M270 20 V120" stroke="#cfc4ad" stroke-width="2"/>
</svg>
<div class="stl" data-move="stack-left"><img data-img="left" alt=""></div>
<div class="str" data-move="stack-right"><img data-img="right" alt=""></div>
</div><script src="../../lib/rm.js"></script><script src="../../lib/bind.js"></script></body></html>
