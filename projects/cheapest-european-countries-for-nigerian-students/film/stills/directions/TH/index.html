<!doctype html><html><head><meta charset="utf-8">
<link rel="stylesheet" href="../_shared/fonts.css">
<style>
#stage{background:#111;font-family:Sofia,sans-serif}
.foot{position:absolute;overflow:hidden}.foot img{position:absolute;max-width:none}
.mono{font-family:Martian;font-stretch:87.5%;font-weight:500}
.card{position:absolute;background:#fff;padding:16px 16px 12px}
.cred{font-family:Martian;font-stretch:87.5%;font-size:32px;color:#55565A;margin-top:10px}
/* A captions: C2, caps + key word on a shelf-label yellow box */
.capA{position:absolute;text-align:center;font-family:SofiaX;font-weight:900;text-transform:uppercase;color:#fff;text-shadow:0 3px 0 rgba(0,0,0,.45);line-height:1}
.capA b{background:#FFD60A;color:#121212;padding:0 .14em;text-shadow:none}
/* B captions: C12 pop-up number + small sentence */
.capB{position:absolute;font-family:RHD;font-weight:700;color:#fff;text-shadow:0 2px 0 rgba(0,0,0,.5);text-align:center}
.popB{position:absolute;font-family:RHD;font-weight:900;background:#FF5B14;color:#fff;padding:.04em .22em}
/* C captions: C4, serif on black boxes */
.capC{position:absolute;text-align:center;font-family:Gloock;color:#fff;line-height:1.5}
.capC span{background:#000;padding:.06em .3em;border-radius:8px;box-decoration-break:clone;-webkit-box-decoration-break:clone}
</style></head><body><div id="stage"></div>
<script src="../_shared/lib.js"></script><script src="../_shared/kit.js"></script><script src="../_shared/rcpt.js"></script>
<script>
const W = 1920, H = 1080; const S = $('#stage'); st(S, { width: W + 'px', height: H + 'px' });
const foot = (src, x, y, w, h, ox, oy, sc = 1) => `<div class="foot" style="left:${x}px;top:${y}px;width:${w}px;height:${h}px"><img src="../_src/${src}" style="left:${-ox}px;top:${-oy}px;width:${1920 * sc}px;height:${1080 * sc}px"></div>`;
const DAAD = () => receipt('de', [405, 316, 712, 66], 900, [[1071, 320, 30, 25], [415, 352, 139, 25]], { cover: [405, 316, 140, 31] });
const scenes = {
  // A: half and half. her on the left (cropped only), the shelf label on the right
  th1: () => `${foot('raw_113.jpg', 0, 0, 960, 1080, 450, 0)}
   <div style="position:absolute;left:960px;top:0;width:960px;height:1080px;background:#E4E6E3"></div>
   <div style="position:absolute;left:960px;top:400px;width:960px;height:300px;background:#2A2B2E"></div>
   <div style="position:absolute;left:1040px;top:300px;width:820px;height:480px;background:#FFD60A">
     <div style="position:absolute;left:0;right:0;top:0;height:92px;background:#121212;color:#fff;font-weight:800;font-size:54px;display:flex;align-items:center;justify-content:space-between;padding:0 36px">GERMANY${flag('DE', 84)}</div>
     <div style="position:absolute;left:36px;top:118px;font-weight:800;font-size:46px">PROOF OF FUNDS</div>
     <div style="position:absolute;left:30px;top:186px;font-family:SofiaX;font-weight:900;font-size:236px;line-height:.8">€11,904</div>
     <div class="mono" style="position:absolute;left:36px;bottom:30px;font-size:34px">€992 a month × 12 · blocked account</div></div>
   <div class="capA" style="left:0;width:960px;top:880px;font-size:84px">The first country<br>is <b>Germany</b></div>`,
  // B: the calculator display behind her (TV/slide behind her), her cut-out in front
  th2: () => `<div style="position:absolute;inset:0;background:#E4DED2"></div>
   <div style="position:absolute;left:880px;top:90px;width:980px;height:520px;background:#25262A;border-radius:40px"></div>
   <div style="position:absolute;left:920px;top:130px;width:900px;height:440px;background:#C4CCAE;border-radius:14px;box-shadow:inset 0 0 0 6px #A3AC8F">
     <div style="position:absolute;left:36px;top:26px;font-family:RHM;font-weight:700;font-size:30px;color:#1C2116">EE · €</div>
     <div style="position:absolute;right:40px;top:26px;font-family:RHM;font-weight:600;font-size:40px;color:#1C2116">MY FEE A YEAR</div>
     <div style="position:absolute;right:40px;bottom:50px">${lcd('6,000.', 230)}</div></div>
   ${foot('her_545.png', 0, 0, 1920, 1080, 560, 0)}
   <div class="capB" style="left:880px;width:980px;top:680px;font-size:64px;color:#1A1A1C;text-shadow:none;text-align:left;line-height:1.15">I’m paying <span class="popB" style="position:static;display:inline-block">6,000 euros</span> a year.</div>`,
  // C: her cut-out in front of the height chart (green-screen background)
  th3: () => { let ch = ''; for (let i = 0; i <= 10; i++) { const y = 940 - i * 80; ch += `<div style="position:absolute;left:0;width:1920px;top:${y}px;height:${i % 2 ? 2 : 3}px;background:rgba(237,235,228,${i % 2 ? .16 : .42})"></div>` + (i % 2 ? '' : `<div style="position:absolute;left:780px;top:${y - 50}px;font-family:League;font-size:46px;color:rgba(237,235,228,.75)">€${i * 2}k</div>`); }
    return `<div style="position:absolute;inset:0;background:#1B1C1F"></div>${ch}
   <div style="position:absolute;left:1240px;width:240px;top:${940 - 80 * 10177 / 2000}px;height:${80 * 10177 / 2000}px;background:#2EE59D"></div>
   <div style="position:absolute;left:1560px;width:240px;top:${940 - 80 * 17206 / 2000}px;height:${80 * 17206 / 2000}px;border:4px solid #EDEBE4;border-bottom:0"></div>
   <div style="position:absolute;left:1120px;width:480px;text-align:center;top:${940 - 80 * 10177 / 2000 - 86}px;font-family:League;font-size:76px;color:#2EE59D">UNDER 24 · €10,177</div>
   <div style="position:absolute;left:1440px;width:480px;text-align:center;top:${940 - 80 * 17206 / 2000 - 86}px;font-family:League;font-size:76px;color:#EDEBE4">24+ · €17,206</div>
   ${foot('her_692.png', 0, 0, 1920, 1080, 600, 0)}
   <div class="capC" style="left:0;width:1300px;top:860px;font-size:54px"><span>If you’re under 24, Austria is one</span><br><span>of the cheapest</span></div>`; },
  // A: her full frame, the real page as a card in the top third (receipt within 5 s), C2 caption
  th4: () => `${foot('raw_150.jpg', 0, 0, 1920, 1080, 0, 0)}
   <div class="card" style="left:960px;top:70px;transform:rotate(1deg)">${DAAD()}<div class="cred">daad.de · 2 Nov 2026</div></div>
   <div class="capA" style="left:0;width:1920px;top:900px;font-size:88px">you have to show <b>992 euros</b> for every month</div>`,
};
window.show = async n => { S.innerHTML = scenes[n](); await imagesReady(); };
imagesReady().then(() => window.READY = true);
</script></body></html>
