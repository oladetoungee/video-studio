<!doctype html><html><head><meta charset="utf-8">
<link rel="stylesheet" href="../_shared/fonts.css">
<style>
:root{--desk:#E4DED2;--body:#25262A;--lcd:#C4CCAE;--lcdink:#1C2116;--key:#DCD8CE;--op:#4A4C51;--eq:#FF5B14;--ink:#1A1A1C}
#stage{background:var(--desk);font-family:RHD,sans-serif;color:var(--ink)}
.calc{position:absolute;background:var(--body);border-radius:44px}
.lcd{position:absolute;background:var(--lcd);border-radius:14px;box-shadow:inset 0 0 0 6px #A3AC8F;overflow:hidden}
.hist{position:absolute;font-family:RHM;font-weight:600;color:var(--lcdink);white-space:nowrap}
.ind{position:absolute;font-family:RHM;font-weight:700;color:var(--lcdink);letter-spacing:.08em}
.big{position:absolute;right:0}
.keys{position:absolute;display:grid;grid-template-columns:repeat(4,1fr)}
.k{background:var(--key);border-radius:16px;display:flex;align-items:center;justify-content:center;font-weight:700;color:#222;box-shadow:0 7px 0 #9F9B92}
.k.op{background:var(--op);color:#fff;box-shadow:0 7px 0 #1B1C1F}.k.eq{background:var(--eq);color:#fff;box-shadow:0 7px 0 #B53A06}
.k.dn{transform:translateY(6px);box-shadow:0 1px 0 #9F9B92}.k.op.dn{box-shadow:0 1px 0 #1B1C1F}.k.eq.dn{box-shadow:0 1px 0 #B53A06}
.mono{font-family:RHM;font-weight:600}
.card{position:absolute;background:#fff;padding:16px 16px 12px}
.cred{font-family:RHM;font-weight:500;font-size:32px;color:#55565A;margin-top:10px}
.say{position:absolute;font-family:RHD;font-weight:800;letter-spacing:-.01em;line-height:1.02}
.say i{font-family:DMSI;font-weight:400;font-style:italic}
.pop{position:absolute;font-family:RHD;font-weight:900;color:#fff;background:var(--ink);padding:.06em .22em}
</style></head><body><div id="stage"></div>
<script src="../_shared/lib.js"></script><script src="../_shared/kit.js"></script><script src="../_shared/rcpt.js"></script>
<script>
const W = +Q.get('w') || 1920, H = +Q.get('h') || 1080; const S = $('#stage'); st(S, { width: W + 'px', height: H + 'px' });
// a wide display: hist line, big value, indicators
function disp(x, y, w, h, hist, val, ind = '', o = {}) {
  const dh = o.dh || h * 0.5;
  return `<div class="lcd" style="left:${x}px;top:${y}px;width:${w}px;height:${h}px">
    <div class="ind" style="left:${h * .12}px;top:${h * .08}px;font-size:${o.inds || 30}px">${ind}</div>
    <div class="hist" style="right:${h * .14}px;top:${h * .08}px;font-size:${o.hs || 40}px">${hist}</div>
    <div class="big" style="right:${h * .1}px;bottom:${h * .1}px">${lcd(val, dh)}</div></div>`;
}
const KEYS = ['C', '±', '%', '÷', '7', '8', '9', '×', '4', '5', '6', '−', '1', '2', '3', '+', '0', '.', 'M+', '='];
function calc(x, y, w, h, hist, val, ind, down = '', o = {}) {
  const lh = h * .27, pad = w * .07, kw = w - pad * 2, gap = w * .035;
  return `<div class="calc" style="left:${x}px;top:${y}px;width:${w}px;height:${h}px">
   ${disp(pad, pad, kw, lh, hist, val, ind, { dh: lh * .46, hs: o.hs || 34, inds: 26 })}
   <div class="keys" style="left:${pad}px;top:${pad + lh + gap * 1.4}px;width:${kw}px;height:${h - lh - pad * 2 - gap * 1.4}px;gap:${gap}px">
   ${KEYS.map(k => `<div class="k ${'÷×−+'.includes(k) || k === 'M+' ? 'op' : ''} ${k === '=' ? 'eq' : ''} ${down.split('|').includes(k) ? 'dn' : ''}" data-k="${k}" style="font-size:${w * .07}px">${k}</div>`).join('')}</div></div>`;
}
const OEAD = () => receipt('at', [70, 268, 490, 64], 760, [[105, 278, 435, 22], [105, 307, 450, 22]]);
const FRS = () => receipt('fr', [276, 274, 724, 32], 1000, [[477, 280, 120, 24]]);
const DAAD = () => receipt('de', [405, 316, 712, 66], 760, [[1071, 320, 30, 25], [415, 352, 139, 25]], { cover: [405, 316, 140, 31] });
const scenes = {
  b1: () => `
   <div class="calc" style="left:60px;top:70px;width:1800px;height:550px"></div>${disp(100, 110, 1720, 470, 'TUITION 0 + PROOF OF FUNDS 11,904 =', '11,904.', 'DE · € · FIRST YEAR', { dh: 250, hs: 46, inds: 34 })}
   <div class="say" style="left:110px;top:640px;font-size:76px;width:960px">“You really have to do the work of doing the <i>numbers</i>.”</div>
   <div class="mono" style="position:absolute;left:114px;top:920px;font-size:44px;color:#3A3A3A">Germany: €992 a month × 12, usually in a blocked account</div>
   <div class="card" style="left:1120px;top:680px;transform:rotate(1.2deg)">${DAAD()}<div class="cred">daad.de · 2 Nov 2026</div></div>`,
  b2: () => `
   <div class="calc" style="left:60px;top:40px;width:1800px;height:820px"></div>${disp(100, 80, 1720, 400, 'FRANCE · MASTER’S 3,950 + FUNDS 10,530 =', '14,480.', 'FR · €', { dh: 210, hs: 44, inds: 34 })}
   ${disp(100, 520, 1720, 300, 'FRANCE 14,480 − GERMANY 11,904 =', '2,576.', 'DIFF · €', { dh: 150, hs: 40, inds: 30 })}
   <div class="say" style="left:110px;top:870px;font-size:74px;width:1700px">“France comes out about 2,500 euros <i>more</i> for the first year.”</div>`,
  b3: () => `
   <div class="say" style="left:110px;top:70px;font-size:84px">Austria: your <i>age</i> changes the sum</div>
   <div class="calc" style="left:60px;top:200px;width:880px;height:390px"></div><div class="calc" style="left:980px;top:200px;width:880px;height:390px"></div>${disp(100, 230, 800, 330, 'UNDER 24 · 722.58 × 12 =', '8,670.96', 'AT · €', { dh: 130, hs: 34, inds: 28 })}
   ${disp(1020, 230, 800, 330, '24 AND OVER · 1,308.39 × 12 =', '15,700.68', 'AT · €', { dh: 130, hs: 34, inds: 28 })}
   
   <div class="card" style="left:560px;top:680px;transform:rotate(-1deg)">${OEAD()}<div class="cred">oead.at · 2 Nov 2026</div></div>`,
  b4: () => `
   <div class="calc" style="left:60px;top:60px;width:1800px;height:500px"></div>${disp(100, 100, 1720, 420, 'FRANCE · STUDENT WORK LIMIT · HOURS A YEAR', '964', 'CORRECTED', { dh: 230, hs: 42, inds: 34 })}
   <div class="pop" style="left:100px;top:590px;font-size:64px;background:var(--eq)">CORRECTION</div>
   <div class="say" style="left:110px;top:690px;font-size:64px;width:1700px;font-weight:700">Students from outside the EU can work up to <b style="font-weight:900">964 hours a year</b> in France: 60 % of the legal working year.</div>
   <div class="card" style="left:820px;top:900px;transform:rotate(1deg)">${FRS()}<div class="cred">service-public.fr · 2 Nov 2026</div></div>`,
  p1: () => `
   <div class="say" style="left:80px;top:170px;font-size:104px;width:920px">What is <i>proof of funds?</i></div>
   <div class="mono" style="position:absolute;left:84px;top:410px;font-size:34px;letter-spacing:.06em">FOR A STUDENT VISA · ESTONIA</div>
   ${calc(110, 560, 860, 1180, '880 × 12 =', '10,560.', 'EE · €', '=', { hs: 40 })}`,
  p2: () => `
   <div class="say" style="left:80px;top:170px;font-size:96px;width:920px">What my master’s <i>costs</i> now</div>
   ${disp(60, 460, 960, 360, 'MY FEE A YEAR', '6,000.', 'EE · €', { dh: 160, hs: 36, inds: 28 })}
   ${disp(60, 860, 960, 360, 'NEW NON-EU STUDENTS', '7,000.', 'EE · €', { dh: 160, hs: 36, inds: 28 })}
   <div class="pop" style="left:690px;top:1240px;font-size:84px;background:var(--eq)">+1,000</div>
   <div class="say" style="left:80px;top:1420px;font-size:58px;width:920px;font-weight:700">“I was checking while making this video and I noticed that it has also increased to 7k.”</div>`,
};
// ---- motion test: raw 279.0 - 289.2, her left half, calculator right half ----
const typed = (t, s, t0, dt) => s.slice(0, clamp(Math.floor((t - t0) / dt) + 1, 0, s.length) * (t >= t0 ? 1 : 0));
function seekT(t) {
  if (S.dataset.sc !== 'test') { S.dataset.sc = 'test'; S.innerHTML = `<div style="position:absolute;left:0;top:0;width:960px;height:1080px;overflow:hidden"><img data-feed="her" src="../_src/raw_330.jpg" style="position:absolute;left:-380px;top:0;width:1920px;height:1080px;max-width:none"></div><div id="R" style="position:absolute;left:960px;top:0;width:960px;height:1080px;background:var(--desk);overflow:hidden"></div>`; }
  // value on the display, her words
  let hist = '', val = '3,950.', down = '';
  if (t >= 280.49) { hist = '3,950 +'; }
  if (t >= 280.49 && t < 280.75) down = '+';
  if (t >= 280.97) { val = typed(t, '10,530', 280.97, 0.11) + '.'; const i = Math.floor((t - 280.97) / 0.11); if (i < 6 && (t - 280.97) % 0.11 < 0.07) down = '10,530'[i]; }
  if (t >= 285.93) { hist = '3,950 + 10,530 ='; down = t < 286.2 ? '=' : ''; val = t >= 286.1 ? '14,480.' : val; }
  const slide = P(t, 279.0, 0.6, E.outQuint);
  $('#R').innerHTML = calc(100, 90, 760, 930, hist || 'MASTER’S FEE', val, 'FR · €', down, { hs: 34 }) +
    (t >= 282.6 ? `<div class="pop" style="left:100px;top:6px;font-size:46px;background:var(--eq);opacity:${P(t, 282.62, .3)};transform:translateY(${(1 - P(t, 282.62, .35, E.outQuint)) * -20}px)">if your fee is not waived</div>` : '');
  const c = $('#R .calc'); c.style.transform = `translateY(${(1 - slide) * 300}px) scale(${1 + 0.02 * P(t, 279.6, 9, E.inOutQuart)})`; c.style.filter = slide < .9 ? `blur(${(1 - slide) * 8}px)` : 'none';
  if (t >= 286.1) { const b = $('#R .big'); const k = P(t, 286.1, 0.3, E.outQuint); b.style.transform = `scale(${lerp(1.12, 1, k)})`; b.style.transformOrigin = 'right bottom'; }
}
window.seek = async t => { seekT(t); await imagesReady(); };
window.show = async n => { if (n[0] === "t") { delete S.dataset.sc; seekT(+n.slice(1)); await imagesReady(); return; } S.dataset.sc = n; S.innerHTML = scenes[n](); await imagesReady(); };
imagesReady().then(() => window.READY = true);
</script></body></html>
