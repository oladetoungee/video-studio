<!doctype html><html><head><meta charset="utf-8">
<link rel="stylesheet" href="../_shared/fonts.css">
<style>
#stage{background:#E4E6E3;font-family:Sofia,sans-serif;color:#121212}
.foot{position:absolute;overflow:hidden}.foot img{position:absolute;max-width:none}
.t3{position:absolute;background:#fff;color:#121212;font-weight:900;text-align:center;border-radius:8px;line-height:1.08}
.capA{position:absolute;text-align:center;font-family:SofiaX;font-weight:900;text-transform:uppercase;color:#fff;text-shadow:0 3px 0 rgba(0,0,0,.45);line-height:1}
.capA b{background:#FFD60A;color:#121212;padding:0 .14em;text-shadow:none}
.mono{font-family:Martian;font-stretch:87.5%;font-weight:500}
</style></head><body><div id="stage"></div>
<script src="../_shared/lib.js"></script><script src="../_shared/kit.js"></script>
<script>
const W = 1080, H = 1920; const S = $('#stage'); st(S, { width: W + 'px', height: H + 'px' });
const win = (src, x, y, w, h, cx, sc) => `<div class="foot" style="left:${x}px;top:${y}px;width:${w}px;height:${h}px"><img src="../_src/${src}" style="left:${w / 2 - cx * sc}px;top:0;width:${1920 * sc}px;height:${1080 * sc}px"></div>`;
const scenes = {
  s1: () => `<div style="position:absolute;inset:0;background:#121212"></div>
   ${win('raw_113.jpg', 0, 230, 1080, 1690, 930, 1690 / 1080)}
   <div class="t3" style="left:90px;top:120px;width:900px;padding:28px 36px;font-size:58px">Studying in Germany is free.<br>The proof of funds isn’t.</div>
   <div class="capA" style="left:40px;width:1000px;top:1420px;font-size:92px">studying in Germany is very <b>affordable</b></div>`,
  s2: () => `<div style="position:absolute;left:0;top:300px;width:1080px;height:200px;background:#2A2B2E"></div>
   <div style="position:absolute;left:70px;top:330px;width:940px;height:560px;background:#FFD60A">
     <div style="position:absolute;left:0;right:0;top:0;height:100px;background:#121212;color:#fff;font-weight:800;font-size:58px;display:flex;align-items:center;justify-content:space-between;padding:0 36px">GERMANY${flag('DE', 88)}</div>
     <div style="position:absolute;left:36px;top:128px;font-weight:800;font-size:50px">TUITION</div>
     <div style="position:absolute;left:30px;top:190px;font-family:SofiaX;font-weight:900;font-size:330px;line-height:.8">€0<span style="color:#E4002B">*</span></div>
     <div class="mono" style="position:absolute;right:36px;top:140px;font-size:36px;text-align:right;line-height:1.25">at most<br>public<br>universities</div><div style="position:absolute;right:36px;bottom:40px">${barcode('germany-de', 240, 84)}</div></div>
   <div style="position:absolute;left:100px;top:850px;width:880px;padding:22px 34px;background:#E4002B;color:#fff;font-weight:800;font-size:50px;line-height:1.08;white-space:nowrap;transform:rotate(-2deg)">*Proof of funds: €11,904 a year</div>
   ${win('raw_150.jpg', 0, 1000, 1080, 920, 940, 1.15).replace('top:0', 'top:-260px')}
   <div class="t3" style="left:90px;top:120px;width:900px;padding:22px 30px;font-size:50px">Studying in Germany is free.<br>The proof of funds isn’t.</div>
   <div class="capA" style="left:40px;width:1000px;top:1730px;font-size:80px">you have to show <b>proof of funds</b></div>`,
};
window.show = async n => { S.innerHTML = scenes[n](); await imagesReady(); };
imagesReady().then(() => window.READY = true);
</script></body></html>
