<!doctype html><html><head><meta charset="utf-8"><link rel="stylesheet" href="../../lib/eu.css"><style>
/* font board only (2026-11-12): Six Caps (design-01) + Inter Tight (pair-04, Design 377) + DM Mono (design-29);
   colours of Design 377: ground #E9E0CC, ink/accent #CB482E (+ #161412 on the receipt). Faceless: a till receipt of year one. */
.t{background:var(--ground,#E9E0CC)}
.w{left:var(--wx,48px);top:var(--wy,30px);font:400 var(--ws,268px)/.92 "SC",sans-serif;color:#CB482E;letter-spacing:.005em;text-transform:uppercase}
.sub{left:var(--sx,56px);top:var(--sy,566px);font:700 var(--ss,50px)/1.08 "IT",sans-serif;color:#CB482E;letter-spacing:-.02em}
.rc{position:absolute;left:var(--rx,676px);top:var(--ry,118px);width:530px;padding:34px 38px 40px;background:#F3ECDC;rotate:3deg;box-shadow:0 22px 40px rgba(60,30,10,.28);font:600 42px/1 "IT",sans-serif;color:#CB482E;letter-spacing:-.01em;
  -webkit-mask:linear-gradient(#000,#000) top/100% calc(100% - 14px) no-repeat,radial-gradient(10px at 50% 100%,transparent 98%,#000) bottom/24px 15px repeat-x}
.rc .hd{text-align:center;font-size:24px;letter-spacing:.14em;padding-bottom:20px;border-bottom:3px dashed #CB482E;margin-bottom:22px}
.rc .r{display:flex;justify-content:space-between;padding:12px 0;letter-spacing:.02em}
.rc .r.top{font-weight:800}
.rc .r.top span:first-child::after{content:"";}
.rc .ft{border-top:3px dashed #CB482E;margin-top:16px;padding-top:18px;font-size:22px;letter-spacing:.08em;text-align:center}
.ring{position:absolute;left:var(--gx,0px);top:var(--gy,86px);width:530px;height:100px}
</style></head><body><div class="t">
<div class="a w z2" data-k="w"></div><div class="a sub z2" data-k="sub"></div>
<div class="rc z3" data-move="receipt"><div class="hd" data-k="hd"></div>
<div class="r top"><span data-k="c0"></span><span data-k="v0"></span></div>
<div class="r"><span data-k="c1"></span><span data-k="v1"></span></div>
<div class="r"><span data-k="c2"></span><span data-k="v2"></span></div>
<div class="r"><span data-k="c3"></span><span data-k="v3"></span></div>
<div class="ft" data-k="ft"></div>

</div><script src="../../lib/bind.js"></script></body></html>
