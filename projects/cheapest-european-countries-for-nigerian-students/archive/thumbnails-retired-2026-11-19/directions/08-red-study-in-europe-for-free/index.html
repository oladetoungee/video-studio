<!doctype html><html><head><meta charset="utf-8"><link rel="stylesheet" href="../../lib/eu.css"><style>
/* font board only (2026-11-12): Bodoni Moda (design-16) + Bodoni italic / Archivo (pair-15, Design 1), colours of Design 1 (combo-15):
   ground #990915, ink #FBF3EC, accent #FCBFBA. Faceless: a polaroid of a real European university + a price tag. */
.t{background:var(--ground,#990915)}
.w{left:var(--wx,56px);top:var(--wy,92px);font:700 var(--ws,116px)/.98 "BM",serif;color:#FBF3EC;letter-spacing:-.025em}
.w em{font-style:italic;font-weight:600;color:#FCBFBA}
.sub{left:var(--sx,62px);top:var(--sy,500px);font:600 var(--ss,52px)/1.15 "AR",sans-serif;font-variation-settings:"wdth" 90;color:#FBF3EC;opacity:.92}
.pol{position:absolute;left:var(--px,722px);top:var(--py,52px);width:500px;padding:20px 20px 60px;background:#FBF3EC;rotate:4deg;box-shadow:0 22px 44px rgba(0,0,0,.4)}
.pol .ph2{width:100%;height:420px;object-fit:cover;object-position:var(--ox,50%) var(--oy,50%);display:block}
.pol .cap{position:absolute;left:22px;bottom:22px;font:500 26px/1 "Mono",monospace;color:#3a1012;letter-spacing:.06em;text-transform:uppercase}
.tag{position:absolute;left:var(--tx,736px);top:var(--ty,452px);background:#990915;color:#FBF3EC;outline:3px solid #FBF3EC;outline-offset:-10px;padding:16px 28px 18px 46px;rotate:-6deg;box-shadow:0 14px 26px rgba(0,0,0,.35);clip-path:polygon(26px 0,100% 0,100% 100%,26px 100%,0 50%)}
.tag b{display:block;font:700 var(--ts,80px)/1 "BM",serif;letter-spacing:-.01em}
.tag small{display:block;font:600 28px/1.1 "AR",sans-serif;color:#FCBFBA;margin-top:6px}
.tag i{position:absolute;left:18px;top:50%;width:14px;height:14px;margin-top:-7px;border-radius:50%;background:#FBF3EC}
</style></head><body><div class="t">
<div class="a w z3" data-k="w"></div><div class="a sub z3" data-k="sub"></div>
<div class="pol z2" data-move="photo"><img class="ph2" data-img="photo" alt=""><div class="cap" data-k="cap"></div></div>
<div class="tag z4" data-move="tag"><i></i><b data-k="price"></b><small data-k="note"></small></div>
</div><script src="../../lib/bind.js"></script></body></html>
