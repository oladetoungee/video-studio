<!doctype html><html><head><meta charset="utf-8"><link rel="stylesheet" href="../../lib/eu.css"><style>
/* 2026-11-19 her note "the font used to write the names of the countries is not really clear": country names Permanent Marker -> Anton caps, white on the thumbs-01 red #D9262B / dark #1A1A1A (font board thumbs-01, Thumbnails 10). Everything else unchanged. */
/* fix 2026-11-12 (her note: "the text completely blends with the background"): words on a WHITE card (board Thumbnails 54 / yt-01),
   the key word in a red box (Thumbnails 68 / yt-15), the chart as coloured sticky notes + hand-drawn arrows (Thumbnails 15 / pin-01-15). */
.bg{width:var(--bw,1512px);left:var(--bx,0px);top:var(--by,-205px)}
.veil{inset:0;background:var(--dim,rgba(12,12,16,.5))}
.card{position:absolute;left:var(--cx,34px);top:var(--cy,30px);padding:18px 30px 22px 26px;background:#E8E6E2;border-radius:16px;box-shadow:0 18px 40px rgba(0,0,0,.45);rotate:-1deg}
.w{font:800 var(--ws,100px)/1.02 "IT",sans-serif;color:#111111;letter-spacing:-.035em;text-transform:uppercase;white-space:nowrap}
.w .hl{background:#DA443D;color:#FFFFFF;padding:0 .12em;border-radius:.08em;display:inline-block;line-height:1.02}
.rows{position:absolute;left:var(--sx,40px);top:var(--sy,296px)}
.row{display:flex;align-items:center;height:96px}
.sticky{width:240px;height:80px;display:flex;align-items:center;justify-content:center;font:400 52px/1 "AN",sans-serif;color:#FFFFFF;text-transform:uppercase;letter-spacing:.01em;box-shadow:0 8px 16px rgba(0,0,0,.35)}
.row:nth-child(1) .sticky{background:#D9262B;rotate:-2deg}.row:nth-child(2) .sticky{background:#1A1A1A;rotate:1.5deg}
.row:nth-child(3) .sticky{background:#D9262B;rotate:-1deg}.row:nth-child(4) .sticky{background:#1A1A1A;rotate:2deg}
.arr{width:76px;height:40px;margin:0 4px 0 8px}
.mk{width:76px;height:76px;background:#E8E6E2;display:flex;align-items:center;justify-content:center;font:800 64px/1 "IT",sans-serif;box-shadow:0 8px 16px rgba(0,0,0,.35);rotate:2deg}
.mk.y{color:#111111}.mk.n{color:#DA443D}
</style></head><body><div class="t">
