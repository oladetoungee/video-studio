<!doctype html>
<html><head><meta charset="utf-8">
<style>
@font-face { font-family: Plex; src: url(../_fonts/IBMPlexSans.ttf); font-weight: 100 700; font-stretch: 85% 100%; }
@font-face { font-family: PlexMono; src: url(../_fonts/IBMPlexMono-Regular.ttf); font-weight: 400; }
@font-face { font-family: PlexMono; src: url(../_fonts/IBMPlexMono-SemiBold.ttf); font-weight: 600; }
html, body { margin: 0; background: #0E1013; }
#stage { position: relative; overflow: hidden; background: #0E1013; color: #ECEAE4; font-family: Plex; }
img { position: absolute; display: block; }
</style></head><body>
<div id="stage"></div>
<script src="../_tools/kit.js"></script>
<script>
// Talking-head (full edit) style frames in the recommended look (A · Query Plan), over her REAL footage (never flipped).
// Footage frames: kit/database indexes.mov at 2:05, 2:56, 3:40, 6:25 (scaled to 1920 wide); person mattes by macOS Vision.
const C = { bg: '#0E1013', ink: '#ECEAE4', dim: '#7A808A', line: '#2C313A', panel: '#15181D', acc: '#FFC53D' };
const FT = '../_footage/', AQ = '../A-queryplan/frames/';
function img(root, src, css) { return el('img', css, '', root).tap ? 0 : Object.assign(root.lastChild, { src }); }
function mono(root, x, y, txt, size = 30, color = C.dim, extra = {}) { return el('div', Object.assign({ left: x + 'px', top: y + 'px', font: `400 ${size}px PlexMono`, color, whiteSpace: 'pre', letterSpacing: '0.03em' }, extra), txt, root); }

// L5 half and half (2:05 "what mechanism does a database index use to find things so fast?"): film on the left, her on the right
scene('L5', 0, 1, (root) => {
  const left = el('div', { left: 0, top: 0, width: '960px', height: '1080px', overflow: 'hidden', background: C.bg }, '', root);
  img(left, AQ + 'A5_btree_9x16.png', { left: '21px', top: '-230px', width: '918px', height: '1632px' });
  const right = el('div', { left: '960px', top: 0, width: '960px', height: '1080px', overflow: 'hidden' }, '', root);
  img(right, FT + 'f125.jpg', { left: '-480px', top: 0, width: '1920px', height: '1080px' });
}, () => {});

// L2 behind her (2:56 "Most databases store their indexes in a structure called a B-tree")
scene('L2', 1, 2, (root) => {
  img(root, FT + 'f176.jpg', { left: 0, top: 0, width: '1920px', height: '1080px' });
  el('div', { left: '100px', top: '40px', font: '700 290px Plex', fontStretch: '85%', letterSpacing: '-0.04em', color: C.acc, lineHeight: 1 }, 'B-TREE', root);
  img(root, FT + 'cut176.png', { left: 0, top: 0, width: '1920px', height: '1080px' });
  el('div', { left: '50%', top: '880px', transform: 'translateX(-50%)', font: '500 46px Plex', color: '#fff', background: 'rgba(14,16,19,0.72)', padding: '10px 22px', whiteSpace: 'nowrap' }, 'Most databases store their indexes in a structure called a B-tree.', root);
}, () => {});

// L7 pop-around (6:25 the other index types she names: hash, bitmap, spatial, full-text)
scene('L7', 2, 3, (root) => {
  img(root, FT + 'f385.jpg', { left: 0, top: 0, width: '1920px', height: '1080px' });
  const chip = (x, y, name, use, draw) => {
    const c = el('div', { left: x + 'px', top: y + 'px', width: '330px', height: '200px', background: C.bg, outline: `2px solid ${C.line}` }, '', root);
    const s = svg(c, { width: '330px', height: '200px' }); s.setAttribute('viewBox', '0 0 330 200'); s.setAttribute('width', 330); s.setAttribute('height', 200);
    draw(s);
    el('div', { left: '22px', top: '120px', font: '600 34px PlexMono', color: C.ink }, name, c);
    el('div', { left: '22px', top: '160px', font: '400 26px PlexMono', color: C.dim }, use, c);
  };
  const Y = (s, a) => sv(s, 'rect', a);
  chip(150, 120, 'hash', 'exact matches only', s => { sv(s, 'text', { x: 22, y: 64, fill: C.ink, 'font-family': 'PlexMono', 'font-size': 26 }, 'token'); sv(s, 'path', { d: 'M118 56 L178 56', stroke: C.acc, 'stroke-width': 4 }); [0, 1, 2, 3].forEach(i => Y(s, { x: 196 + i * 30, y: 38, width: 24, height: 36, fill: i === 2 ? C.acc : 'none', stroke: C.ink, 'stroke-width': 2 })); });
  chip(1440, 120, 'bitmap', 'few values: status', s => { for (let r = 0; r < 3; r++) for (let k = 0; k < 8; k++) Y(s, { x: 22 + k * 34, y: 22 + r * 28, width: 24, height: 20, fill: (k * 3 + r * 5) % 3 === 0 ? C.acc : 'none', stroke: C.ink, 'stroke-width': 1.5 }); });
  chip(150, 640, 'spatial', 'places near you', s => { for (let k = 0; k < 5; k++) sv(s, 'line', { x1: 22 + k * 60, y1: 18, x2: 22 + k * 60, y2: 100, stroke: C.line, 'stroke-width': 2 }); for (let k = 0; k < 3; k++) sv(s, 'line', { x1: 22, y1: 18 + k * 41, x2: 262, y2: 18 + k * 41, stroke: C.line, 'stroke-width': 2 }); sv(s, 'circle', { cx: 150, cy: 60, r: 34, fill: 'none', stroke: C.acc, 'stroke-width': 3 }); [[140, 52], [168, 70], [60, 30], [250, 90]].forEach(([x, y], i) => sv(s, 'circle', { cx: x, cy: y, r: 7, fill: i < 2 ? C.acc : C.ink })); });
  chip(1440, 640, 'full-text', 'search inside text', s => { ['wireless', 'headphones'].forEach((w, i) => { sv(s, 'text', { x: 22, y: 46 + i * 40, fill: C.ink, 'font-family': 'PlexMono', 'font-size': 24 }, w); sv(s, 'text', { x: 196, y: 46 + i * 40, fill: C.acc, 'font-family': 'PlexMono', 'font-size': 24 }, i ? '→ 4, 9' : '→ 4, 12'); }); });
  mono(root, 150, 1000, 'ILLUSTRATION · tiny sketches of how each index type groups data', 22, '#C9CCD1', { background: 'rgba(14,16,19,0.7)', padding: '4px 10px', left: '140px' });
}, () => {});

// L11 corner cam (3:40 "In PostgreSQL you will see Seq Scan…"): the film full frame, her in a circle
scene('L11', 3, 4, (root) => {
  img(root, AQ + 'A3_explain_16x9.png', { left: 0, top: 0, width: '1920px', height: '1080px' });
  const c = el('div', { left: '1636px', top: '796px', width: '236px', height: '236px', borderRadius: '50%', overflow: 'hidden', outline: `4px solid ${C.acc}`, outlineOffset: '0px' }, '', root);
  img(c, FT + 'f220.jpg', { left: '-382px', top: '-80px', width: '960px', height: '540px' });
}, () => {});
</script></body></html>
