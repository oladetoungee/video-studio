<!doctype html><html><head><meta charset="utf-8">
<style>
@font-face{font-family:IT;src:url(../_fonts/InterTight.ttf)}
html,body{margin:0;background:#0C0D10;overflow:hidden}
#stage{position:relative;overflow:hidden;background:#0C0D10;font-family:IT;color:#F4F1EA;font-feature-settings:"tnum" 1}
.card{background:#1D1F25;border-radius:34px;box-sizing:border-box}
.hd{display:flex;justify-content:space-between;font-weight:600;letter-spacing:-.005em}
.hd span:last-child{color:#8B8D94;font-weight:500}
.w{display:inline-block;white-space:pre}
.red{color:#FF4433}
.lab{font-weight:600;letter-spacing:.12em;color:#6E7078;font-size:34px}
</style></head><body><div id="stage"></div>
<script src="../_tools/kit.js"></script>
<script>
// A · LOCK SCREEN. Timeline: 0-10.6 motion test (her 0:00-0:10.6), then still-only scenes.
const INK = '#0C0D10', TXT = '#F4F1EA', RED = '#FF4433', CARD = '#1D1F25', MUTED = '#8B8D94';
const FS = V(60, 58);           // notification body size
// word times (s) from transcript.words.json, 0:00-0:10.6
const L1 = [[0.0,'Your'],[0.49,'phone'],[1.47,'was'],[1.52,'intentionally',2],[3.08,'and'],[3.20,'strategically',2],[4.00,'designed'],[4.84,'to'],[4.92,'distract',1],[5.40,'you.']];
const L2 = [[6.45,'You'],[6.65,'pick'],[7.04,'it'],[7.04,'up'],[7.29,'to'],[7.30,'do'],[7.43,'one'],[7.63,'thing.']];
const L3 = [[9.12,"You're"],[9.30,'doing'],[10.10,'a'],[10.16,'million',1],[10.77,'and',1],[10.82,'one',1],[11.07,'other'],[11.26,'things.']];
function words(parent, list, css) {
  const box = el('div', Object.assign({ position: 'relative' }, css), '', parent);
  box.style.position = 'relative';
  const ws = list.map(([t, w, hot]) => { const s = document.createElement('span'); s.className = 'w'; s.textContent = w + ' '; box.appendChild(s);
    let u = null; if (hot === 2) { s.style.position = 'relative'; u = el('div', { left: 0, bottom: '-2px', width: 'calc(100% - 0.28em)', height: '5px', borderRadius: '3px', background: RED, transformOrigin: 'left' }, '', s); }
    return [t, s, hot, u]; });
  return { box, ws };
}
function showWords(W, t) { for (const [t0, s, hot, u] of W.ws) { if (hot === 1) s.style.color = t >= t0 ? RED : TXT; if (u) u.style.transform = `scaleX(${eOut(prog(t, t0, t0 + 0.35))})`; } }
function card(parent, x, y, w, head, list) {
  const c = el('div', { left: x + 'px', top: y + 'px', width: w + 'px', padding: V('30px 40px 36px', '30px 40px 38px') }, '', parent); c.className = 'card';
  el('div', { position: 'relative', fontSize: '34px', marginBottom: '14px' }, `<span>${head[0]}</span><span>${head[1]}</span>`, c).className = 'hd';
  const W = words(c, list, { fontSize: FS + 'px', fontWeight: 500, lineHeight: 1.12, letterSpacing: '-.012em' });
  return { c, W };
}
function clock(parent, x, y, size) {
  const c = el('div', { left: x + 'px', top: y + 'px', fontSize: size + 'px', fontWeight: 200, letterSpacing: '-.045em', lineHeight: 1, height: size * 1.0 + 'px', overflow: 'hidden', whiteSpace: 'nowrap' }, '', parent);
  const a = el('span', { position: 'relative' }, '1:', c); const rol = el('span', { position: 'relative', display: 'inline-block', width: '0.6em', height: '1em', overflow: 'hidden', verticalAlign: 'top' }, '', c);
  const d2 = el('div', { left: 0, top: 0 }, '2', rol), d4 = el('div', { left: 0, top: '1em' }, '4', rol);
  el('span', { position: 'relative' }, '0', c);
  return { c, set(p) { const e = eOut(p); d2.style.transform = `translateY(${-e * size}px)`; d4.style.transform = `translateY(${-e * size}px)`; d2.style.filter = d4.style.filter = `blur(${Math.sin(Math.PI * p) * 8}px)`; } };
}
function spinner(parent, cx, cy, r) {
  const s = el('div', { left: cx - r + 'px', top: cy - r + 'px', width: 2 * r + 'px', height: 2 * r + 'px' }, '', parent);
  const ticks = []; for (let i = 0; i < 12; i++) ticks.push(el('div', { left: r - 4 + 'px', top: 0, width: '8px', height: r * 0.55 + 'px', borderRadius: '4px', background: TXT, transformOrigin: `4px ${r}px`, transform: `rotate(${i * 30}deg)` }, '', s));
  return { s, set(fill, spin) { ticks.forEach((k, i) => { const on = i < Math.round(fill * 12); k.style.opacity = on ? (0.35 + 0.65 * ((i - spin * 12 + 120) % 12) / 12) : 0; }); } };
}
// ---------------- scene 1: the motion test ----------------
scene('test', 0, 11.6, (R, S) => {
  S.gap = el('div', { left: 0, top: 0, width: W + 'px', height: H + 'px', background: '#17191E' }, '', R);
  S.sp = spinner(R, CX, V(150, 170), V(44, 52));
  S.pane = el('div', { left: 0, top: 0, width: W + 'px', height: H + 'px', background: INK }, '', R);
  S.ck = clock(S.pane, V(110, 0), V(200, 300), V(330, 360));
  if (PORTRAIT) { S.ck.c.style.width = W + 'px'; S.ck.c.style.textAlign = 'center'; }
  el('div', { left: V(128, 0) + 'px', top: V(550, 680) + 'px', width: V(600, W) + 'px', textAlign: V('left', 'center'), fontSize: V(36, 40) + 'px', fontWeight: 500, color: MUTED }, 'Tuesday', S.pane);
  const cx = V(880, 60), cw = V(920, 960), cy = V(160, 900);
  S.cards = [card(S.pane, cx, cy, cw, ['@WithGbemi', 'now'], L1), card(S.pane, cx, cy, cw, ['@WithGbemi', 'now'], L2), card(S.pane, cx, cy, cw, ['@WithGbemi', 'now'], L3)];
  S.h = S.cards.map(k => k.c.offsetHeight);
  // stacked-notification edges that peek out under the newest card on "a million and one" (lock-screen anatomy, not empty cards)
  S.mini = []; for (let i = 0; i < 3; i++) { const m = el('div', { left: cx + (i + 1) * 22 + 'px', top: '0px', width: cw - (i + 1) * 44 + 'px', height: '60px', borderRadius: '0 0 26px 26px', background: ['#26292F', '#202227', '#1A1C21'][i], zIndex: -1 - i }, '', S.pane); S.mini.push(m); }
  S.cards.forEach((k, i) => k.c.style.zIndex = 5 + i);
  el('div', { left: V(120, 60) + 'px', top: V(990, 1810) + 'px' }, 'ILLUSTRATION', S.pane).className = 'lab';
  el('div', { left: CX - 110 + 'px', top: H - 26 + 'px', width: '220px', height: '9px', borderRadius: '5px', background: TXT, opacity: 0.45 }, '', S.pane);
}, (t, S) => {
  // pull-to-refresh: drag 22 % of the height in 0.4 s (outExpo), spinner holds, release at 6.35 (spring 2.0 Hz, zeta 0.67, ~6 % overshoot)
  const D = V(240, 380), drag = D * eOut(prog(t, 5.5, 5.9));
  const rel = t < 6.35 ? 0 : spring(t - 6.35, 2.0, 0.67);
  const y = drag * (1 - rel);
  S.pane.style.transform = `translateY(${y}px)`;
  S.sp.s.style.top = V(150, 170) - V(44, 52) + (y - D) / 2 + 'px';
  S.sp.s.style.opacity = clamp(y / 60); S.sp.set(clamp(drag / D), t > 5.9 ? (t - 5.9) * 1.6 : 0);
  // slow push on the clock while the first banner holds (100 -> 104 %)
  S.ck.c.style.transformOrigin = V('0 50%', '50% 50%'); S.ck.c.style.transform = `scale(${1 + 0.04 * eIO(prog(t, 0.5, 5.5))})`;
  // clock 1:20 -> 1:40 on "20 minutes" (8.14)
  S.ck.set(prog(t, 8.14, 8.62));
  // banners drop in whole (0.35 s from y-40, outExpo); older ones step down by the new banner's height + gap
  const arr = [0.42, 6.38, 9.05], gap = 22, cy = V(160, 900);
  S.cards.forEach((k, i) => {
    const p = eOut(prog(t, arr[i], arr[i] + 0.35)), on = t >= arr[i];
    let off = 0; for (let j = i + 1; j < 3; j++) off += (S.h[j] + gap) * eOut(prog(t, arr[j], arr[j] + 0.35));
    // 9:16 keeps only the newest two banners: the oldest leaves when the third arrives
    const gone = PORTRAIT && i === 0 ? eOut(prog(t, arr[2], arr[2] + 0.3)) : 0;
    k.c.style.opacity = on ? clamp((t - arr[i]) / 0.2) * (1 - gone) : 0;
    k.c.style.transform = `translateY(${(1 - p) * -40 + off}px)`;
    k.c.style.background = i < 2 && t > arr[i + 1] ? '#191B20' : CARD;
    showWords(k.W, t);
  });
  // stacked edges peek out under the newest banner on "million" (10.16), "and" (10.77), "one" (10.82)
  const ts = [10.16, 10.77, 10.82];
  S.mini.forEach((m, i) => { const p = eOut(prog(t, ts[i], ts[i] + 0.3)); m.style.opacity = 0; m.style.transform = `translateY(${cy + S.h[2] - 40 + p * (i + 1) * 18}px)`; });
  // in 9:16 the newest card sits on top, so put the edges under the newest card only when it is the top one
});
// ---------------- scene 2: home grid, blue -> red (still only) ----------------
const APPS = ['Feed', 'Clips', 'Chat', 'Mail', 'Shop', 'News', 'Photos', 'Video', 'Maps', 'Music', 'Notes', 'Bank'];
const BADGE = { 0: '12', 1: '3', 2: '99+', 3: '7', 5: '1', 7: '4', 10: '2' };
function grid(R, x, y, cols, size, gapx, gapy, opt = {}) {
  const tiles = [];
  APPS.forEach((n, i) => {
    const tx = x + (i % cols) * (size + gapx), ty = y + Math.floor(i / cols) * (size + gapy);
    const g = el('div', { left: tx + 'px', top: ty + 'px', width: size + 'px', height: size + 'px', borderRadius: size * 0.23 + 'px', background: opt.tile ? opt.tile(i) : ['#2C2F36', '#363A42', '#2A2D33', '#40444D'][i % 4] }, '', R);
    el('div', { left: tx - 20 + 'px', top: ty + size + 12 + 'px', width: size + 40 + 'px', textAlign: 'center', fontSize: (opt.lab || 30) + 'px', fontWeight: 500, color: opt.labc || '#C9C7C0' }, n, R);
    let b = null;
    if (BADGE[i]) b = el('div', { left: tx + size - 34 + 'px', top: ty - 22 + 'px', minWidth: '56px', height: '56px', padding: '0 14px', boxSizing: 'border-box', borderRadius: '28px', background: opt.badge || RED, color: '#fff', fontSize: '32px', fontWeight: 700, lineHeight: '56px', textAlign: 'center' }, BADGE[i], R);
    tiles.push({ g, b });
  });
  return tiles;
}
scene('home', 20, 30, (R, S) => {
  el('div', { left: 0, top: 0, width: W + 'px', height: H + 'px', background: INK }, '', R);
  el('div', { left: V(120, 70) + 'px', top: V(170, 150) + 'px', width: V(760, 940) + 'px', fontSize: V(78, 76) + 'px', fontWeight: 600, lineHeight: 1.04, letterSpacing: '-.03em' }, 'People barely noticed the blue one, so it was changed to <span class="red">red</span>.', R);
  el('div', { left: V(124, 74) + 'px', top: V(560, 560) + 'px', width: V(760, 900) + 'px', fontSize: '34px', fontWeight: 500, lineHeight: 1.3, color: MUTED }, 'Reportedly: Tristan Harris, quoting a friend at Facebook (The Guardian, 2017)', R);
  // hero badge: blue badge sliding off, red one landing
  const hx = V(250, 300), hy = V(720, 820);
  el('div', { left: hx + 'px', top: hy + 'px', width: '210px', height: '210px', borderRadius: '48px', background: '#363A42' }, '', R);
  S.blue = el('div', { left: hx + 150 + 'px', top: hy - 40 + 'px', width: '96px', height: '96px', borderRadius: '48px', background: '#3B6FE0', color: '#fff', fontSize: '52px', fontWeight: 700, lineHeight: '96px', textAlign: 'center' }, '1', R);
  S.red = el('div', { left: hx + 150 + 'px', top: hy - 40 + 'px', width: '96px', height: '96px', borderRadius: '48px', background: RED, color: '#fff', fontSize: '52px', fontWeight: 700, lineHeight: '96px', textAlign: 'center' }, '1', R);
  if (!PORTRAIT) grid(R, 1010, 150, 4, 150, 64, 110);
  el('div', { left: V(1010, 70) + 'px', top: V(990, 1810) + 'px' }, 'ILLUSTRATION', R).className = 'lab';
}, (lt, S, t) => {
  const p = eOut(prog(t, 20.2, 20.7));
  S.blue.style.transform = `translate(${p * 150}px, ${-p * 20}px)`; S.blue.style.opacity = 1 - p * 0.75;
  const s = spring(t - 20.45, 2.4, 0.55); S.red.style.transform = `scale(${s})`;
});
// ---------------- scene 3: the EU press release lands as a notification (still only) ----------------
scene('eu', 40, 50, (R, S) => {
  el('div', { left: 0, top: 0, width: W + 'px', height: H + 'px', background: INK }, '', R);
  el('div', { left: V(120, 70) + 'px', top: V(170, 140) + 'px', width: V(700, 940) + 'px', fontSize: V(72, 72) + 'px', fontWeight: 600, lineHeight: 1.05, letterSpacing: '-.03em' }, 'One of the first times a regulator has formally said these features can be a <span class="red">legal problem</span>.', R);
  el('div', { left: V(124, 74) + 'px', top: V(640, 560) + 'px', width: V(640, 900) + 'px', fontSize: '34px', fontWeight: 500, color: MUTED, lineHeight: 1.3 }, 'A preliminary finding, not a final decision.', R);
  const cw = V(960, 960), cx = V(860, 60), cy = V(140, 820);
  const c = el('div', { left: cx + 'px', top: cy + 'px', width: cw + 'px', padding: '30px 34px 34px' }, '', R); c.className = 'card';
  el('div', { position: 'relative', fontSize: '34px', marginBottom: '20px' }, '<span>European Commission</span><span>10 Jul 2026</span>', c).className = 'hd';
  const iw = cw - 68, sc = iw / 1250;
  const im = el('div', { position: 'relative', width: iw + 'px', height: 495 * sc + 'px', borderRadius: '14px', overflow: 'hidden', background: '#fff' }, '', c);
  el('img', { left: 0, top: 0, width: iw + 'px' }, '', im).src = '../../../assets/sources/eu-meta-lead.png';
  S.hl = [[399.4, 381, 105.6], [514.8, 381, 70.4], [595, 381, 148.3]].map(([x, y, w]) => el('div', { left: (x - 3) * sc + 'px', top: (y - 1) * sc + 'px', width: (w + 6) * sc + 'px', height: 23 * sc + 'px', background: 'rgba(255,68,51,.32)', borderBottom: `${3 * sc}px solid ${RED}`, transformOrigin: 'left' }, '', im));
  el('div', { position: 'relative', marginTop: '18px', fontSize: '34px', fontWeight: 500, color: MUTED }, 'Screenshot · ec.europa.eu · 13 Oct 2026', c);
}, (lt, S, t) => { S.hl.forEach((h, i) => { h.style.transform = `scaleX(${eOut(prog(t, 40.2 + i * 0.25, 40.55 + i * 0.25))})`; }); });
// ---------------- scene 4: the boring phone (grayscale home) ----------------
scene('gray', 50, 60, (R, S) => {
  el('div', { left: 0, top: 0, width: W + 'px', height: H + 'px', background: '#D6D5D1' }, '', R);
  el('div', { left: V(120, 70) + 'px', top: V(170, 150) + 'px', width: V(720, 940) + 'px', fontSize: V(80, 80) + 'px', fontWeight: 600, lineHeight: 1.03, letterSpacing: '-.03em', color: '#1A1A1A' }, 'Take the colour away and your phone becomes a little less rewarding.', R);
  el('div', { left: V(124, 74) + 'px', top: V(640, 600) + 'px', width: V(640, 900) + 'px', fontSize: '34px', fontWeight: 500, color: '#55565A', lineHeight: 1.3 }, 'Grayscale is in your phone’s accessibility settings.', R);
  grid(R, V(1010, 120), V(150, 840), 4, V(150, 170), V(64, 70), V(110, 120), { tile: i => ['#B9B8B4', '#A9A8A4', '#C4C3BF', '#9E9D99'][i % 4], badge: '#7C7B78', labc: '#3A3A3A' });
  el('div', { left: V(1010, 70) + 'px', top: V(990, 1810) + 'px', color: '#76767A' }, 'ILLUSTRATION', R).className = 'lab';
}, () => {});
window.crisp = () => false;
</script></body></html>
