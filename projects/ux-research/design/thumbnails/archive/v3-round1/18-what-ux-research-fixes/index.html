<!doctype html><html><head><meta charset="utf-8"><link rel="stylesheet" href="../../lib/v3.css"><style>.t{background:#17140F}
.half{position:absolute;top:0;height:720px;width:640px}
.hl1{left:0;background:#D9D3C7}.hr1{left:640px;background:var(--accent)}
.h1{left:0;right:0;top:34px;text-align:center;font-size:84px;color:#fff;z-index:6}
.h1 span{background:#17140F;padding:6px 26px 10px;border-radius:6px}
.tg{position:absolute;top:180px;font:900 60px/1 'Grot';letter-spacing:-.03em;color:#17140F}
.pa{left:200px;top:250px;--pw:260px;--ph:440px;rotate:-5deg}.pb{left:820px;top:250px;--pw:260px;--ph:440px;rotate:5deg}
.pop{position:absolute;left:20px;right:20px;border-radius:12px;background:#fff;box-shadow:0 6px 16px rgba(0,0,0,.25);font:800 24px/1.1 'Archivo';padding:12px;color:#17140F}
.x{position:absolute;right:10px;top:8px;font:900 22px/1 'Archivo';color:#E8501E}
</style></head><body><div class="t">
<div class="half hl1 z1"></div><div class="half hr1 z1"></div>
<div class="hd grot h1" data-k="hd"></div>
<div class="tg z3" style="left:60px" data-k="before"></div><div class="tg z3" style="left:1090px" data-k="after"></div>
<div class="phone pa z3" data-move="before-phone"><div class="scr" style="background:#EEE">
 <div class="bar" style="left:14px;top:20px;width:200px;--bh:12px"></div><div class="bar" style="left:14px;top:40px;width:150px;--bh:12px"></div>
 <div class="bar" style="left:14px;top:300px;width:60px;height:30px;border-radius:6px;--bc:#bbb"></div><div class="bar" style="left:84px;top:300px;width:60px;height:30px;border-radius:6px;--bc:#bbb"></div><div class="bar" style="left:154px;top:300px;width:60px;height:30px;border-radius:6px;--bc:#bbb"></div>
 <div class="pop" style="top:70px;rotate:-3deg"><span class="x">✕</span><span data-k="p1"></span></div>
 <div class="pop" style="top:150px;rotate:4deg"><span class="x">✕</span><span data-k="p2"></span></div>
 <div class="pop" style="top:230px;rotate:-2deg;background:#FFE0D6"><span data-k="p3"></span></div></div></div>
<div class="phone pb z3" data-move="after-phone"><div class="scr">
 <div style="position:absolute;left:69px;top:90px;width:100px;height:100px;border-radius:50%;background:var(--accent)"><svg width="100" height="100"><path d="M28 52 l16 16 l30 -34" fill="none" stroke="#17140F" stroke-width="11" stroke-linecap="round" stroke-linejoin="round"/></svg></div>
 <div style="position:absolute;left:0;right:0;top:220px;text-align:center;font:800 30px/1.1 'Archivo'" data-k="done"></div>
 <div class="btn" style="left:24px;bottom:30px;width:190px;height:62px;font-size:26px" data-k="btn"></div></div></div>
</div><script src="../../lib/arrow.js"></script><script src="../../lib/bind.js"></script></body></html>
