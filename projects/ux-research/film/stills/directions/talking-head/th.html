<!doctype html>
<html><head><meta charset="utf-8"><title>Talking-head style frames</title>
<style>
@font-face { font-family: "Marker"; src: url(../_fonts/PermanentMarker-Regular.ttf); }
@font-face { font-family: "Hand"; src: url(../_fonts/Caveat.ttf); font-weight: 400 700; }
@font-face { font-family: "Grot"; src: url(../_fonts/SchibstedGrotesk.ttf); font-weight: 400 900; }
@font-face { font-family: "Type"; src: url(../_fonts/CourierPrime-Regular.ttf); }
@font-face { font-family: "Type"; src: url(../_fonts/CourierPrime-Bold.ttf); font-weight: 700; }
@font-face { font-family: "Serif"; src: url(../_fonts/YoungSerif-Regular.ttf); }
@font-face { font-family: "Mono"; src: url(../_fonts/JetBrainsMono.ttf); font-weight: 100 800; }
html, body { margin: 0; overflow: hidden; background: #111; }
#stage { position: relative; overflow: hidden; }
.big { font: 800 120px/0.9 "Grot"; letter-spacing: -5px; }
.sub { text-wrap: balance; font: 400 36px/48px "Type"; margin-top: 24px; }
.strip { font: 400 54px/1.12 "Serif"; color: #1B1B1F; background: #FBF7EE; padding: 16px 30px 20px; white-space: nowrap; box-shadow: 0 8px 14px -6px rgba(0,0,0,.35); }
.lab { font: 500 32px/1.3 "Mono"; white-space: nowrap; }
</style></head><body><div id="stage"></div>
<script src="../_tools/kit.js"></script>
<script src="../_tools/ux.js"></script>
<script>
// Talking-head (full edit) style frames over her REAL footage (frames from kit/UX research. .mov, never flipped).
// t=1 L5 half and half · t=2 L2 words behind her · t=3 L7 pop-around · t=4 L6 sticker on paper (B look)
const YEL = '#FFE15A', ORA = '#F26A2E', WALL = '#1D3A32';
const sc = [];
function shot(t, build) { const r = el('div', { left: 0, top: 0, width: W + 'px', height: H + 'px', display: 'none', overflow: 'hidden' }); sc.push([t, r]); build(r); }
on((t) => sc.forEach(([tt, r]) => (r.style.display = Math.abs(t - tt) < 0.5 ? 'block' : 'none')));
const img = (r, src, css) => { const i = el('img', css, '', r); i.src = src; return i; };
const still = (e, rot) => { e.style.opacity = 1; e.style.transform = `rotate(${rot}deg)`; e.style.boxShadow = '0 9px 16px -6px rgba(0,0,0,.42)'; };

// L5 · half and half (raw 1:15, "UX, on the other hand...")
shot(1, (r) => {
  el('div', { left: 0, top: 0, width: '960px', height: '1080px', background: WALL }, '', r);
  const vid = el('div', { left: '960px', top: 0, width: '960px', height: '1080px', overflow: 'hidden' }, '', r);
  img(vid, '../_src/h_75.jpg', { left: '-440px', top: 0, width: '1920px', height: '1080px' });
  const c = card(r, 70, 100, 860, 300, '<div class="big">UX</div><div class="sub">how the whole product feels to use</div>', { head: 150, lh: 48 }); still(c, -1.2);
  ['Can a user find what they’re looking for?', 'Does it make sense to the user?', 'Did the users get frustrated using it?', 'Did the user come back to use it?'].forEach((w, i) => {
    const n = sticky(r, 80 + (i % 2) * 320 + (i >= 2 ? 50 : 0), 450 + Math.floor(i / 2) * 300, 280, w, { bg: ORA, fs: 36 }); still(n, [3, -3, 2, -2][i]);
  });
});
// L2 · words behind her (raw 7:20, "...hammered into my ears during my first semester: what people say and what people do")
shot(2, (r) => {
  img(r, '../_src/h_440.jpg', { left: 0, top: 0, width: '1920px', height: '1080px' });
  el('div', { left: '330px', top: '150px', font: '400 380px/1 "Marker"', color: '#F4F0E6' }, 'say', r);
  el('div', { left: '1180px', top: '150px', font: '400 380px/1 "Marker"', color: ORA }, 'do', r);
  img(r, '../_src/m_440.png', { left: 0, top: 0, width: '1920px', height: '1080px' }); // her matte on top: words sit behind her
  const k = el('div', { left: '0', width: '1920px', top: '860px', textAlign: 'center' }, '', r);
  el('div', { position: 'relative', display: 'inline-block', font: '700 50px/1.2 "Type"', color: '#17140F', background: '#FFFDF6', padding: '14px 26px' }, 'are often very different', k).style.position = 'relative';
});
// L7 · pop-around (raw 8:50, the methods): sticky notes pop around her head as she names each one
shot(3, (r) => {
  img(r, '../_src/h_530.jpg', { left: 0, top: 0, width: '1920px', height: '1080px' });
  const L = [[110, 120], [150, 430], [110, 740], [1550, 110], [1590, 420], [1550, 730], [1250, 70]];
  ['user interviews', 'usability testing', 'surveys', 'contextual inquiry', 'diary studies', 'card sorting', 'A/B testing'].forEach((w, i) => {
    const n = sticky(r, L[i][0], L[i][1], 240, w, { bg: i === 5 ? ORA : YEL, fs: 38 }); still(n, [-4, 3, -2, 4, -3, 2, -5][i]);
  });
});
// L6 · sticker on paper, B look (raw 5:47, "For my thesis, I'm doing generative research")
shot(4, (r) => {
  el('div', { left: 0, top: 0, width: '1920px', height: '1080px', background: '#8EC5E8' }, '', r);
  const her = img(r, '../_src/m_350.png', { left: '640px', top: '60px', width: '1920px', height: '1080px' });
  her.style.filter = 'drop-shadow(6px 0 0 #FBF7EE) drop-shadow(-6px 0 0 #FBF7EE) drop-shadow(0 6px 0 #FBF7EE) drop-shadow(0 -6px 0 #FBF7EE) drop-shadow(0 14px 10px rgba(0,0,0,.25))';
  const tagE = el('div', { left: '120px', top: '150px', font: '500 36px/1 "Mono"', color: '#1B1B1F', background: '#FFE15A', padding: '12px 18px' }, '01 / 03', r);
  const s1 = el('div', { left: '120px', top: '250px', transform: 'rotate(-1.2deg)' }, 'Generative: early,', r); s1.className = 'strip'; s1.style.fontSize = '62px';
  const s2 = el('div', { left: '120px', top: '370px', transform: 'rotate(0.8deg)' }, 'before anything is designed.', r); s2.className = 'strip'; s2.style.fontSize = '62px';
  const s3 = el('div', { left: '120px', top: '560px', transform: 'rotate(-0.6deg)', background: '#1B1B1F', color: '#FBF7EE' }, 'Evaluative: later, after there is a design.', r); s3.className = 'strip'; s3.style.background = '#1B1B1F'; s3.style.color = '#FBF7EE'; s3.style.fontSize = '44px';
});
window.crisp = () => false;
</script></body></html>
