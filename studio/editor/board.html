<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Board</title>
<link rel="stylesheet" href="/studio/runtime/fonts.css">
<style>
:root{--bg:#111114;--fg:#EDE9E2;--mid:#8A8780;--line:#2B2B31;--card:#18181D;--acc:#6E8CFF;--like:#22E08A;--no:#6B6A66}
*{box-sizing:border-box}
body{margin:0;background:var(--bg);color:var(--fg);font:16px/1.5 Archivo,system-ui,sans-serif}
main{padding:40px clamp(16px,4vw,56px) 96px}
a{color:var(--acc)}
h1{font:800 64px/0.92 "Bricolage Grotesque",sans-serif;letter-spacing:-0.03em;text-transform:uppercase;margin:0 0 10px}
.k{font:500 13px "DM Mono",monospace;letter-spacing:.14em;text-transform:uppercase;color:var(--mid);margin:0 0 6px}
.count{font:800 30px/1.1 "Bricolage Grotesque",sans-serif;letter-spacing:-0.02em;margin:22px 0 0}
.count span{color:var(--like)}
.filters{display:flex;gap:6px 18px;flex-wrap:wrap;margin:24px 0 8px;border-bottom:1px solid var(--line);padding-bottom:12px}
.filters button{background:none;border:0;color:var(--mid);font:500 13px "DM Mono",monospace;letter-spacing:.12em;text-transform:uppercase;cursor:pointer;padding:4px 0}
.filters button[aria-pressed=true]{color:var(--fg);border-bottom:2px solid var(--fg)}
.filters .sep{width:1px;background:var(--line);margin:0 4px}
.size{margin-left:auto;display:flex;gap:10px;align-items:center}
/* masonry: pictures keep their own shape */
.grid{display:flex;gap:24px;align-items:flex-start;margin-top:28px}.grid .col{flex:1;min-width:0}
@media (max-width:760px){h1{font-size:44px}.grid{gap:12px}}
.card{break-inside:avoid;margin:0 0 28px;padding-top:10px;border-top:1px solid var(--line)}
.card.like{border-top:3px solid var(--like)}
.card.no{opacity:.4}
.card a.pic{display:block;background:var(--card)}
.card img{width:100%;display:block}
.num{font:600 14px "DM Mono",monospace;color:var(--fg);letter-spacing:.04em}
.grp{font:500 11px "DM Mono",monospace;letter-spacing:.12em;text-transform:uppercase;color:var(--mid);margin:8px 0 0}
.act{display:flex;gap:8px;flex-wrap:wrap;align-items:center;margin-top:8px}
.act button{background:none;border:1px solid var(--line);color:var(--fg);font:600 13px Archivo,sans-serif;padding:6px 10px;cursor:pointer}
.act button:hover{border-color:var(--fg)}
.act button.on[data-p=like]{background:var(--like);border-color:var(--like);color:#111}
.act button.on[data-p=no]{background:var(--no);border-color:var(--no);color:#111}
.act .nb{margin-left:auto}
textarea{width:100%;min-height:44px;margin-top:8px;background:var(--card);color:var(--fg);border:1px solid var(--line);font:14px Archivo,sans-serif;padding:8px;resize:vertical}
textarea[hidden]{display:none}
.saved{font:500 12px "DM Mono",monospace;color:var(--like)}
.empty{color:var(--mid);margin-top:40px}
</style>
</head>
<body>
<main>
  <p class="k"><a href="/">← Studio</a> &nbsp;·&nbsp; <a href="/ideas/formats/">Shorts formats</a> &nbsp;·&nbsp; <a href="/ideas/boards/thumbnails/">Thumbnail board</a> &nbsp;·&nbsp; <a href="/ideas/boards/design/">Design board</a> &nbsp;·&nbsp; <a href="/ideas/boards/fonts/">Font board</a></p>
  <h1 id="title">Board</h1>
  <p class="k" id="sub"></p>
  <p class="count" id="count"></p>
  <div class="filters" id="filters"></div>
  <div class="grid" id="list"></div>
</main>
<script>
const board = location.pathname.split('/').filter(Boolean)[2];
let items = [], picks = {}, groups = [], filter = 'all', colw = 300;
const KEY = 'board.' + board;
try { filter = localStorage.getItem(KEY + '.filter') || 'all'; colw = +localStorage.getItem(KEY + '.colw') || (board === 'design' ? 230 : board === 'fonts' ? 420 : 320); } catch (e) { colw = board === 'design' ? 230 : board === 'fonts' ? 420 : 320; }
const esc = s => String(s ?? '').replace(/[&<>"]/g, c => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;' }[c]));
const pk = id => (picks[id] && picks[id].pick === 'no') ? 'no' : 'like';   // liked by default (her rule 2026-11-09); she only marks "Not for me"
const NAME = board === 'design' ? 'Design' : board === 'thumbnails' ? 'Thumbnails' : board === 'fonts' ? 'Font' : board;
const CAN_NO = board === 'fonts';   // font board only: she marks the fonts/colours she dislikes (her ask 2026-11-12)
const src = i => `/ideas/boards/${board}/img/${encodeURIComponent(i.img)}`;

function card(i) {
  const p = pk(i.id), note = (picks[i.id] && picks[i.id].note) || '';
  return `<article class="card${CAN_NO && p === 'no' ? ' no' : ''}" data-id="${esc(i.id)}">
    <a class="pic" href="${src(i)}" target="_blank"><img loading="lazy" src="${src(i)}" alt=""></a>
    <p class="grp"><b class="num">${esc(NAME)} ${items.indexOf(i) + 1}</b> · ${esc(i.group)}</p>
    ${CAN_NO && i.title ? `<p class="grp" style="color:var(--fg);text-transform:none;letter-spacing:.02em">${esc(i.title)}</p>` : ''}
    <div class="act">${CAN_NO ? `<button data-p="no" class="${p === 'no' ? 'on' : ''}" aria-pressed="${p === 'no'}">${p === 'no' ? 'Not for me ✓' : 'Not for me'}</button>` : ''}<button class="nb" data-note>${note ? 'Note ✓' : '+ Note'}</button><span class="saved" hidden>Saved</span></div>
    <textarea placeholder="What you like or don't" ${note ? '' : 'hidden'}>${esc(note)}</textarea>
  </article>`;
}

function render_count() {
  const no = items.filter(i => pk(i.id) === 'no').length;
  document.getElementById('count').textContent = CAN_NO
    ? `${items.length} specimens · tap "Not for me" on any font or colour mix you don't like (${no} marked so far) · quote a number, e.g. ${NAME} 12`
    : `${items.length} pictures · everything here works (that's why it's on the board) · quote a number, e.g. ${NAME} 27`;
}
function render() {
  const liked = items.filter(i => pk(i.id) === 'like').length, no = items.filter(i => pk(i.id) === 'no').length;
  render_count();
  const n = g => items.filter(i => i.group === g).length;
  const btn = (k, l, c) => `<button data-f="${esc(k)}" aria-pressed="${k === filter}">${esc(l)} ${c}</button>`;
  document.getElementById('filters').innerHTML = btn('all', 'All', items.length)
    + '<span class="sep"></span>' + groups.map(g => btn('g:' + g, g, n(g))).join('')
    + `<span class="size"><button data-z="-1" aria-pressed="false">Smaller</button><button data-z="1" aria-pressed="false">Bigger</button></span>`;
  const shown = items.filter(i => filter === 'all' || 'g:' + i.group === filter);
  const list = document.getElementById('list'); list.style.setProperty('--colw', colw + 'px');
  // numbers read left to right: item k goes to column k % n (masonry by columns would scramble the order)
  const ncol = Math.max(1, Math.floor((list.clientWidth + 24) / (colw + 24))); const cols = Array.from({ length: ncol }, () => []);
  shown.forEach((i, k) => cols[k % ncol].push(card(i)));
  list.innerHTML = shown.length ? cols.map(c => `<div class="col">${c.join('')}</div>`).join('') : '<p class="empty">Nothing here yet.</p>';
}

async function save(id, body) {
  const r = await fetch(`/api/boards/${board}/${encodeURIComponent(id)}`, { method: 'POST', headers: { 'content-type': 'application/json' }, body: JSON.stringify(body) });
  if (!r.ok) throw new Error('save failed');
  picks[id] = await r.json();
}
function flash(c) { const s = c.querySelector('.saved'); s.hidden = false; setTimeout(() => s.hidden = true, 1200); }

document.addEventListener('click', async e => {
  const f = e.target.closest('[data-f]');
  if (f) { filter = f.dataset.f; try { localStorage.setItem(KEY + '.filter', filter); } catch (er) {} return render(); }
  const z = e.target.closest('[data-z]');
  if (z) { colw = Math.max(150, Math.min(640, colw + 70 * +z.dataset.z)); try { localStorage.setItem(KEY + '.colw', colw); } catch (er) {} return render(); }
  const nb = e.target.closest('[data-note]');
  if (nb) { const t = nb.closest('.card').querySelector('textarea'); t.hidden = false; t.focus(); return; }
  const b = e.target.closest('.act button[data-p]'); if (!b) return;
  const c = b.closest('.card'), id = c.dataset.id;
  const p = (b.dataset.p === 'no' && c.classList.contains('no')) ? '' : b.dataset.p;   // tap again to undo
  try {
    await save(id, { pick: p });
    c.className = 'card ' + p; c.querySelectorAll('.act button[data-p]').forEach(x => { const on = x.dataset.p === p; x.classList.toggle('on', on); x.setAttribute('aria-pressed', on); if (x.dataset.p === 'no') x.textContent = on ? 'Not for me ✓' : 'Not for me'; });
    if (CAN_NO) render_count();
    if (filter !== 'all' && !filter.startsWith('g:')) { const keep = window.scrollY; render(); window.scrollTo(0, keep); }
  } catch (er) { alert('Could not save. Is the studio still running?'); }
});
const timers = {};
document.addEventListener('input', e => {
  if (e.target.tagName !== 'TEXTAREA') return;
  const c = e.target.closest('.card'), id = c.dataset.id; clearTimeout(timers[id]);
  timers[id] = setTimeout(async () => { try { await save(id, { note: e.target.value }); flash(c); c.querySelector('[data-note]').textContent = e.target.value ? 'Note ✓' : '+ Note'; } catch (er) {} }, 600);
});

let _rz; window.addEventListener('resize', () => { clearTimeout(_rz); _rz = setTimeout(render, 200); });
fetch('/api/boards/' + board).then(r => r.ok ? r.json() : Promise.reject()).then(d => {
  items = d.items || []; picks = d.picks || {}; groups = d.groups || [...new Set(items.map(i => i.group))];
  document.title = d.title || 'Board'; document.getElementById('title').textContent = d.title || 'Board';
  document.getElementById('sub').textContent = d.subtitle || ''; render();
}).catch(() => { document.getElementById('list').innerHTML = '<p class="empty">This board was not found.</p>'; });
</script>
</body>
</html>
