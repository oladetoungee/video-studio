<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Kit</title>
<link rel="stylesheet" href="/studio/runtime/fonts.css">
<style>
:root{--bg:#111114;--fg:#EDE9E2;--mid:#8A8780;--line:#2B2B31;--card:#18181D;--acc:#6E8CFF;--ok:#22E08A}
*{box-sizing:border-box}
body{margin:0;background:var(--bg);color:var(--fg);font:17px/1.6 Archivo,system-ui,sans-serif}
a{color:var(--acc)}
.wrap{display:grid;grid-template-columns:280px minmax(0,1fr);gap:48px;max-width:1280px;margin:0 auto;padding:40px clamp(16px,4vw,48px) 120px}
@media (max-width:900px){.wrap{grid-template-columns:1fr}nav.toc{position:static!important;max-height:none!important}}
nav.toc{position:sticky;top:24px;align-self:start;max-height:calc(100vh - 48px);overflow:auto;font-size:14px;line-height:1.35;border-right:1px solid var(--line);padding-right:16px}
nav.toc .k{font:500 12px "DM Mono",monospace;letter-spacing:.14em;text-transform:uppercase;color:var(--mid);margin:0 0 14px}
nav.toc a{display:block;color:var(--fg);text-decoration:none;padding:5px 0}
nav.toc a.h3{padding-left:14px;color:var(--mid);font-size:13px}
nav.toc a:hover{color:var(--acc)}
.top{font:500 12px "DM Mono",monospace;letter-spacing:.14em;text-transform:uppercase;color:var(--mid);margin:0 0 18px}
.top span{color:var(--ok)}
article h1{font:800 52px/0.98 "Bricolage Grotesque",sans-serif;letter-spacing:-0.03em;margin:0 0 18px}
article h2{font:800 34px/1.05 "Bricolage Grotesque",sans-serif;letter-spacing:-0.02em;margin:56px 0 14px;padding-top:18px;border-top:1px solid var(--line)}
article h3{font:700 22px/1.2 Archivo,sans-serif;margin:34px 0 10px}
article h4{font:700 18px Archivo,sans-serif;margin:24px 0 8px}
article p,article li{max-width:76ch}
article blockquote{margin:16px 0;padding:10px 18px;border-left:3px solid var(--acc);background:var(--card)}
article code{font:14px "DM Mono",monospace;background:var(--card);padding:1px 5px;border-radius:4px}
article pre{position:relative;background:var(--card);border:1px solid var(--line);padding:16px 18px;white-space:pre-wrap;word-break:break-word;font:14px/1.55 "DM Mono",monospace;margin:14px 0}
article pre code{background:none;padding:0}
article table{border-collapse:collapse;margin:14px 0;font-size:15px;display:block;overflow-x:auto}
article th,article td{border:1px solid var(--line);padding:8px 10px;text-align:left;vertical-align:top}
article th{background:var(--card);font-weight:700}
article img{max-width:min(100%,640px);display:block;margin:12px 0;border:1px solid var(--line)}
article hr{border:0;border-top:1px solid var(--line);margin:32px 0}
.copy{position:absolute;top:8px;right:8px;background:var(--bg);color:var(--fg);border:1px solid var(--line);font:600 13px Archivo,sans-serif;padding:5px 10px;cursor:pointer}
.copy:hover{border-color:var(--fg)}.copy.done{background:var(--ok);color:#111;border-color:var(--ok)}
.empty{color:var(--mid)}
</style>
</head>
<body>
<div class="wrap">
  <nav class="toc" id="toc"><p class="k"><a href="/" style="display:inline;color:var(--acc)">← Studio</a></p></nav>
  <main>
    <p class="top" id="meta">Loading the kit…</p>
    <article id="doc"></article>
  </main>
</div>
<script src="https://cdn.jsdelivr.net/npm/marked@12.0.2/marked.min.js"></script>
<script>
const slug = location.pathname.split('/').filter(Boolean)[1];
const base = `/p/${slug}/kit/`;
let shown = '';
const esc = s => String(s).replace(/[&<>"]/g, c => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;' }[c]));
const rel = u => (!u || /^(https?:|mailto:|#|\/)/.test(u)) ? u : base + u;   // paths in the kit are relative to projects/<slug>/kit/
const slugify = (s, used) => { let id = s.toLowerCase().replace(/<[^>]+>/g, '').replace(/[^a-z0-9]+/g, '-').replace(/^-|-$/g, '') || 'part'; let k = id, n = 2; while (used.has(k)) k = id + '-' + n++; used.add(k); return k; };

function render(md, mtime) {
  const doc = document.getElementById('doc');
  if (window.marked) {
    doc.innerHTML = marked.parse(md, { gfm: true, breaks: false });
  } else {
    doc.innerHTML = '<pre>' + esc(md) + '</pre>';   // offline: plain text, still readable and copyable
  }
  doc.querySelectorAll('img').forEach(i => { i.src = rel(i.getAttribute('src')); i.loading = 'lazy'; });
  doc.querySelectorAll('a[href]').forEach(a => { const h = a.getAttribute('href'); if (!/^(https?:|mailto:|#|\/)/.test(h)) { a.href = rel(h); } if (/^https?:/.test(h)) a.target = '_blank'; });
  // a Copy button on every block she pastes somewhere (description, tags, captions, posts)
  doc.querySelectorAll('pre').forEach(pre => { const b = document.createElement('button'); b.className = 'copy'; b.textContent = 'Copy';
    b.onclick = async () => { const t = pre.querySelector('code') ? pre.querySelector('code').innerText : pre.innerText.replace(/Copy(ied)?$/, '');
      try { await navigator.clipboard.writeText(t.replace(/\n$/, '')); } catch (e) { const r = document.createRange(); r.selectNodeContents(pre); getSelection().removeAllRanges(); getSelection().addRange(r); document.execCommand('copy'); }
      b.textContent = 'Copied'; b.classList.add('done'); setTimeout(() => { b.textContent = 'Copy'; b.classList.remove('done'); }, 1400); };
    pre.appendChild(b); });
  // contents list from the headings
  const used = new Set(), toc = document.getElementById('toc'); toc.querySelectorAll('a.h2,a.h3').forEach(a => a.remove());
  doc.querySelectorAll('h2, h3').forEach(h => { h.id = slugify(h.textContent, used); const a = document.createElement('a'); a.href = '#' + h.id; a.className = h.tagName.toLowerCase(); a.textContent = h.textContent; toc.appendChild(a); });
  const h1 = doc.querySelector('h1'); document.title = (h1 ? h1.textContent.replace(/^Refined kit:\s*/i, '') : slug) + ' · Kit';
  document.getElementById('meta').innerHTML = `projects/${esc(slug)}/kit/refined-kit.md · saved <span>${new Date(mtime).toLocaleString()}</span> · updates by itself`;
  if (location.hash) { const t = document.getElementById(location.hash.slice(1)); if (t) t.scrollIntoView(); }
}

async function load(first) {
  try {
    const r = await fetch(`/api/${slug}/kit`); if (!r.ok) throw 0; const d = await r.json();
    if (d.md === shown) return; const y = window.scrollY; shown = d.md; render(d.md, d.mtime); if (!first) window.scrollTo(0, y);
  } catch (e) { if (first) { document.getElementById('meta').textContent = 'No refined kit for this video yet.'; } }
}
load(true); setInterval(() => load(false), 8000);
</script>
</body>
</html>
